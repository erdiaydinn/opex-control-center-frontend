name: EAY Roadmap 1-20 Exact-Head Acceptance

on:
  pull_request:
    branches: [product/eay-product-completion-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EAY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prior-1-19:
    name: Require roadmap 1-19 GREEN on same exact head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for exact-head 1-19 cumulative gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..180}; do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/eay-roadmap-1-19-exact-head.yml/runs?event=pull_request&per_page=30" --jq ".workflow_runs | map(select(.head_sha == \"$EAY_EXACT_HEAD\")) | sort_by(.id) | last | [.status,.conclusion] | @tsv")"
            echo "prior_1_19=$row"
            status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 8
          done
          echo 'timed out waiting for roadmap 1-19 exact-head gate' >&2
          exit 1

  concept-graph-authority:
    name: Item 20 typed concept graph and ambiguity context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eay_glossary_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eay_glossary_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EAY_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$EAY_EXACT_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install canonical backend dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Prove alias graph resolution and safe ambiguity context
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q \
            backend/tests/test_business_glossary_resolver.py \
            backend/tests/test_business_glossary_consumers.py \
            backend/tests/test_business_glossary_single_consumer_authority.py \
            backend/tests/test_business_glossary_item20_concept_graph.py
      - name: Apply governed glossary graph persistence
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/007_business_glossary.sql
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/016_business_glossary_lifecycle_authority.sql
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/017_business_glossary_concept_graph.sql
      - name: Prove graph payload validation and effective immutability
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO glossary_terms(
            tenant_id,concept_id,canonical_key,domain,version,status,display_name,short_definition,
            alias_bindings,concept_relations,owner_subject
          ) VALUES (
            'tenant-a','goods-receiving','goods_receiving','inbound',1,'draft',
            '{"en":"Goods Receiving"}','{"en":"Inbound goods receiving"}',
            '[{"kind":"synonym","value":"mal kabul"},{"kind":"acronym","value":"GR"}]',
            '[{"kind":"parent","target_concept_id":"inbound-operations"},{"kind":"related","target_concept_id":"putaway"}]',
            'semantic-governance'
          );
          SQL
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "INSERT INTO glossary_terms(tenant_id,concept_id,canonical_key,version,status,display_name,short_definition,alias_bindings,owner_subject) VALUES ('tenant-a','bad-alias','bad_alias',1,'draft','{\"en\":\"Bad\"}','{\"en\":\"Bad\"}','[{\"kind\":\"nickname\",\"value\":\"bad\"}]','semantic-governance');"; then
            echo 'invalid alias kind unexpectedly succeeded' >&2; exit 1
          fi
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "INSERT INTO glossary_terms(tenant_id,concept_id,canonical_key,version,status,display_name,short_definition,concept_relations,owner_subject) VALUES ('tenant-a','self-parent','self_parent',1,'draft','{\"en\":\"Self\"}','{\"en\":\"Self\"}','[{\"kind\":\"parent\",\"target_concept_id\":\"self-parent\"}]','semantic-governance');"; then
            echo 'self relation unexpectedly succeeded' >&2; exit 1
          fi
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE glossary_terms SET status='review' WHERE tenant_id='tenant-a' AND concept_id='goods-receiving' AND version=1;
          UPDATE glossary_terms SET status='approved' WHERE tenant_id='tenant-a' AND concept_id='goods-receiving' AND version=1;
          UPDATE glossary_terms SET status='effective', effective_from='2026-08-17T00:00:00Z'
            WHERE tenant_id='tenant-a' AND concept_id='goods-receiving' AND version=1;
          SQL
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET alias_bindings='[{\"kind\":\"synonym\",\"value\":\"receiving changed\"}]' WHERE tenant_id='tenant-a' AND concept_id='goods-receiving' AND version=1;"; then
            echo 'effective alias graph mutation unexpectedly succeeded' >&2; exit 1
          fi
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET concept_relations='[{\"kind\":\"related\",\"target_concept_id\":\"inventory\"}]' WHERE tenant_id='tenant-a' AND concept_id='goods-receiving' AND version=1;"; then
            echo 'effective concept relation mutation unexpectedly succeeded' >&2; exit 1
          fi
          test "$(psql -h localhost -U postgres -d eay_glossary_ci -Atc "SELECT alias_bindings->0->>'value' FROM glossary_terms WHERE tenant_id='tenant-a' AND concept_id='goods-receiving' AND version=1")" = 'mal kabul'
      - name: Preserve production truth boundary
        run: |
          echo 'item20_repository_acceptance=true'
          echo 'typed_synonym_acronym_graph=true'
          echo 'typed_parent_related_graph=true'
          echo 'ambiguity_context_tenant_safe=true'
          echo 'production_ready=false'

  accepted:
    name: Roadmap 1-20 exact-head repository acceptance
    runs-on: ubuntu-latest
    needs: [prior-1-19, concept-graph-authority]
    steps:
      - run: |
          echo "exact_head=$EAY_EXACT_HEAD"
          echo 'roadmap_1_19_exact_head_green=true'
          echo 'item20_repository_software_acceptance=true'
          echo 'production_ready=false'
          echo 'external_evidence_not_substituted=true'
