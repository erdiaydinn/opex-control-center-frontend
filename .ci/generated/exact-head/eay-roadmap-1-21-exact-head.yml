name: EAY Roadmap 1-21 Exact-Head Acceptance

on:
  pull_request:
    branches: [product/eay-product-completion-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EAY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prior-1-20:
    name: Require roadmap 1-20 GREEN on same exact head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for exact-head 1-20 cumulative gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..180}; do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/eay-roadmap-1-20-exact-head.yml/runs?event=pull_request&per_page=30" --jq ".workflow_runs | map(select(.head_sha == \"$EAY_EXACT_HEAD\")) | sort_by(.id) | last | [.status,.conclusion] | @tsv")"
            status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
            echo "prior_1_20=$row"
            if [ "$status" = completed ]; then test "$conclusion" = success; exit 0; fi
            sleep 8
          done
          echo 'timed out waiting for roadmap 1-20 exact-head gate' >&2
          exit 1

  bulk-import-review:
    name: Item 21 bulk import diff and review authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eay_glossary_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eay_glossary_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EAY_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$EAY_EXACT_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Prove CSV/API deterministic diff and draft-only import planning
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_business_glossary_item21_bulk_import.py backend/tests/test_business_glossary_governance.py
      - name: Apply glossary governance and import evidence migrations
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/007_business_glossary.sql
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/016_business_glossary_lifecycle_authority.sql
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/017_business_glossary_concept_graph.sql
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/018_business_glossary_bulk_import_review.sql
      - name: Prove review evidence is tenant-bound append-only and cannot auto-promote
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE glossary_import_a LOGIN PASSWORD 'runtime_a' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE glossary_import_b LOGIN PASSWORD 'runtime_b' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          INSERT INTO glossary_tenant_bindings(role_name,tenant_id) VALUES ('glossary_import_a','tenant-a'),('glossary_import_b','tenant-b');
          GRANT USAGE ON SCHEMA public TO glossary_import_a, glossary_import_b;
          GRANT SELECT, INSERT, UPDATE, DELETE ON glossary_import_batches, glossary_import_entries TO glossary_import_a, glossary_import_b;
          GRANT EXECUTE ON FUNCTION glossary_current_tenant() TO glossary_import_a, glossary_import_b;
          SQL
          batch_id="$(PGPASSWORD=runtime_a psql -qAt -h localhost -U glossary_import_a -d eay_glossary_ci -c "INSERT INTO glossary_import_batches(tenant_id,fingerprint,source_kind,actor_subject,row_count) VALUES ('tenant-a','fp-item21','csv','owner-1',1) RETURNING batch_id")"
          test -n "$batch_id"
          PGPASSWORD=runtime_a psql -h localhost -U glossary_import_a -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "INSERT INTO glossary_import_entries(batch_id,tenant_id,entry_no,concept_id,canonical_key,action,source_version,proposed_version,diff,proposed_term) VALUES ('$batch_id','tenant-a',1,'nsfr','nsfr','new_version_draft',1,2,'[{\"field\":\"formula\",\"before\":\"old\",\"after\":\"new\"}]','{\"status\":\"draft\",\"version\":2}')"
          test "$(PGPASSWORD=runtime_a psql -qAt -h localhost -U glossary_import_a -d eay_glossary_ci -c "SELECT automatic_effective_permitted FROM glossary_import_batches WHERE batch_id='$batch_id'")" = f
          test "$(PGPASSWORD=runtime_b psql -qAt -h localhost -U glossary_import_b -d eay_glossary_ci -c "SELECT count(*) FROM glossary_import_batches WHERE batch_id='$batch_id'")" = 0
          if PGPASSWORD=runtime_b psql -h localhost -U glossary_import_b -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "INSERT INTO glossary_import_entries(batch_id,tenant_id,entry_no,concept_id,canonical_key,action) VALUES ('$batch_id','tenant-b',2,'x','x','no_change')"; then echo 'cross-tenant batch linkage succeeded' >&2; exit 1; fi
          if PGPASSWORD=runtime_a psql -h localhost -U glossary_import_a -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_import_batches SET row_count=2 WHERE batch_id='$batch_id'"; then echo 'append-only batch mutation succeeded' >&2; exit 1; fi
          if PGPASSWORD=runtime_a psql -h localhost -U glossary_import_a -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_import_entries SET action='no_change' WHERE batch_id='$batch_id' AND entry_no=1"; then echo 'append-only entry mutation succeeded' >&2; exit 1; fi
      - name: Preserve truth boundary
        run: |
          echo 'item21_repository_acceptance=true'
          echo 'csv_api_same_plan=true'
          echo 'effective_in_place_mutation=false'
          echo 'changed_effective_creates_draft_v_plus_1=true'
          echo 'automatic_effective_permitted=false'
          echo 'production_ready=false'

  accepted:
    name: Roadmap 1-21 exact-head repository acceptance
    runs-on: ubuntu-latest
    needs: [prior-1-20, bulk-import-review]
    steps:
      - run: |
          echo "exact_head=$EAY_EXACT_HEAD"
          echo 'roadmap_1_20_exact_head_green=true'
          echo 'item21_repository_software_acceptance=true'
          echo 'production_ready=false'
