name: EAY Academy CI

on:
  push:
    branches: [product/academy-canonical-v1, 'product/academy-canonical-**']
  pull_request:
    branches: [feature/phase-1-security-hardening]
    paths:
      - 'services/core-api/app/modules/academy/**'
      - 'services/core-api/app/main_academy.py'
      - 'services/core-api/alembic/versions/0009_academy_foundation.py'
      - 'services/core-api/alembic/versions/0010_academy_audit_idempotency.py'
      - 'services/core-api/tests/test_academy_*.py'
      - 'services/core-api/Dockerfile'
      - '.github/workflows/academy-ci.yml'
      - 'docs/ACADEMY_*.md'
      - 'ops/load/k6-academy-*.js'

permissions:
  contents: read

concurrency:
  group: academy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-postgres:
    name: Academy PostgreSQL / RLS / lifecycle
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e './services/core-api[dev]'
      - name: Create RLS-bound runtime role
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  if not await c.fetchval("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')"):
                      await c.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
              finally: await c.close()
          asyncio.run(main())
          PY
      - name: Compile Academy
        run: python -m compileall -q services/core-api/app/modules/academy services/core-api/app/main_academy.py services/core-api/tests/test_academy_contracts.py services/core-api/tests/test_academy_integration.py services/core-api/tests/test_academy_concurrency.py
      - name: Migrate through Academy head
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Assert head, FORCE RLS and runtime posture
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  assert await c.fetchval('SELECT version_num FROM alembic_version') == '0010_academy_audit_idempotency'
                  rows=await c.fetch("SELECT relname,relrowsecurity,relforcerowsecurity FROM pg_class WHERE relname LIKE 'academy_%' AND relkind='r'")
                  assert rows and all(r['relrowsecurity'] and r['relforcerowsecurity'] for r in rows), rows
                  role=await c.fetchrow("SELECT rolsuper,rolbypassrls FROM pg_roles WHERE rolname='opex_runtime'")
                  assert role and not role['rolsuper'] and not role['rolbypassrls']
              finally: await c.close()
          asyncio.run(main())
          PY
      - name: Academy lifecycle gates
        run: pytest -q services/core-api/tests/test_academy_contracts.py services/core-api/tests/test_academy_integration.py services/core-api/tests/test_academy_concurrency.py
      - name: Full Platform Core regression on clean database
        env:
          OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_regression
          OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_regression
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/postgres')
              try:
                  if not await c.fetchval("SELECT EXISTS (SELECT 1 FROM pg_database WHERE datname='opex_regression')"):
                      await c.execute('CREATE DATABASE opex_regression')
              finally:
                  await c.close()
          asyncio.run(main())
          PY
          (cd services/core-api && alembic upgrade head)
          pytest -q services/core-api/tests

  academy-build:
    name: Academy composition / frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Restore pinned SheetJS vendor artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 --retry-all-errors \
            https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz \
            --output vendor/xlsx-0.20.3.tgz
          printf '%s  %s\n' \
            'a0b0eade3c3b01c2ea2961f60210a9553665f267fa5f661178ff8d7a1d12254cd5fc1759623b61f78b46e6da22301d4f3eb62dc4e09f6a850292fb6e1fedc024' \
            'vendor/xlsx-0.20.3.tgz' | sha512sum --check --strict
      - run: npm ci
      - run: npm run build
      - run: docker build -f services/core-api/Dockerfile services/core-api
      - run: grep -F 'app.main_academy:app' services/core-api/Dockerfile

  academy-dr-contract:
    name: Academy PostgreSQL dump / restore
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: opex_migrator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install and migrate
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          python -m pip install -e './services/core-api[dev]'
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
          (cd services/core-api && alembic upgrade head)
      - name: Seed, dump and restore
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          SET app.tenant_id='00000000-0000-0000-0000-00000000d001';
          INSERT INTO tenants(id,slug,display_name) VALUES('00000000-0000-0000-0000-00000000d001','dr-tenant','DR Tenant');
          INSERT INTO academy_content_items(tenant_id,content_type,slug,title_i18n,status,created_by) VALUES('00000000-0000-0000-0000-00000000d001','sop','dr-evidence','{"en":"DR evidence"}','published','ci');
          SQL
          pg_dump -h localhost -U opex_migrator -d opex_test --format=custom --no-owner --no-privileges -f /tmp/academy.dump
          createdb -h localhost -U opex_migrator opex_restore
          pg_restore -h localhost -U opex_migrator -d opex_restore --no-owner --no-privileges /tmp/academy.dump
          psql -h localhost -U opex_migrator -d opex_restore -v ON_ERROR_STOP=1 -c "SELECT 1 FROM academy_content_items WHERE slug='dr-evidence';"
          psql -h localhost -U opex_migrator -d opex_restore -v ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version WHERE version_num='0010_academy_audit_idempotency';"
