name: EAY Academy Convergence

on:
  push:
    branches:
      - release/platform-convergence-academy-v0.1
      - release/platform-convergence-v0.1
  pull_request:
    branches:
      - release/platform-convergence-v0.1

permissions:
  contents: read

concurrency:
  group: academy-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-postgres:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Create RLS-bound runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Full Core Ruff gate
        run: ruff check services/core-api
      - name: Central SQL execution boundary
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Compile Academy
        run: python -m compileall -q services/core-api/app/modules/academy services/core-api/tests/test_academy_contracts.py services/core-api/tests/test_academy_integration.py services/core-api/tests/test_academy_concurrency.py
      - name: Assert one cumulative Alembic head before migration
        working-directory: services/core-api
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t heads < <(alembic heads | awk '/\(head\)/ {print $1}')
          printf 'ALEMBIC_HEAD=%s\n' "${heads[@]}"
          test "${#heads[@]}" -eq 1
          test "${heads[0]}" = "0018_academy_product_roles"
      - name: Migrate through cumulative platform head
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Assert FORCE RLS and runtime posture
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  head = await connection.fetchval("SELECT version_num FROM alembic_version")
                  assert head == "0018_academy_product_roles", head
                  rows = await connection.fetch(
                      "SELECT relname,relrowsecurity,relforcerowsecurity "
                      "FROM pg_class WHERE relname LIKE 'academy_%' AND relkind='r'"
                  )
                  assert rows
                  assert all(row["relrowsecurity"] and row["relforcerowsecurity"] for row in rows), rows
                  role = await connection.fetchrow(
                      "SELECT rolsuper,rolbypassrls FROM pg_roles WHERE rolname='opex_runtime'"
                  )
                  assert role and not role["rolsuper"] and not role["rolbypassrls"]
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Academy lifecycle gates
        run: pytest -q services/core-api/tests/test_academy_contracts.py services/core-api/tests/test_academy_integration.py services/core-api/tests/test_academy_concurrency.py

  platform-regression:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API with reviewed BigQuery SDK extra
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Create clean runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  await connection.execute(
                      """
                      CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                      """
                  )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Assert one cumulative Alembic head
        working-directory: services/core-api
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t heads < <(alembic heads | awk '/\(head\)/ {print $1}')
          test "${#heads[@]}" -eq 1
          test "${heads[0]}" = "0018_academy_product_roles"
      - name: Migrate clean database through cumulative platform head
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Full Platform Core regression on isolated state
        run: pytest -q services/core-api/tests

  academy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize pinned SheetJS dependency
        run: node scripts/ci/materialize-sheetjs.mjs
      - name: Validate Academy load contracts
        run: for f in ops/load/k6-academy-*.js; do node --check "$f"; done
      - run: npm ci
      - run: npm run test:platform
      - run: npm run build
      - name: Build current cumulative Core API image
        run: >-
          docker build
          --build-context planai=apps/planai/backend
          -f services/core-api/Dockerfile
          services/core-api
      - name: Verify single Core runtime composition
        run: |
          grep -F 'from app.modules.academy.router import router as academy_router' services/core-api/app/main.py
          grep -F 'app.include_router(academy_router)' services/core-api/app/main.py
          test ! -f services/core-api/app/main_academy.py

  academy-dr:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: opex_migrator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install PostgreSQL client and Core API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install -e "./services/core-api[dev]"
      - name: Migrate, seed, dump and restore Academy evidence
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
          (cd services/core-api && alembic heads | grep -qx '0018_academy_product_roles (head)')
          (cd services/core-api && alembic upgrade head)
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          SET app.tenant_id='00000000-0000-0000-0000-00000000d001';
          INSERT INTO tenants(id,slug,display_name)
          VALUES('00000000-0000-0000-0000-00000000d001','academy-dr','Academy DR');
          INSERT INTO academy_content_items(tenant_id,content_type,slug,title_i18n,status,created_by)
          VALUES('00000000-0000-0000-0000-00000000d001','sop','dr-evidence','{"en":"DR evidence"}','published','ci');
          SQL
          pg_dump -h localhost -U opex_migrator -d opex_test --format=custom --no-owner --no-privileges -f /tmp/academy.dump
          createdb -h localhost -U opex_migrator opex_restore
          pg_restore -h localhost -U opex_migrator -d opex_restore --no-owner --no-privileges /tmp/academy.dump
          psql -h localhost -U opex_migrator -d opex_restore -Atc "SELECT count(*) FROM academy_content_items WHERE slug='dr-evidence';" | grep -qx 1
          psql -h localhost -U opex_migrator -d opex_restore -Atc "SELECT version_num FROM alembic_version;" | grep -qx 0018_academy_product_roles
