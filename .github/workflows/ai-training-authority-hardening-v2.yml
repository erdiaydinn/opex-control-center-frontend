name: EAY AI Training Authority Hardening V2

on:
  push:
    branches:
      - release/platform-convergence-ai-training-v0.1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-ai-training-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - name: Reapply reviewed V1 patch steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ai-training-authority-hardening.yml')
          text = workflow.read_text(encoding='utf-8').splitlines()
          wanted = {
              'Apply fail-closed training authority patch',
              'Adapt promotion tests to real observed local artifact receipts',
              'Add explicit bypass and receipt regression tests',
          }
          scripts = []
          i = 0
          while i < len(text):
              stripped = text[i].strip()
              if stripped.startswith('- name: '):
                  name = stripped.removeprefix('- name: ')
                  if name in wanted:
                      j = i + 1
                      while j < len(text) and text[j].strip() != 'run: |':
                          j += 1
                      if j == len(text):
                          raise RuntimeError(f'run block not found: {name}')
                      j += 1
                      block = []
                      while j < len(text):
                          line = text[j]
                          if line.startswith('          '):
                              block.append(line[10:])
                              j += 1
                              continue
                          if not line.strip():
                              block.append('')
                              j += 1
                              continue
                          break
                      scripts.append((name, '\n'.join(block) + '\n'))
                      i = j
                      continue
              i += 1
          if {name for name, _ in scripts} != wanted:
              raise RuntimeError(f'missing patch blocks: {wanted - {name for name, _ in scripts}}')
          ordered = [
              'Apply fail-closed training authority patch',
              'Adapt promotion tests to real observed local artifact receipts',
              'Add explicit bypass and receipt regression tests',
          ]
          mapping = dict(scripts)
          output = Path('/tmp/ai-training-v1-patches.sh')
          output.write_text('\n'.join(mapping[name] for name in ordered), encoding='utf-8')
          PY
          bash /tmp/ai-training-v1-patches.sh
      - name: Fix circular export authority and promotion arity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('services/eay-ai-core')

          guard = root / 'app/learning_export_guard.py'
          source = guard.read_text(encoding='utf-8')
          source = source.replace('import json\n', 'import json\nimport os\n', 1)
          old_import = 'from .main import settings, store as candidate_store\n'
          assert source.count(old_import) == 1
          source = source.replace(
              old_import,
              '\n\ndef _candidate_store():\n'
              '    # Lazy resolution avoids main <-> export-guard import cycles while\n'
              '    # retaining the one canonical interaction/candidate store.\n'
              '    from .main import store\n\n'
              '    return store\n',
          )
          source = source.replace(
              '        row = candidate_store.candidate_context(candidate_id)\n',
              '        row = _candidate_store().candidate_context(candidate_id)\n',
          )
          source = source.replace(
              '    exported = candidate_store.export_approved()\n',
              '    candidate_store = _candidate_store()\n'
              '    exported = candidate_store.export_approved()\n',
          )
          source = source.replace(
              'review_store = LearningExportReviewStore(settings.db_path)\n',
              'review_store = LearningExportReviewStore(\n'
              '    Path(os.getenv("EAY_AI_DB_PATH", "./data/eay_ai.db"))\n'
              ')\n',
          )
          guard.write_text(source, encoding='utf-8')

          promotion = root / 'app/model_promotion_gate.py'
          source = promotion.read_text(encoding='utf-8')
          old = 'VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
          assert source.count(old) == 1
          source = source.replace(old, 'VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)')
          promotion.write_text(source, encoding='utf-8')
          PY
      - name: Install AI Core
        working-directory: services/eay-ai-core
        run: python -m pip install -e '.[dev]'
      - name: Compile
        working-directory: services/eay-ai-core
        run: python -m compileall -q app tests
      - name: Authority-focused regression
        working-directory: services/eay-ai-core
        run: >-
          pytest -q
          tests/test_training_execution.py
          tests/test_training_authority.py
          tests/test_model_registry.py
          tests/test_model_artifact_promotion.py
          tests/test_learning_export_guard.py
          tests/test_training_manifest.py
      - name: Full AI Core regression
        working-directory: services/eay-ai-core
        run: pytest -q
      - name: Static authority assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'app.include_router(learning_export_router)' services/eay-ai-core/app/main.py
          ! grep -F 'return {"format": "chat_sft", "examples": store.export_approved()}' services/eay-ai-core/app/main.py
          grep -F 'production_promotion_requires_governed_promotion_gate' services/eay-ai-core/app/model_registry.py
          grep -F 'training_execution_receipt_fingerprint' services/eay-ai-core/app/model_promotion_gate.py
          grep -F 'training_execution_receipt_fingerprint_drift' services/eay-ai-core/app/training_execution.py
      - name: Commit hardening and remove temporary write workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EAY Convergence CI'
          git config user.email 'ci@eay.invalid'
          rm -f .github/workflows/ai-training-authority-hardening.yml
          rm -f .github/workflows/ai-training-authority-hardening-v2.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(ai-training): require governed export and verified execution proof'
          git push origin HEAD:release/platform-convergence-ai-training-v0.1
