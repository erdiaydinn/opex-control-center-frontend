name: EAY AI Training Authority Hardening V5

on:
  push:
    branches:
      - release/platform-convergence-ai-training-v0.1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-ai-training-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - name: Reapply reviewed V1 authority patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ai-training-authority-hardening.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          wanted = [
              'Apply fail-closed training authority patch',
              'Adapt promotion tests to real observed local artifact receipts',
              'Add explicit bypass and receipt regression tests',
          ]
          scripts = {}
          i = 0
          while i < len(lines):
              stripped = lines[i].strip()
              if stripped.startswith('- name: '):
                  name = stripped.removeprefix('- name: ')
                  if name in wanted:
                      j = i + 1
                      while j < len(lines) and lines[j].strip() != 'run: |':
                          j += 1
                      if j == len(lines):
                          raise RuntimeError(f'run block not found: {name}')
                      j += 1
                      block = []
                      while j < len(lines):
                          line = lines[j]
                          if line.startswith('          '):
                              block.append(line[10:])
                              j += 1
                              continue
                          if not line.strip():
                              block.append('')
                              j += 1
                              continue
                          break
                      scripts[name] = '\n'.join(block) + '\n'
                      i = j
                      continue
              i += 1
          missing = [name for name in wanted if name not in scripts]
          if missing:
              raise RuntimeError(f'missing V1 blocks: {missing}')
          Path('/tmp/v1-authority.sh').write_text(
              '\n'.join(scripts[name] for name in wanted), encoding='utf-8'
          )
          PY
          bash /tmp/v1-authority.sh
      - name: Establish deterministic single gated export route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('services/eay-ai-core')

          guard = root / 'app/learning_export_guard.py'
          source = guard.read_text(encoding='utf-8')
          source = source.replace('import json\n', 'import json\nimport os\n', 1)
          old_import = 'from .main import settings, store as candidate_store\n'
          assert source.count(old_import) == 1
          source = source.replace(
              old_import,
              'candidate_store = None\n\n\ndef _candidate_store():\n'
              '    if candidate_store is not None:\n'
              '        return candidate_store\n'
              '    from .main import store\n\n'
              '    return store\n',
          )
          source = source.replace(
              '        row = candidate_store.candidate_context(candidate_id)\n',
              '        row = _candidate_store().candidate_context(candidate_id)\n',
          )
          source = source.replace(
              '    exported = candidate_store.export_approved()\n',
              '    active_store = _candidate_store()\n'
              '    exported = active_store.export_approved()\n',
          )
          source = source.replace(
              '        row = candidate_store.candidate_context(candidate_id)\n',
              '        row = active_store.candidate_context(candidate_id)\n',
          )
          source = source.replace(
              'review_store = LearningExportReviewStore(settings.db_path)\n',
              'review_store = LearningExportReviewStore(\n'
              '    Path(os.getenv("EAY_AI_DB_PATH", "./data/eay_ai.db"))\n'
              ')\n',
          )
          # GET is owned by main as a lazy wrapper. This router owns only review
          # mutations and the reusable gated builder, preventing duplicate routes.
          get_block = '''\n\n@router.get("/v1/learning/export", response_model=GatedLearningExport)\ndef export_gated_learning_dataset():\n    try:\n        return build_gated_export(review_store=review_store)\n    except ValueError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n'''
          assert source.count(get_block) == 1
          source = source.replace(get_block, '')
          guard.write_text(source, encoding='utf-8')

          main = root / 'app/main.py'
          source = main.read_text(encoding='utf-8')
          raw_export = '''\n\n@app.get("/v1/learning/export")\ndef export_learning_dataset():\n    return {"format": "chat_sft", "examples": store.export_approved()}\n'''
          # V1 already replaced raw export with three router includes. Remove that
          # block and install one lazy gated wrapper on the same public URL.
          v1_runtime = '''\n\n# Governance routers are imported after the core store/app exist so the\n# learning export guard can safely bind to the canonical candidate store.\nfrom .learning_export_guard import router as learning_export_router  # noqa: E402\nfrom .model_registry import router as model_registry_router  # noqa: E402\nfrom .training_manifest import router as training_manifest_router  # noqa: E402\n\napp.include_router(learning_export_router)\napp.include_router(training_manifest_router)\napp.include_router(model_registry_router)\n'''
          assert source.count(v1_runtime) == 1
          source = source.replace(v1_runtime, '')
          assert source.count(raw_export) == 0
          wrapper = '''\n\n@app.get("/v1/learning/export")\ndef export_learning_dataset():\n    from .learning_export_guard import build_gated_export, review_store\n\n    try:\n        return build_gated_export(review_store=review_store)\n    except ValueError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n'''
          insertion = '\n\n@app.get("/v1/learning/candidates")\n'
          assert source.count(insertion) == 1
          source = source.replace(insertion, wrapper + insertion)
          main.write_text(source, encoding='utf-8')

          entry = root / 'app/entrypoint.py'
          source = entry.read_text(encoding='utf-8')
          removal = '''# The legacy learning export in main emitted approved candidates without the newer\n# privacy/evidence/quality gates. Remove that route from the public surface and replace it\n# with the gated router below while keeping the same external URL.\napp.router.routes = [\n    route\n    for route in app.router.routes\n    if getattr(route, "path", None) != "/v1/learning/export"\n]\n\n'''
          assert source.count(removal) == 1
          source = source.replace(
              removal,
              '# The core app owns one gated learning-export wrapper. The entrypoint\n'
              '# composes review/manifest/model routers without deleting or duplicating it.\n',
          )
          entry.write_text(source, encoding='utf-8')

          test = root / 'tests/test_training_authority.py'
          source = test.read_text(encoding='utf-8')
          source = source.replace('from app.main import app\n', 'from app.entrypoint import app\n')
          source = source.replace('import hashlib\n', 'import hashlib\nimport inspect\n', 1)
          old = '''    assert len(matches) == 1\n    assert matches[0].endpoint.__module__ == "app.learning_export_guard"\n'''
          new = '''    assert len(matches) == 1\n    endpoint = matches[0].endpoint\n    assert endpoint.__module__ == "app.main"\n    assert endpoint.__name__ == "export_learning_dataset"\n    endpoint_source = inspect.getsource(endpoint)\n    assert "build_gated_export" in endpoint_source\n    assert "store.export_approved" not in endpoint_source\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          test.write_text(source, encoding='utf-8')
          PY
      - name: Bind production promotion to correct stored and release eval fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('services/eay-ai-core')
          path = root / 'app/model_promotion_gate.py'
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'from .model_artifact_registry import ModelArtifactRegistry\n',
              'from .model_artifact_registry import ModelArtifactRegistry\n'
              'from .model_registry import EvalSummary, eval_summary_fingerprint\n',
              1,
          )
          old_values = 'VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
          assert source.count(old_values) == 1
          source = source.replace(old_values, 'VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)')

          anchor = '        eval_fingerprint = offline_eval_fingerprint(model)\n        release_proof = _sha256({' 
          assert source.count(anchor) == 1
          source = source.replace(
              anchor,
              '        stored_eval_fingerprint = eval_summary_fingerprint(\n'
              '            EvalSummary.model_validate(json.loads(model["evals_json"]))\n'
              '        )\n'
              '        if model["offline_eval_fingerprint"] != stored_eval_fingerprint:\n'
              '            raise ValueError("model_offline_eval_provenance_mismatch")\n'
              '        eval_fingerprint = offline_eval_fingerprint(model)\n'
              '        release_proof = _sha256({',
          )
          stale = '                if offline_eval_fingerprint(current) != eval_fingerprint: raise ValueError("production_promotion_stale_offline_eval")\n'
          assert source.count(stale) == 1
          source = source.replace(
              stale,
              '                current_stored_eval = eval_summary_fingerprint(\n'
              '                    EvalSummary.model_validate(json.loads(current["evals_json"]))\n'
              '                )\n'
              '                if current["offline_eval_fingerprint"] != current_stored_eval:\n'
              '                    raise ValueError("production_promotion_stale_offline_eval")\n'
              '                if offline_eval_fingerprint(current) != eval_fingerprint:\n'
              '                    raise ValueError("production_promotion_stale_offline_eval")\n',
          )
          path.write_text(source, encoding='utf-8')

          test = root / 'tests/test_canary_result_registry.py'
          source = test.read_text(encoding='utf-8')
          old = '''    promoted = registry.promote(\n        canary.id,\n        PromotionRequest(\n            canary_result_fingerprint=result.result_fingerprint,\n            approved_by="release-owner",\n            note="offline eval and canary evidence reviewed",\n        ),\n    )\n    assert promoted.status == "production"\n    assert promoted.canary_result_fingerprint == result.result_fingerprint\n    assert promoted.promoted_at is not None\n    assert len(promoted.offline_eval_fingerprint) == 64\n'''
          new = '''    assert result.passed is True\n    with pytest.raises(ValueError, match="production_promotion_requires_governed_promotion_gate"):\n        registry.promote(\n            canary.id,\n            PromotionRequest(\n                canary_result_fingerprint=result.result_fingerprint,\n                approved_by="release-owner",\n                note="legacy canary evidence is not sufficient for production",\n            ),\n        )\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '''    assert result.passed is False\n    with pytest.raises(ValueError, match="production_canary_gate_failed:kvkk_leak_detected"):\n        registry.promote(\n            canary.id,\n            PromotionRequest(\n                canary_result_fingerprint=result.result_fingerprint,\n                approved_by="release-owner",\n                note="must fail",\n            ),\n        )\n'''
          new = '''    assert result.passed is False\n    assert "kvkk_leak_detected" in result.violations\n    with pytest.raises(ValueError, match="production_promotion_requires_governed_promotion_gate"):\n        registry.promote(\n            canary.id,\n            PromotionRequest(\n                canary_result_fingerprint=result.result_fingerprint,\n                approved_by="release-owner",\n                note="legacy promotion remains unavailable",\n            ),\n        )\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '''    with pytest.raises(ValueError, match="model_offline_eval_provenance_mismatch"):\n        registry.promote(\n            canary.id,\n            PromotionRequest(\n                canary_result_fingerprint=result.result_fingerprint,\n                approved_by="release-owner",\n                note="must fail tamper",\n            ),\n        )\n'''
          new = '''    with pytest.raises(ValueError, match="production_promotion_requires_governed_promotion_gate"):\n        registry.promote(\n            canary.id,\n            PromotionRequest(\n                canary_result_fingerprint=result.result_fingerprint,\n                approved_by="release-owner",\n                note="legacy path cannot be used to mutate production",\n            ),\n        )\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          test.write_text(source, encoding='utf-8')

          promotion_test = root / 'tests/test_model_artifact_promotion.py'
          source = promotion_test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_governed_promotion_rejects_stored_offline_eval_fingerprint_tampering(tmp_path):\n    registry = ModelRegistry(tmp_path / "eay.db")\n    model_id, job_fp = _seed(registry)\n    provenance = ModelArtifactProvenanceRegistry(registry.db_path)\n    provenance.register_artifact(PromotionArtifactRegistration(\n        training_job_fingerprint=job_fp, artifact_sha256=ARTIFACT,\n        format="safetensors", created_by="trainer", build_reference="BUILD-OFFLINE-TAMPER",\n    ))\n    canary = provenance.register_canary_evidence(_good_canary(model_id))\n    release_evidence = _release_evidence(registry.db_path)\n    with sqlite3.connect(registry.db_path) as conn:\n        conn.execute(\n            "UPDATE model_registry SET offline_eval_fingerprint=? WHERE id=?",\n            ("0" * 64, model_id),\n        )\n    with pytest.raises(ValueError, match="model_offline_eval_provenance_mismatch"):\n        ModelPromotionGate(registry.db_path).promote(PromotionRequest(\n            model_record_id=model_id,\n            canary_evidence_fingerprint=canary.fingerprint,\n            release_evaluation_evidence_fingerprint=release_evidence.fingerprint,\n            approved_by="release-manager",\n            approval_reference="REL-OFFLINE-TAMPER",\n        ))\n'''
          assert 'test_governed_promotion_rejects_stored_offline_eval_fingerprint_tampering' not in source
          source += addition
          promotion_test.write_text(source, encoding='utf-8')
          PY
      - name: Install AI Core
        working-directory: services/eay-ai-core
        run: python -m pip install -e '.[dev]'
      - name: Compile
        working-directory: services/eay-ai-core
        run: python -m compileall -q app tests
      - name: Authority and migrated security invariants
        working-directory: services/eay-ai-core
        run: >-
          pytest -q
          tests/test_training_execution.py
          tests/test_training_authority.py
          tests/test_learning_export_guard.py
          tests/test_canary_result_registry.py
          tests/test_model_artifact_promotion.py
          tests/test_model_registry.py
          tests/test_training_manifest.py
          tests/test_public_api_surface.py
      - name: Full AI Core regression
        working-directory: services/eay-ai-core
        run: pytest -q
      - name: Static single-authority assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '@app.get("/v1/learning/export")' services/eay-ai-core/app/main.py)" -eq 1
          grep -F 'return build_gated_export(review_store=review_store)' services/eay-ai-core/app/main.py
          ! grep -F '@router.get("/v1/learning/export"' services/eay-ai-core/app/learning_export_guard.py
          ! grep -F 'if getattr(route, "path", None) != "/v1/learning/export"' services/eay-ai-core/app/entrypoint.py
          grep -F 'app.include_router(learning_export_router)' services/eay-ai-core/app/entrypoint.py
          grep -F 'production_promotion_requires_governed_promotion_gate' services/eay-ai-core/app/model_registry.py
          grep -F 'training_execution_receipt_fingerprint' services/eay-ai-core/app/model_promotion_gate.py
          grep -F 'model_offline_eval_provenance_mismatch' services/eay-ai-core/app/model_promotion_gate.py
          echo 'AI_TRAINING_SINGLE_AUTHORITY=PASS'
      - name: Commit hardening and remove every temporary write workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EAY Convergence CI'
          git config user.email 'ci@eay.invalid'
          rm -f .github/workflows/ai-training-authority-hardening.yml
          rm -f .github/workflows/ai-training-authority-hardening-v2.yml
          rm -f .github/workflows/ai-training-authority-hardening-v3.yml
          rm -f .github/workflows/ai-training-authority-hardening-v4.yml
          rm -f .github/workflows/ai-training-authority-hardening-v5.yml
          git add -A
          git diff --cached --check
          test -z "$(find .github/workflows -maxdepth 1 -name 'ai-training-authority-hardening*.yml' -print -quit)"
          git commit -m 'feat(ai-training): enforce deterministic gated learning and promotion authority'
          git push origin HEAD:release/platform-convergence-ai-training-v0.1
