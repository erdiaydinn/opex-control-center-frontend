name: EAY AI Training Convergence

on:
  push:
    branches:
      - release/platform-convergence-ai-training-v0.1
      - release/platform-convergence-v0.1
  pull_request:
    branches:
      - release/platform-convergence-v0.1
    paths:
      - 'services/eay-ai-core/**'
      - '.github/workflows/ai-training-convergence-ci.yml'

permissions:
  contents: read

concurrency:
  group: eay-ai-training-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - name: Install AI Core development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile complete AI Core
        run: python -m compileall -q app tests
      - name: Full AI Core regression
        run: pytest -q
      - name: Learning and dataset governance acceptance
        run: >-
          pytest -q
          tests/test_learning_export_guard.py
          tests/test_learning_quality.py
          tests/test_multilingual_learning.py
          tests/test_teacher_quality.py
          tests/test_training_gate.py
          tests/test_training_integrity.py
          tests/test_training_manifest.py
          tests/test_training_multilingual_depth_gate.py
          tests/test_dataset_governance.py
          tests/test_privacy_guard.py
          tests/test_training_authority.py
      - name: Reproducible local training execution acceptance
        run: >-
          pytest -q
          tests/test_training_job_spec.py
          tests/test_training_execution.py
          tests/test_training_executor.py
      - name: Model artifact, eval, canary and governed promotion acceptance
        run: >-
          pytest -q
          tests/test_model_artifact_registry.py
          tests/test_model_artifact_promotion.py
          tests/test_model_lifecycle_ledger.py
          tests/test_model_registry.py
          tests/test_model_promotion_routes.py
          tests/test_canary_evals.py
          tests/test_canary_result_registry.py
          tests/test_safety_evals.py
          tests/test_rag_evals.py
          tests/test_historical_legal_rag_evals.py
      - name: Verify optional local training runtime contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          training = payload['project']['optional-dependencies']['training']
          required = ('torch', 'transformers', 'datasets', 'peft', 'trl', 'accelerate', 'bitsandbytes')
          for package in required:
              assert any(item.lower().startswith(package) for item in training), package
          print(f'AI_TRAINING_OPTIONAL_STACK={len(training)}')
          PY
      - name: Enforce local-only executor and single promotion authority
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"HF_HUB_OFFLINE": "1"' app/training_execution.py
          grep -F '"TRANSFORMERS_OFFLINE": "1"' app/training_execution.py
          grep -F '"HF_DATASETS_OFFLINE": "1"' app/training_execution.py
          grep -F 'training_execution_base_model_hash_mismatch' app/training_execution.py
          grep -F 'training_execution_artifact_drift' app/training_execution.py
          grep -F 'local_files_only' app/training_executor.py
          grep -F 'trust_remote_code' app/training_executor.py
          grep -F 'bnb_4bit_quant_type="nf4"' app/training_executor.py
          grep -F 'training_executor_qlora_requires_cuda' app/training_executor.py
          grep -F 'eay_training_runtime_evidence.json' app/training_executor.py
          grep -F 'production_promotion_requires_governed_promotion_gate' app/model_registry.py
          grep -F 'training_execution_receipt_fingerprint' app/model_promotion_gate.py
          grep -F 'app.include_router(model_promotion_router)' app/entrypoint.py
          test "$(grep -c '@app.get("/v1/learning/export")' app/main.py)" -eq 1
          ! grep -F 'return {"format": "chat_sft", "examples": store.export_approved()}' app/main.py
          echo 'AI_TRAINING_LOCAL_EXECUTION_AND_PROMOTION_AUTHORITY=PASS'
      - name: Reject temporary write-capable training workflows
        run: |
          test -z "$(find ../../.github/workflows -maxdepth 1 -name 'ai-training-authority-hardening*.yml' -print -quit)"
