name: EAY AI Training Route Diagnostic

on:
  push:
    branches:
      - release/platform-convergence-ai-training-v0.1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Inspect exact collision state
        run: |
          python - <<'PY'
          from app.entrypoint import app, compose_app, model_promotion_router, _signature

          expected = {_signature(r) for r in model_promotion_router.routes}
          present = {_signature(r) for r in app.routes}
          print('EXPECTED', sorted(expected))
          print('COLLISION', sorted(expected & present))
          print('PRESENT_MATCH_NAMES', [
              _signature(r) for r in app.routes
              if getattr(r, 'name', '') in {'promote_model', 'get_current_production_promotion'}
          ])
          print('BEFORE_COUNT', len(app.routes))
          compose_app()
          print('AFTER_COMPOSE_COUNT', len(app.routes))
          print('AFTER_COMPOSE', [_signature(r) for r in app.routes if 'model-promotions' in getattr(r, 'path', '')])
          before = len(app.routes)
          app.include_router(model_promotion_router)
          print('DIRECT_INCLUDE_DELTA', len(app.routes) - before)
          print('AFTER_DIRECT', [_signature(r) for r in app.routes if 'model-promotions' in getattr(r, 'path', '')])
          PY
