name: Audit Verifier CI

on:
  push:
    branches:
      - platform-core/eay-v2-audit-hash-chain
  pull_request:
    branches:
      - platform-core/eay-v2-jarvis-admission-control-v2

permissions:
  contents: read

concurrency:
  group: audit-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-verifier:
    name: Independent audit evidence verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"

      - name: Lint audit verifier
        run: >-
          ruff check --output-format=github
          services/core-api/app/core/audit_evidence.py
          services/core-api/tests/test_audit_evidence.py

      - name: Test independent audit verifier
        run: >-
          pytest -q
          services/core-api/tests/test_audit_evidence.py
