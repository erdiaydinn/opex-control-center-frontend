name: Budget Intelligence CI

on:
  push:
    branches:
      - product/budget-intelligence-v1
      - release/platform-convergence-budget-v0.1
      - release/platform-convergence-v0.1
  pull_request:
    branches:
      - release/platform-convergence-v0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-product-contract:
    name: Budget web product contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:access
      - run: npm run build

  budget-foundation:
    name: Budget PostgreSQL finance acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: opex_migrator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cumulative Core API test shape
        working-directory: services/core-api
        run: python -m pip install -e ".[dev,bigquery]"
      - name: Create RLS-bound runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              con = await asyncpg.connect("postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test")
              try:
                  if not await con.fetchval("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')"):
                      await con.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
              finally:
                  await con.close()

          asyncio.run(main())
          PY
      - name: Compile Budget slice and cumulative merge head
        run: python -m compileall -q services/core-api/app/modules/budget services/core-api/alembic/versions/0009_budget_finance_foundation.py services/core-api/alembic/versions/0010_budget_procurement_foundation.py services/core-api/alembic/versions/0011_budget_ledger_foundation.py services/core-api/alembic/versions/0012_budget_import_foundation.py services/core-api/alembic/versions/0013_budget_evidence_foundation.py services/core-api/alembic/versions/0014_budget_rls_controls.py services/core-api/alembic/versions/0017_merge_jarvis_platform_heads.py services/core-api/alembic/versions/0018_academy_product_roles.py
      - name: Lint Budget slice
        run: ruff check --ignore E501 services/core-api/app/modules/budget services/core-api/tests/test_budget_domain.py
      - name: Unit finance contracts
        run: pytest -q services/core-api/tests/test_budget_domain.py
      - name: Apply cumulative migrations
        id: migrations
        continue-on-error: true
        working-directory: services/core-api
        run: alembic upgrade head > budget-migration.log 2>&1
      - name: Upload migration diagnostics
        if: steps.migrations.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: budget-migration-log
          path: services/core-api/budget-migration.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce migration gate
        if: steps.migrations.outcome == 'failure'
        working-directory: services/core-api
        run: |
          cat budget-migration.log
          exit 1
      - name: Assert cumulative migration head and Budget FORCE RLS
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          expected = {
              "budget_plan", "fiscal_period", "cost_center", "budget_line",
              "purchase_request", "approval", "purchase_order", "invoice",
              "commitment", "actual", "forecast", "reconciliation_issue",
              "import_batch", "import_row", "financial_event", "budget_command",
          }

          async def main():
              con = await asyncpg.connect("postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test")
              try:
                  head = await con.fetchval("SELECT version_num FROM alembic_version")
                  assert head == "0018_academy_product_roles", head
                  rows = await con.fetch("SELECT relname, relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname = ANY($1::text[])", list(expected))
                  seen = {row["relname"] for row in rows}
                  assert seen == expected, (expected - seen)
                  assert all(row["relrowsecurity"] and row["relforcerowsecurity"] for row in rows)
                  bypass = await con.fetchval("SELECT rolbypassrls FROM pg_roles WHERE rolname='opex_runtime'")
                  assert bypass is False
              finally:
                  await con.close()

          asyncio.run(main())
          PY
      - name: Assert canonical Budget permissions and routes
        working-directory: services/core-api
        run: |
          python - <<'PY'
          from app.budget_main import app
          from app.core.permission_catalog import is_known_permission
          from app.modules.budget import permissions as p

          required_permissions = {
              p.BUDGET_VIEW, p.BUDGET_CREATE_PLAN, p.BUDGET_ACTIVATE_PLAN,
              p.BUDGET_MANAGE_PERIODS, p.BUDGET_MANAGE_COST_CENTERS,
              p.BUDGET_MANAGE_LINES, p.BUDGET_CREATE_REQUEST,
              p.BUDGET_APPROVE_REQUEST, p.BUDGET_CREATE_PO,
              p.BUDGET_POST_INVOICE, p.BUDGET_CREATE_FORECAST,
              p.BUDGET_IMPORT, p.BUDGET_RECONCILE, p.BUDGET_CLOSE_PERIOD,
              p.BUDGET_EXPORT, p.BUDGET_VIEW_AUDIT,
          }
          assert all(is_known_permission(key) for key in required_permissions)
          paths = set(app.openapi()["paths"])
          for path in (
              "/v1/budget/summary", "/v1/budget/plans", "/v1/budget/periods",
              "/v1/budget/cost-centers", "/v1/budget/lines",
              "/v1/budget/requests", "/v1/budget/purchase-orders",
              "/v1/budget/invoices", "/v1/budget/forecasts",
              "/v1/budget/imports/stage", "/v1/budget/financial-events",
              "/v1/budget/export/variance.csv",
          ):
              assert path in paths, path
          PY
      - name: Database restart durability
        run: |
          docker restart ${{ job.services.postgres.id }}
          for attempt in {1..30}; do pg_isready -h localhost -U opex_migrator -d opex_test && break; sleep 1; done
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version WHERE version_num='0018_academy_product_roles'"
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM budget_plan"
      - name: Backup and isolated restore rehearsal
        run: |
          pg_dump -h localhost -U opex_migrator -Fc -f /tmp/eay-budget.dump opex_test
          dropdb -h localhost -U opex_migrator --if-exists opex_budget_restore
          createdb -h localhost -U opex_migrator opex_budget_restore
          pg_restore -h localhost -U opex_migrator -d opex_budget_restore --no-owner /tmp/eay-budget.dump
          psql -h localhost -U opex_migrator -d opex_budget_restore -v ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version WHERE version_num='0018_academy_product_roles'"
          psql -h localhost -U opex_migrator -d opex_budget_restore -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM budget_plan"
