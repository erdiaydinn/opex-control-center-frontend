name: Budget Ruff Safe Autofix

on:
  push:
    branches:
      - release/platform-convergence-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core API lint dependencies
        run: python -m pip install -e './services/core-api[dev]'
      - name: Apply Ruff safe fixes only
        run: |
          ruff check --fix \
            services/core-api/app/modules/budget \
            services/core-api/alembic/versions/0009_budget_finance_foundation.py \
            services/core-api/alembic/versions/0010_budget_procurement_foundation.py \
            services/core-api/alembic/versions/0011_budget_ledger_foundation.py \
            services/core-api/alembic/versions/0012_budget_import_foundation.py \
            services/core-api/alembic/versions/0013_budget_evidence_foundation.py \
            services/core-api/alembic/versions/0014_budget_rls_controls.py
      - name: Verify full Core API Ruff gate
        run: ruff check services/core-api
      - name: Verify Budget unit contracts
        run: pytest -q services/core-api/tests/test_budget_domain.py
      - name: Remove one-shot workflow and commit safe fixes
        shell: bash
        run: |
          rm -f .github/workflows/budget-ruff-safe-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/core-api .github/workflows/budget-ruff-safe-autofix.yml
          if git diff --cached --quiet; then
            echo 'No Ruff-safe changes required.'
            exit 0
          fi
          git commit -m 'style(budget): satisfy cumulative Core API Ruff gate'
          git push origin HEAD:release/platform-convergence-v0.1
