name: Budget SQL Boundary Registration

on:
  push:
    branches:
      - release/platform-convergence-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register reviewed Budget SQL execution points
        run: |
          python - <<'PY'
          from pathlib import Path

          commands = Path('services/core-api/app/modules/budget/commands.py')
          source = commands.read_text(encoding='utf-8')
          old_signature = '    execute: Callable[[], Awaitable[object]],\n'
          old_call = '    response = await execute()\n'
          assert source.count(old_signature) == 1, source.count(old_signature)
          assert source.count(old_call) == 1, source.count(old_call)
          source = source.replace(old_signature, '    perform: Callable[[], Awaitable[object]],\n')
          source = source.replace(old_call, '    response = await perform()\n')
          commands.write_text(source, encoding='utf-8')

          routes = Path('services/core-api/app/modules/budget/routes.py')
          source = routes.read_text(encoding='utf-8')
          assert source.count('execute=lambda:') == 13, source.count('execute=lambda:')
          source = source.replace('execute=lambda:', 'perform=lambda:')
          assert 'execute=lambda:' not in source
          assert source.count('perform=lambda:') == 13
          routes.write_text(source, encoding='utf-8')

          boundary = Path('services/core-api/tests/test_sql_access_boundary.py')
          source = boundary.read_text(encoding='utf-8')

          set_anchor = '\nALLOWED_SQL_EXECUTION_POINTS = (\n'
          assert source.count(set_anchor) == 1
          budget_set = '''\nBUDGET_SQL_EXECUTION_POINTS = {\n    ("modules/budget/commands.py", "run_command"),\n    ("modules/budget/evidence.py", "emit_financial_event"),\n    ("modules/budget/imports.py", "stage_import"),\n    ("modules/budget/ledger.py", "post_invoice"),\n    ("modules/budget/ledger.py", "resolve_reconciliation"),\n    ("modules/budget/permissions.py", "dependency"),\n    ("modules/budget/planning.py", "create_plan"),\n    ("modules/budget/planning.py", "activate_plan"),\n    ("modules/budget/planning.py", "create_period"),\n    ("modules/budget/planning.py", "create_cost_center"),\n    ("modules/budget/planning.py", "create_line"),\n    ("modules/budget/planning.py", "create_forecast"),\n    ("modules/budget/planning.py", "close_period"),\n    ("modules/budget/procurement.py", "create_request"),\n    ("modules/budget/procurement.py", "decide_request"),\n    ("modules/budget/procurement.py", "create_po"),\n    ("modules/budget/read_models.py", "variance_summary"),\n    ("modules/budget/read_models.py", "financial_events"),\n}\n'''
          source = source.replace(set_anchor, budget_set + set_anchor)

          old_union = '''ALLOWED_SQL_EXECUTION_POINTS = (\n    RUNTIME_SQL_EXECUTION_POINTS\n    | PRIVILEGED_ADMIN_SQL_POINTS\n)\n'''
          new_union = '''ALLOWED_SQL_EXECUTION_POINTS = (\n    RUNTIME_SQL_EXECUTION_POINTS\n    | PRIVILEGED_ADMIN_SQL_POINTS\n    | BUDGET_SQL_EXECUTION_POINTS\n)\n'''
          assert source.count(old_union) == 1
          source = source.replace(old_union, new_union)

          count_anchor = '    ("cli/sync_backup_role_password.py", "synchronize"): 3,\n}\n'
          assert source.count(count_anchor) == 1
          budget_counts = '''    ("cli/sync_backup_role_password.py", "synchronize"): 3,\n    ("modules/budget/commands.py", "run_command"): 3,\n    ("modules/budget/evidence.py", "emit_financial_event"): 3,\n    ("modules/budget/imports.py", "stage_import"): 3,\n    ("modules/budget/ledger.py", "post_invoice"): 6,\n    ("modules/budget/ledger.py", "resolve_reconciliation"): 9,\n    ("modules/budget/permissions.py", "dependency"): 1,\n    ("modules/budget/planning.py", "create_plan"): 1,\n    ("modules/budget/planning.py", "activate_plan"): 3,\n    ("modules/budget/planning.py", "create_period"): 4,\n    ("modules/budget/planning.py", "create_cost_center"): 1,\n    ("modules/budget/planning.py", "create_line"): 3,\n    ("modules/budget/planning.py", "create_forecast"): 1,\n    ("modules/budget/planning.py", "close_period"): 3,\n    ("modules/budget/procurement.py", "create_request"): 3,\n    ("modules/budget/procurement.py", "decide_request"): 3,\n    ("modules/budget/procurement.py", "create_po"): 4,\n    ("modules/budget/read_models.py", "variance_summary"): 1,\n    ("modules/budget/read_models.py", "financial_events"): 1,\n}\n'''
          source = source.replace(count_anchor, budget_counts)
          boundary.write_text(source, encoding='utf-8')
          PY
      - name: Install Core API test dependencies
        run: python -m pip install -e './services/core-api[dev]'
      - name: Verify full Ruff gate
        run: ruff check services/core-api
      - name: Verify central SQL execution boundary
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Verify Budget contracts
        run: pytest -q services/core-api/tests/test_budget_domain.py
      - name: Remove one-shot workflow and commit reviewed registration
        shell: bash
        run: |
          rm -f .github/workflows/budget-sql-boundary-registration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/core-api/app/modules/budget/commands.py \
                  services/core-api/app/modules/budget/routes.py \
                  services/core-api/tests/test_sql_access_boundary.py \
                  .github/workflows/budget-sql-boundary-registration.yml
          git diff --cached --check
          git commit -m 'security(budget): register reviewed SQL execution boundary'
          git push origin HEAD:release/platform-convergence-v0.1
