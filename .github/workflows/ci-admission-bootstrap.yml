name: EAY CI Admission Bootstrap

on:
  push:
    branches:
      - fix/ci-admission-control-v1
    paths:
      - scripts/ci/apply_ci_admission_control.py
      - scripts/ci/apply_exact_head_concurrency.py
      - .github/workflows/ci-admission-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eay-ci-admission-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Apply reviewed CI admission policy
        run: |
          python scripts/ci/apply_ci_admission_control.py
          python scripts/ci/apply_exact_head_concurrency.py
      - name: Re-verify admission policy from resulting tree
        run: |
          python scripts/ci/apply_ci_admission_control.py --check
          python scripts/ci/apply_exact_head_concurrency.py --check
      - name: Reject malformed whitespace or conflict markers
        run: git diff --check
      - name: Commit verified workflow admission changes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eay-ci-admission-bot"
          git config user.email "eay-ci-admission-bot@users.noreply.github.com"
          git add \
            .github/workflows/eay-roadmap-1-10-acceptance.yml \
            .github/workflows/eay-roadmap-1-10-exact-head.yml \
            .github/workflows/eay-roadmap-1-11-exact-head.yml \
            .github/workflows/eay-roadmap-1-12-exact-head.yml \
            .github/workflows/eay-roadmap-1-13-exact-head.yml \
            .github/workflows/eay-roadmap-1-14-exact-head.yml \
            .github/workflows/eay-roadmap-1-15-exact-head.yml \
            .github/workflows/eay-roadmap-1-16-exact-head.yml \
            .github/workflows/eay-roadmap-1-17-exact-head.yml \
            .github/workflows/eay-roadmap-1-18-exact-head.yml \
            .github/workflows/eay-roadmap-1-19-exact-head.yml \
            .github/workflows/eay-roadmap-1-20-exact-head.yml \
            .github/workflows/eay-roadmap-1-21-exact-head.yml \
            .github/workflows/eay-roadmap-1-22-exact-head.yml \
            .github/workflows/eay-roadmap-1-23-exact-head.yml \
            .github/workflows/eay-roadmap-1-24-exact-head.yml \
            .github/workflows/eay-roadmap-1-25-exact-head.yml \
            .github/workflows/eay-master-roadmap-24-planogram-physical-truth.yml \
            .github/workflows/eay-master-roadmap-25-planogram-optimizer.yml \
            .github/workflows/eay-master-roadmap-26-planogram-execution-compliance.yml \
            .github/workflows/eay-master-roadmap-24-27-cumulative-exact-head.yml \
            .github/workflows/eay-master-roadmap-28-budget-planning-engine.yml \
            .github/workflows/dockos-full-stack.yml \
            .github/workflows/jarvis-convergence-ci.yml
          git rm .github/workflows/ci-admission-bootstrap.yml
          git diff --cached --check
          git commit -m "ci: scope heavy PR gates and cancel superseded runs"
          git push origin HEAD:fix/ci-admission-control-v1
