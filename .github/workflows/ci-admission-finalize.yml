name: EAY CI Admission Finalize

on:
  push:
    branches:
      - fix/ci-admission-control-final-v2
    paths:
      - "scripts/ci/migrate_legacy_exact_head_headers.py"
      - ".github/workflows/ci-admission-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eay-ci-admission-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-historical-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Compile migration
        run: python -m py_compile scripts/ci/migrate_legacy_exact_head_headers.py
      - name: Normalize reviewed headers
        run: python scripts/ci/migrate_legacy_exact_head_headers.py
      - name: Re-verify resulting tree
        run: python scripts/ci/migrate_legacy_exact_head_headers.py --check
      - name: Reject malformed diff
        run: git diff --check
      - name: Commit header-only migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eay-ci-admission-bot"
          git config user.email "eay-ci-admission-bot@users.noreply.github.com"
          for item in {10..25}; do
            git add ".github/workflows/eay-roadmap-1-${item}-exact-head.yml"
          done
          git rm .github/workflows/ci-admission-finalize.yml
          git diff --cached --check
          git commit -m "ci: stabilize historical exact-head admission"
          git push origin HEAD:fix/ci-admission-control-final-v2
