name: EAY CI Admission Guard

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - ".github/workflows/**"
      - "scripts/ci/apply_ci_admission_control.py"
      - "scripts/ci/apply_exact_head_concurrency.py"
      - "scripts/ci/apply_inventory_admission_control.py"
  push:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - ".github/workflows/**"
      - "scripts/ci/apply_ci_admission_control.py"
      - "scripts/ci/apply_exact_head_concurrency.py"
      - "scripts/ci/apply_inventory_admission_control.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission-contract:
    name: CI admission contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify domain admission and historical trigger policy
        run: python scripts/ci/apply_ci_admission_control.py --check
      - name: Verify exact-head concurrency policy through Roadmap 25
        run: python scripts/ci/apply_exact_head_concurrency.py --check
      - name: Verify Inventory and DockOS admission separation
        run: python scripts/ci/apply_inventory_admission_control.py --check
      - name: Reject malformed whitespace or conflict markers
        run: git diff --check
