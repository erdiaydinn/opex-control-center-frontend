name: EAY Exact-Head Base Migration

on:
  pull_request:
    branches:
      - fix/ci-admission-control-v1
    paths:
      - ".ci/exact-head-migration-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eay-exact-head-base-migration
  cancel-in-progress: true

jobs:
  migrate-fix-base:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/ci-admission-control-v1
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Compile fail-closed migration tools
        run: python -m py_compile scripts/ci/migrate_legacy_exact_head_headers.py scripts/ci/verify_ci_admission_policy.py
      - name: Apply header-only historical migration
        run: python scripts/ci/migrate_legacy_exact_head_headers.py
      - name: Verify exact-head binding and CI admission contracts
        run: |
          python scripts/ci/migrate_legacy_exact_head_headers.py --check
          python scripts/ci/apply_inventory_admission_control.py --check
          python scripts/ci/verify_ci_admission_policy.py
      - name: Reject malformed diff
        run: git diff --check
      - name: Publish verified transformed workflow copies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/generated/exact-head
          for item in {10..25}; do
            cp ".github/workflows/eay-roadmap-1-${item}-exact-head.yml" ".ci/generated/exact-head/eay-roadmap-1-${item}-exact-head.yml"
            git restore ".github/workflows/eay-roadmap-1-${item}-exact-head.yml"
          done
          git diff --check
          git config user.name "eay-ci-admission-bot"
          git config user.email "eay-ci-admission-bot@users.noreply.github.com"
          git add .ci/generated/exact-head
          git commit -m "ci: publish verified exact-head workflow transforms"
          git push origin HEAD:refs/heads/generated/ci-exact-head-output-v1
