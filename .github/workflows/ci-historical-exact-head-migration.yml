name: EAY Historical Exact-Head Header Migration

on:
  push:
    branches:
      - fix/ci-admission-control-v1
    paths:
      - "scripts/ci/migrate_legacy_exact_head_headers.py"
      - "scripts/ci/apply_exact_head_concurrency.py"
      - ".github/workflows/ci-historical-exact-head-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eay-historical-exact-head-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Compile migration tools
        run: python -m py_compile scripts/ci/migrate_legacy_exact_head_headers.py scripts/ci/apply_exact_head_concurrency.py
      - name: Migrate historical exact-head headers
        run: |
          python scripts/ci/migrate_legacy_exact_head_headers.py
          python scripts/ci/apply_exact_head_concurrency.py
      - name: Re-verify exact-head admission and concurrency
        run: |
          python scripts/ci/migrate_legacy_exact_head_headers.py --check
          python scripts/ci/apply_exact_head_concurrency.py --check
      - name: Reject malformed diff
        run: git diff --check
      - name: Commit verified header-only migration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eay-ci-admission-bot"
          git config user.email "eay-ci-admission-bot@users.noreply.github.com"
          for item in {10..25}; do
            git add ".github/workflows/eay-roadmap-1-${item}-exact-head.yml"
          done
          git rm .github/workflows/ci-historical-exact-head-migration.yml
          git diff --cached --check
          git commit -m "ci: stabilize historical exact-head admission"
          git push origin HEAD:fix/ci-admission-control-v1
