name: EAY DockOS Budget CEO Final

on:
  push:
    branches:
      - product/dockos-budget-ceo-final-v1
  pull_request:
    branches:
      - product/eay-category-leadership-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockos-budget-ceo-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-build:
    name: DockOS and Budget product build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Assert CEO final route composition
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('src/App.jsx','utf8');
          const dock=fs.readFileSync('src/modules/DockOS/DockOSDashboard.jsx','utf8');
          const dockTower=fs.readFileSync('src/modules/DockOS/DockOSExecutiveControlTower.jsx','utf8');
          const budget=fs.readFileSync('src/modules/budget-intelligence/BudgetControlTower.jsx','utf8');
          const budgetRoute=fs.readFileSync('src/modules/budget-intelligence/BudgetIntelligence.jsx','utf8');
          if(!app.includes('./modules/budget-intelligence/BudgetIntelligence.jsx')) throw new Error('Canonical Budget lazy route missing');
          if(!dock.includes('DockOSExecutiveControlTower')) throw new Error('DockOS control tower missing');
          if(!budgetRoute.includes('/v1/budget/control-tower')) throw new Error('Budget server authority missing');
          if(budget.includes('planned_budget:') || budget.includes('setAi(')) throw new Error('Browser-owned finance truth detected');
          if(!budgetRoute.includes('BudgetControlTower')) throw new Error('Canonical Budget route is not the Financial Control Tower');
          if(budgetRoute.includes('setAi(') || budgetRoute.includes('planned_budget:')) throw new Error('Legacy browser finance authority remains exposed');
          for(const marker of ['loading','error','empty','ready']) if(!budgetRoute.includes(`data-eay-product-state="${marker}"`)) throw new Error(`Budget ${marker} product state missing`);
          for(const localeMarker of ['tr:{','en:{','de:{','ar:{','fr:{','es:{','it:{','nl:{','pl:{','"pt-BR":{']) {
            if(!budget.includes(localeMarker)) throw new Error(`Budget locale missing: ${localeMarker}`);
            if(!dockTower.includes(localeMarker)) throw new Error(`DockOS locale missing: ${localeMarker}`);
          }
          if(budget.includes('forecast_variance)>0')) throw new Error('Budget risk semantics invert server variance authority');
          if(!budget.includes('forecast_variance)<0')) throw new Error('Budget over-forecast variance guard missing');
          if(dockTower.includes('Arrival Compliance')) throw new Error('DockOS must not claim on-time compliance from arrival-presence data');
          console.log('CEO_FINAL_PRODUCT_AUTHORITY=PASS');
          NODE
      - run: npm run test:access
      - run: npm run test:inclusion
      - run: npm run build

  budget-authority:
    name: Budget assurance authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        working-directory: services/core-api
        run: python -m pip install -e ".[dev,bigquery]"
      - name: Compile authority
        run: python -m compileall -q services/core-api/app/modules/budget/assurance.py services/core-api/app/modules/budget/assurance_routes.py services/core-api/app/budget_main.py
      - name: Lint authority
        run: ruff check --ignore E501 services/core-api/app/modules/budget/assurance.py services/core-api/app/modules/budget/assurance_routes.py services/core-api/tests/test_budget_assurance.py
      - name: Run assurance tests
        working-directory: services/core-api
        run: pytest -q tests/test_budget_assurance.py
      - name: Assert composed API contracts
        working-directory: services/core-api
        run: |
          python - <<'PY'
          from app.budget_main import app
          paths=set(app.openapi()['paths'])
          required={
              '/v1/budget/control-tower',
              '/v1/budget/assurance',
              '/v1/budget/reports/executive.csv',
          }
          missing=required-paths
          assert not missing, missing
          print('BUDGET_CONTROL_TOWER_API=PASS')
          PY

  dockos-regression:
    name: DockOS authority regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Assert DockOS control tower reuses canonical APIs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/modules/DockOS/DockOSExecutiveControlTower.jsx','utf8');
          for(const api of ['getKpis','getNotificationOutbox','getReservations','getSlots']) if(!s.includes(api)) throw new Error(`missing ${api}`);
          if(s.includes('fetch(')) throw new Error('DockOS bypasses canonical API client');
          console.log('DOCKOS_CONTROL_TOWER_AUTHORITY=PASS');
          NODE
      - run: npm run build
