name: DockOS full-stack validation

on:
  pull_request:
    paths:
      - "backend/app/modules/workforce/**"
      - "backend/app/modules/recruitment/**"
      - "backend/app/modules/dockos/**"
      - "backend/app/test_security.py"
      - "backend/migrations/*workforce*.sql"
      - "backend/migrations/*dockos*.sql"
      - "backend/migrations/*recruit*.sql"
      - "backend/scripts/setup_workforce_postgres_ci.py"
      - "backend/scripts/workforce_postgres_load_ci.py"
      - "backend/scripts/verify_workforce_restore_ci.py"
      - "backend/requirements.txt"
      - "src/**/*workforce*"
      - "src/**/Workforce/**"
      - "src/**/*dockos*"
      - "src/**/DockOS/**"
      - "src/**/*hiring*"
      - "src/**/Hiring/**"
      - "src/**/*recruit*"
      - "src/**/Recruitment/**"
      - "scripts/test-workforce-command-center.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dockos-full-stack.yml"
  workflow_dispatch:
  push:
    branches:
      - main
      - product/workforce-**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:access
      - run: npm run test:workforce
      - run: node scripts/test-workforce-command-center.mjs
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOCKOS_PO_SOURCE: LOCAL
      DOCKOS_STATE_FILE: /tmp/dockos_ci_state.json
      DOCKOS_NOTIFICATION_AUTOMATION: "false"
      OPEX_PII_KEY: Y2ktd29ya2ZvcmNlLXYzMC10ZXN0LWtleS0wMDAwMDA=
      OPEX_PII_LOOKUP_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Workforce Hiring DockOS Inventory regression
        run: >-
          python -m unittest
          app.modules.workforce.test_workforce
          app.modules.workforce.test_workforce_api
          app.modules.workforce.test_flexibility
          app.modules.workforce.test_flexibility_router
          app.modules.workforce.test_shift_trading
          app.modules.workforce.test_shift_trade_views
          app.modules.workforce.test_assignment_ranking
          app.modules.workforce.test_command_center
          app.modules.workforce.test_scope_hardening
          app.modules.workforce.test_timeoff_parser
          app.modules.workforce.test_identity_leave_hardening
          app.modules.workforce.test_work_activity_authority
          app.modules.workforce.test_work_activity_catalog
          app.modules.workforce.test_work_activity_completion
          app.modules.workforce.test_work_activity_capacity_runtime
          app.modules.recruitment.test_recruitment
          app.modules.recruitment.test_hr_actual
          app.test_security
          app.modules.dockos.test_rc2
          app.modules.inventory.test_inventory
          app.modules.inventory.test_inventory_scope

  workforce-postgres:
    name: Workforce PostgreSQL acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://workforce_runtime:workforce_runtime_ci@localhost:5432/workforce_ci
      WORKFORCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforce_ci
      WORKFORCE_TENANT_ID: eay-ci
      WORKFORCE_AUTO_MIGRATE: "false"
      DOCKOS_ENV: test
      PGPASSWORD: postgres
      RECRUITMENT_EVIDENCE_DIR: /tmp/recruitment-evidence
      OPEX_PII_KEY: Y2ktd29ya2ZvcmNlLXYzMC10ZXN0LWtleS0wMDAwMDA=
      OPEX_PII_LOOKUP_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/setup_workforce_postgres_ci.py
      - name: Apply canonical Workforce V30-V37 authority migrations
        run: |
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/003_workforce_v30_acceptance.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/004_workforce_v31_lifecycle_acceptance.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/005_workforce_v32_identity_revocation.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/010_workforce_v33_demand_authority.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/011_workforce_v34_capacity_authority.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/012_workforce_v35_dpi_authority.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/013_workforce_v36_optimizer_authority.sql
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 -f migrations/014_workforce_v37_replan_authority.sql
          psql -h localhost -U postgres -d workforce_ci -Atc "SELECT count(*) FROM workforce_schema_migrations WHERE version BETWEEN 30 AND 37" | grep -qx '8'
      - name: Grant tenant-bound runtime only the governed authority surface it needs
        run: |
          psql -h localhost -U postgres -d workforce_ci -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT ON
            workforce_demand_snapshots,
            workforce_capacity_snapshots,
            workforce_dpi_snapshots
          TO workforce_runtime;
          GRANT SELECT ON
            workforce_labor_standard_versions,
            workforce_optimizer_proposals,
            workforce_replan_model_versions,
            workforce_replan_scenarios,
            workforce_replan_proposals
          TO workforce_runtime;
          SQL
      - run: python -m unittest app.modules.workforce.test_workforce_persistence
      - run: python -m unittest app.modules.workforce.test_command_center_postgres
      - run: python scripts/workforce_postgres_load_ci.py
      - name: Backup and isolated restore rehearsal
        run: |
          pg_dump -h localhost -U postgres -Fc -f /tmp/workforce_ci.dump workforce_ci
          dropdb -h localhost -U postgres --if-exists workforce_restore_ci
          createdb -h localhost -U postgres workforce_restore_ci
          pg_restore -h localhost -U postgres -d workforce_restore_ci /tmp/workforce_ci.dump
          WORKFORCE_RESTORE_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/workforce_restore_ci \
            python scripts/verify_workforce_restore_ci.py
