name: DockOS full-stack validation

on:
  pull_request:
    paths:
      - "backend/app/modules/workforce/**"
      - "backend/app/modules/recruitment/**"
      - "backend/app/modules/dockos/**"
      - "backend/app/test_security.py"
      - "backend/migrations/*workforce*.sql"
      - "backend/migrations/*dockos*.sql"
      - "backend/migrations/*recruit*.sql"
      - "backend/scripts/setup_workforce_postgres_ci.py"
      - "backend/scripts/workforce_postgres_load_ci.py"
      - "backend/scripts/verify_workforce_restore_ci.py"
      - "backend/requirements.txt"
      - "src/**/*workforce*"
      - "src/**/Workforce/**"
      - "src/**/*dockos*"
      - "src/**/DockOS/**"
      - "src/**/*hiring*"
      - "src/**/Hiring/**"
      - "src/**/*recruit*"
      - "src/**/Recruitment/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dockos-full-stack.yml"
  workflow_dispatch:
  push:
    branches:
      - main
      - product/workforce-**

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-admission-finalize:
    if: github.ref_name == 'product/workforce-ci-admission-finalizer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Normalize historical exact-head admission
        run: |
          python -m py_compile scripts/ci/migrate_legacy_exact_head_headers.py
          python scripts/ci/migrate_legacy_exact_head_headers.py
          python scripts/ci/migrate_legacy_exact_head_headers.py --check
          git diff --check
      - name: Commit header-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eay-ci-admission-bot"
          git config user.email "eay-ci-admission-bot@users.noreply.github.com"
          for item in {10..25}; do
            git add ".github/workflows/eay-roadmap-1-${item}-exact-head.yml"
          done
          git diff --cached --check
          git commit -m "ci: stabilize historical exact-head admission"
          git push origin HEAD:product/workforce-ci-admission-finalizer-v1

  frontend:
    if: github.ref_name != 'product/workforce-ci-admission-finalizer-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:access
      - run: npm run test:workforce
      - run: npm run build

  backend:
    if: github.ref_name != 'product/workforce-ci-admission-finalizer-v1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOCKOS_PO_SOURCE: LOCAL
      DOCKOS_STATE_FILE: /tmp/dockos_ci_state.json
      DOCKOS_NOTIFICATION_AUTOMATION: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest app.modules.workforce.test_workforce app.modules.workforce.test_workforce_api app.modules.recruitment.test_recruitment app.test_security app.modules.dockos.test_rc2 app.modules.inventory.test_inventory app.modules.inventory.test_inventory_scope

  workforce-postgres:
    if: github.ref_name != 'product/workforce-ci-admission-finalizer-v1'
    name: Workforce PostgreSQL acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://workforce_runtime:workforce_runtime_ci@localhost:5432/workforce_ci
      WORKFORCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforce_ci
      WORKFORCE_TENANT_ID: eay-ci
      WORKFORCE_AUTO_MIGRATE: "false"
      DOCKOS_ENV: test
      PGPASSWORD: postgres
      RECRUITMENT_EVIDENCE_DIR: /tmp/recruitment-evidence
      OPEX_PII_KEY: Y2ktd29ya2ZvcmNlLXYzMC10ZXN0LWtleS0wMDAwMDA=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/setup_workforce_postgres_ci.py
      - run: python -m unittest app.modules.workforce.test_workforce_persistence
      - run: python scripts/workforce_postgres_load_ci.py
      - name: Backup and isolated restore rehearsal
        run: |
          pg_dump -h localhost -U postgres -Fc -f /tmp/workforce_ci.dump workforce_ci
          dropdb -h localhost -U postgres --if-exists workforce_restore_ci
          createdb -h localhost -U postgres workforce_restore_ci
          pg_restore -h localhost -U postgres -d workforce_restore_ci /tmp/workforce_ci.dump
          WORKFORCE_RESTORE_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/workforce_restore_ci \
            python scripts/verify_workforce_restore_ci.py
