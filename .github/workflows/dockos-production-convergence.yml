name: DockOS production convergence

on:
  push:
    branches:
      - release/platform-convergence-v0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockos-production-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Materialize pinned SheetJS dependency
        run: node scripts/ci/materialize-sheetjs.mjs
      - run: npm ci
      - run: npm run build
      - name: Validate DockOS locale and RTL contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/modules/DockOS/DockOSUiContext.jsx','utf8');
          for (const locale of ['tr','en','de','ar']) if (!s.includes(`${locale}: {`)) throw new Error(`missing ${locale}`);
          if (!s.includes('dir: locale === "ar" ? "rtl" : "ltr"')) throw new Error('Arabic RTL contract missing');
          if (!s.includes('["tr", "en", "de", "ar"]')) throw new Error('locale allow-list missing');
          console.log('DOCKOS_I18N_RTL=PASS');
          NODE

  backend-json:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOCKOS_ENV: test
      DOCKOS_PO_SOURCE: LOCAL
      DOCKOS_STATE_FILE: /tmp/dockos_ci_state.json
      DOCKOS_NOTIFICATION_AUTOMATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m app.modules.dockos.test_rc2
      - run: python -m app.modules.dockos.test_notifications
      - name: Production boundary source guard
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/main.py').read_text(encoding='utf-8')
          assert 'verify_dockos_gateway(request)' in main
          assert 'authenticate_dockos_request(request)' in main
          assert '_replace_verified_dockos_headers' in main
          assert 'DOCKOS_TRUST_ROLE_HEADER' not in main
          print('DOCKOS_SERVER_AUTHORITY_SOURCE_GUARD=PASS')
          PY

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dockos
          POSTGRES_USER: dockos
          POSTGRES_PASSWORD: dockos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dockos -d dockos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://dockos:dockos_ci@127.0.0.1:5432/dockos
      PGPASSWORD: dockos_ci
      DOCKOS_ENV: test
      DOCKOS_PERSISTENCE: postgres
      DOCKOS_TENANT_KEY: ys_tr
      DOCKOS_DC_NAMES: Ankara DC
      DOCKOS_PO_SOURCE: LOCAL
      DOCKOS_NOTIFICATION_AUTOMATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        working-directory: .
      - name: Apply DockOS migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_dockos_postgres.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/002_runtime_hardening.sql
          psql "$DATABASE_URL" -Atc "SELECT version FROM dockos.schema_migrations ORDER BY version;"
      - name: Gateway replay SQL regression
        run: |
          python - <<'PY'
          import os
          import time
          os.environ['DOCKOS_PERSISTENCE']='postgres'
          os.environ['DOCKOS_TENANT_KEY']='ys_tr'
          from app.modules.dockos.tenant_db import consume_gateway_replay
          timestamp=str(int(time.time()))
          assert consume_gateway_replay(timestamp,'ci-sql-regression-nonce','ci-sql-regression-signature',60) is True
          assert consume_gateway_replay(timestamp,'ci-sql-regression-nonce','ci-sql-regression-signature',60) is False
          print('GATEWAY_REPLAY_SQL_REGRESSION=PASS')
          PY
      - name: Gateway replay and rotation acceptance
        run: python -m app.modules.dockos.test_gateway_replay
      - run: python -m app.modules.dockos.test_postgres_concurrency
      - run: python -m app.modules.dockos.test_postgres_limits
      - name: Multi-worker HTTP load and DB resilience acceptance
        run: |
          python -m app.modules.dockos.test_http_multiworker_load prepare
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 --workers 4 >/tmp/dockos-uvicorn.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID >/dev/null 2>&1 || true; cat /tmp/dockos-uvicorn.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/health
          python -m app.modules.dockos.test_http_multiworker_load run
          curl -fsS http://127.0.0.1:8090/api/dockos/ops/metrics >/tmp/dockos.metrics
          grep -q 'dockos_reservation_latency_p95_ms' /tmp/dockos.metrics
          grep -q 'dockos_lock_wait_p95_ms' /tmp/dockos.metrics
          grep -q 'dockos_outbox_oldest_age_seconds' /tmp/dockos.metrics
          grep -q 'dockos_db_pool_saturation_ratio' /tmp/dockos.metrics

          PG_ID=$(docker ps --filter ancestor=postgres:16-alpine -q | head -1)
          test -n "$PG_ID"
          docker pause "$PG_ID"
          if curl -fsS --max-time 2 http://127.0.0.1:8090/api/dockos/reservations >/dev/null; then
            echo 'DB_NETWORK_INTERRUPTION=FAIL request unexpectedly succeeded'
            docker unpause "$PG_ID"
            exit 1
          fi
          echo 'DB_NETWORK_INTERRUPTION=PASS fail-closed while database paused'
          docker unpause "$PG_ID"
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -U dockos -d dockos && break || sleep 1; done
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8090/api/dockos/reservations >/dev/null; then echo 'DB_NETWORK_RECOVERY=PASS'; break; fi
            sleep 1
            test "$i" != "30"
          done

          docker restart "$PG_ID" >/dev/null
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -U dockos -d dockos && break || sleep 1; done
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8090/api/dockos/reservations >/dev/null; then echo 'DB_RESTART_RECOVERY=PASS'; break; fi
            sleep 1
            test "$i" != "30"
          done
      - name: PostgreSQL backup and restore acceptance
        run: |
          pg_dump "$DATABASE_URL" --format=custom --file=/tmp/dockos.dump
          createdb -h 127.0.0.1 -U dockos dockos_restore
          pg_restore -h 127.0.0.1 -U dockos -d dockos_restore /tmp/dockos.dump
          restored=$(psql -h 127.0.0.1 -U dockos -d dockos_restore -Atc "SELECT count(*) FROM dockos.schema_migrations WHERE version IN ('001_dockos_postgres','002_runtime_hardening');")
          test "$restored" = "2"
          echo "POSTGRES_BACKUP_RESTORE=PASS migrations=$restored"

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build converged backend container
        run: docker build -f backend/Dockerfile -t dockos-backend:converged .
