name: EAY AI Core CI

on:
  push:
    branches:
      - "feature/eay-ai-core-*"
    paths:
      - "services/eay-ai-core/**"
      - "docker-compose.eay-ai-core.yml"
      - ".github/workflows/eay-ai-core-ci.yml"
  pull_request:
    paths:
      - "services/eay-ai-core/**"
      - "docker-compose.eay-ai-core.yml"
      - ".github/workflows/eay-ai-core-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q app tests

      - name: Test
        run: pytest -q

      - name: Build hardened runtime image
        run: |
          docker build -t eay-ai-core-ci .
          test "$(docker image inspect eay-ai-core-ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm eay-ai-core-ci \
            python -c "from app.main import app; assert app.title == 'EAY AI Core'"

      - name: Validate internal-only compose overlay
        working-directory: .
        run: |
          touch /tmp/eay-jarvis-ci-private-key.pem
          EAY_JARVIS_SERVICE_PRIVATE_KEY_SOURCE_FILE=/tmp/eay-jarvis-ci-private-key.pem \
          EAY_JARVIS_SERVICE_SIGNING_KID=ci-runtime-v1 \
            docker compose \
              -f docker-compose.eay-ai-core.yml \
              --profile jarvis \
              config > /tmp/eay-ai-core-compose.yml
          grep -q 'EAY_JARVIS_SERVICE_PRIVATE_KEY_FILE: /run/secrets/eay_jarvis_service_private_key' /tmp/eay-ai-core-compose.yml
          grep -q 'EAY_PLATFORM_CORE_BASE_URL: http://core-api:8000' /tmp/eay-ai-core-compose.yml
          grep -q 'name: opex-platform_ai_plane' /tmp/eay-ai-core-compose.yml
          if grep -q '^    ports:' /tmp/eay-ai-core-compose.yml; then
            echo 'EAY AI Core unexpectedly publishes a host port' >&2
            exit 1
          fi
