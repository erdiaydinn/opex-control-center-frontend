name: EAY Audit CI

on:
  pull_request:
    paths:
      - "src/modules/audit/**"
      - "src/App.jsx"
      - "src/modules/control-center/commandCenterModules.js"
      - "scripts/test-audit-product-states.mjs"
      - "services/core-api/app/modules/audit/**"
      - "services/core-api/app/core/permission_catalog.py"
      - "services/core-api/app/budget_main.py"
      - "services/core-api/alembic/versions/0046_audit_operating_system.py"
      - "services/core-api/alembic/versions/0047_audit_privacy_verification.py"
      - ".github/workflows/eay-audit-ci.yml"
  push:
    branches:
      - "product/eay-audit-intelligence-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-web:
    name: Audit web / contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:audit
      - run: npm run build

  audit-api-static:
    name: Audit API / migration static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile audit authority
        run: >-
          python -m compileall -q
          app/modules/audit
          app/core/permission_catalog.py
          app/budget_main.py
          alembic/versions/0046_audit_operating_system.py
          alembic/versions/0047_audit_privacy_verification.py
      - name: Ruff audit authority
        run: >-
          ruff check
          app/modules/audit
          app/core/permission_catalog.py
          app/budget_main.py
          alembic/versions/0046_audit_operating_system.py
          alembic/versions/0047_audit_privacy_verification.py
