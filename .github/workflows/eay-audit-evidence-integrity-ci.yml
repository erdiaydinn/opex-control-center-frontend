name: EAY Audit Evidence Integrity CI

on:
  pull_request:
    paths:
      - "services/core-api/app/modules/audit/evidence_binding.py"
      - "services/core-api/app/modules/audit/evidence_binding_schemas.py"
      - "services/core-api/app/modules/audit/routes.py"
      - "services/core-api/alembic/versions/0050_audit_evidence_binding_integrity.py"
      - "services/core-api/tests/test_audit_evidence_binding_contracts.py"
      - ".github/workflows/eay-audit-evidence-integrity-ci.yml"
  push:
    branches:
      - "product/eay-audit-intelligence-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-audit-evidence-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-integrity:
    name: Private receipt binding / migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Evidence binding contracts
        run: pytest -q tests/test_audit_evidence_binding_contracts.py
      - name: Compile authority and migration
        run: >-
          python -m compileall -q
          app/modules/audit/evidence_binding.py
          app/modules/audit/evidence_binding_schemas.py
          app/modules/audit/routes.py
          alembic/versions/0050_audit_evidence_binding_integrity.py
      - name: Ruff application binding
        run: >-
          ruff check
          app/modules/audit/evidence_binding_schemas.py
          app/modules/audit/routes.py
          tests/test_audit_evidence_binding_contracts.py
      - name: Ruff SQL binding
        run: ruff check --ignore E501 app/modules/audit/evidence_binding.py
      - name: Ruff binding migration
        run: ruff check --ignore E501 alembic/versions/0050_audit_evidence_binding_integrity.py
      - name: Verify migration lineage
        run: >-
          python -c "from pathlib import Path; p=Path('alembic/versions/0050_audit_evidence_binding_integrity.py').read_text(); assert 'down_revision: str = \"0049_audit_location_accountability\"' in p; assert 'field_evidence_receipt_id' in p; assert 'redacted_object_sha256' in p; assert 'redacted_object_byte_size' in p; assert 'uq_audit_redaction_field_receipt_binding' in p; print('Audit evidence binding migration lineage: PASS')"
