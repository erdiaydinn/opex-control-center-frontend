name: EAY Audit Field Truth CI

on:
  push:
    branches:
      - "product/eay-audit-field-truth-v1"
  pull_request:
    paths:
      - "services/core-api/app/modules/audit/**"
      - "services/core-api/tests/test_audit_field_truth_contracts.py"
      - "services/core-api/tests/test_audit_visit_contracts.py"
      - "services/core-api/tests/test_audit_visit_migration_contract.py"
      - "services/core-api/tests/test_audit_intelligence_score_authority.py"
      - "services/core-api/tests/test_audit_video_authority_integration_contracts.py"
      - "services/core-api/tests/test_audit_video_authority_adversarial.py"
      - "services/core-api/alembic/versions/0056_audit_visit_manifests.py"
      - "services/core-api/alembic/versions/0057_audit_video_authority.py"
      - "services/core-api/alembic/versions/0058_audit_video_replay_fence.py"
      - "services/core-api/alembic/versions/0059_audit_inference_lease_immutability.py"
      - "services/core-api/app/budget_main.py"
      - ".github/workflows/eay-audit-field-truth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-audit-field-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-truth-contracts:
    name: Audit field truth / visit authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Field truth and visit contracts
        run: >-
          pytest -q
          tests/test_audit_field_truth_contracts.py
          tests/test_audit_visit_contracts.py
          tests/test_audit_visit_migration_contract.py
          tests/test_audit_intelligence_score_authority.py
      - name: Compile field truth authority
        run: >-
          python -m compileall -q
          app/modules/audit/control_contracts.py
          app/modules/audit/field_truth.py
          app/modules/audit/reporting.py
          app/modules/audit/visit_planning.py
          app/modules/audit/visit_repository.py
          app/modules/audit/visit_routes.py
          app/modules/audit/intelligence.py
          app/budget_main.py
          alembic/versions/0056_audit_visit_manifests.py
          alembic/versions/0057_audit_video_authority.py
          alembic/versions/0058_audit_video_replay_fence.py
          alembic/versions/0059_audit_inference_lease_immutability.py
      - name: Ruff field truth authority
        run: >-
          ruff check --ignore E501
          app/modules/audit/control_contracts.py
          app/modules/audit/field_truth.py
          app/modules/audit/reporting.py
          app/modules/audit/visit_planning.py
          app/modules/audit/visit_repository.py
          app/modules/audit/visit_routes.py
          app/modules/audit/intelligence.py
          app/budget_main.py
          alembic/versions/0056_audit_visit_manifests.py
          alembic/versions/0057_audit_video_authority.py
          alembic/versions/0058_audit_video_replay_fence.py
          alembic/versions/0059_audit_inference_lease_immutability.py
          tests/test_audit_field_truth_contracts.py
          tests/test_audit_visit_contracts.py
          tests/test_audit_visit_migration_contract.py
          tests/test_audit_intelligence_score_authority.py
      - name: Single Alembic head
        run: |
          set -euo pipefail
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
          printf '%s\n' "$heads" | grep -q '^0059_audit_inference_lease_immutability (head)$'
