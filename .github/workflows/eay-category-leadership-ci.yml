name: EAY Category Leadership Convergence

on:
  pull_request:
    branches:
      - product/eay-product-completion-v1
    paths:
      - "backend/app/modules/data_collection/**"
      - "backend/app/modules/field_intelligence/**"
      - "backend/app/modules/workforce/demand_model.py"
      - "backend/app/modules/workforce/test_demand_model.py"
      - "backend/app/modules/workforce/pressure_model.py"
      - "backend/app/modules/workforce/test_pressure_model.py"
      - "backend/app/modules/workforce/scenario_model.py"
      - "backend/app/modules/workforce/test_scenario_model.py"
      - "backend/app/platform/business_glossary/**"
      - "backend/migrations/006_field_intelligence.sql"
      - "backend/migrations/007_business_glossary.sql"
      - "backend/tests/test_business_glossary_*.py"
      - "backend/tests/test_field_*.py"
      - "docs/EAY_RISE_ERA_PRODUCT_CONTRACT.md"
      - ".github/workflows/eay-category-leadership-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-category-leadership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Field, scheduling and semantic contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.9,<3.0" "pytest>=8,<9"
      - name: Compile category-leadership backend
        run: |
          python -m compileall -q \
            backend/app/modules/data_collection \
            backend/app/modules/field_intelligence \
            backend/app/modules/workforce/demand_model.py \
            backend/app/modules/workforce/pressure_model.py \
            backend/app/modules/workforce/scenario_model.py \
            backend/app/platform/business_glossary
      - name: Run Field Intelligence adversarial and persistence contracts
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_field_intelligence.py backend/tests/test_field_evidence.py backend/tests/test_field_persistence_contract.py
      - name: Run Business Glossary semantic and governance contracts
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_business_glossary_resolver.py backend/tests/test_business_glossary_governance.py
      - name: Run operational data collection contracts
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/app/modules/data_collection/test_service.py
      - name: Run Workforce demand pressure and scenario contracts
        env:
          PYTHONPATH: backend
        run: |
          tests=(backend/app/modules/workforce/test_pressure_model.py backend/app/modules/workforce/test_scenario_model.py)
          if test -f backend/app/modules/workforce/test_demand_model.py; then
            tests+=(backend/app/modules/workforce/test_demand_model.py)
          fi
          python -m pytest -q "${tests[@]}"
      - name: Preserve production truth boundary
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          roots = [
              Path("backend/app/modules/field_intelligence"),
              Path("backend/app/modules/workforce/pressure_model.py"),
              Path("backend/app/modules/workforce/scenario_model.py"),
              Path("backend/app/platform/business_glossary"),
              Path("docs/EAY_RISE_ERA_PRODUCT_CONTRACT.md"),
          ]
          patterns = (
              re.compile(r"production_ready\s*=\s*True"),
              re.compile(r"[\"']production_ready[\"']\s*:\s*true", re.IGNORECASE),
          )
          violations = []
          for root in roots:
              files = [root] if root.is_file() else list(root.rglob("*.py")) + list(root.rglob("*.md"))
              for path in files:
                  text = path.read_text(encoding="utf-8")
                  if any(pattern.search(text) for pattern in patterns):
                      violations.append(str(path))
          if violations:
              raise SystemExit(f"production truth boundary violated: {violations}")
          print("production truth boundary preserved")
          PY
