name: EAY Core Ruff Safe Autofix

on:
  push:
    branches:
      - release/platform-convergence-v0.1

permissions:
  contents: write

concurrency:
  group: eay-core-ruff-autofix
  cancel-in-progress: true

jobs:
  safe-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Apply safe Ruff fixes only
        run: ruff check --fix services/core-api || true
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit safe formatting fixes
        run: |
          if git diff --quiet; then
            echo 'No safe Ruff fixes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/core-api
          git commit -m 'style(core): apply safe Ruff convergence fixes'
          git push origin HEAD:release/platform-convergence-v0.1
