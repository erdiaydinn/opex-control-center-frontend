# Branch-only one-shot focused Ruff repair v4 targeted-E501
name: EAY Core Ruff Focused Repair

on:
  push:
    branches:
      - agent/core-ruff-focused-repair-v2

permissions:
  contents: write

concurrency:
  group: eay-core-ruff-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-fix-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/core-ruff-focused-repair-v2
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install focused repair tooling
        run: python -m pip install 'ruff>=0.8,<1' 'autopep8>=2.3,<3'
      - name: Apply Ruff safe fixes only
        run: ruff check services/core-api --fix || true
      - name: Format only files that still report E501
        run: |
          ruff check services/core-api --output-format=json > /tmp/core-ruff.json || true
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          diagnostics = json.loads(Path('/tmp/core-ruff.json').read_text(encoding='utf-8') or '[]')
          files = sorted({item['filename'] for item in diagnostics if item.get('code') == 'E501'})
          print(f'E501_FILES={len(files)}')
          if files:
              subprocess.run(['ruff', 'format', *files], check=True)
              subprocess.run([
                  'autopep8', '--in-place', '--select=E501', '--max-line-length=100', *files
              ], check=True)
          PY
      - name: Capture residual strict Ruff debt
        run: |
          mkdir -p .eay/ci
          {
            echo "HEAD=${GITHUB_SHA}"
            echo "RUFF_VERSION=$(ruff --version)"
            echo "AUTOPEP8_VERSION=$(autopep8 --version)"
            echo "---"
            ruff check services/core-api --output-format=concise || true
          } > .eay/ci/core-ruff-focused-remaining.txt
      - name: Commit targeted repairs and diagnostic report
        run: |
          if git diff --quiet -- services/core-api .eay/ci/core-ruff-focused-remaining.txt; then
            echo 'CORE_RUFF_FOCUSED_CHANGES=NONE'
            exit 0
          fi
          git config user.name 'eay-ci-repair-bot'
          git config user.email 'eay-ci-repair-bot@users.noreply.github.com'
          git add services/core-api .eay/ci/core-ruff-focused-remaining.txt
          git commit -m 'style(core): repair residual E501 only'
          git push origin HEAD:agent/core-ruff-focused-repair-v2
