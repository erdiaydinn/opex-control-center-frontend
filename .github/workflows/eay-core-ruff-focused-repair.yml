# Branch-only one-shot focused Ruff repair v9 helper-driven
name: EAY Core Ruff Focused Repair

on:
  push:
    branches:
      - agent/core-ruff-focused-repair-v2

permissions:
  contents: write

concurrency:
  group: eay-core-ruff-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-fix-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/core-ruff-focused-repair-v2
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install canonical Ruff compatibility band
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Apply Ruff safe fixes only
        run: ruff check services/core-api --fix || true
      - name: Run tested focused SQL repair helper
        run: python scripts/ci/core_ruff_sql_wrap.py
      - name: Capture residual strict Ruff debt
        if: always()
        run: |
          mkdir -p .eay/ci
          {
            echo "HEAD=${GITHUB_SHA}"
            echo "RUFF_VERSION=$(ruff --version)"
            echo "---"
            ruff check services/core-api --output-format=concise || true
          } > .eay/ci/core-ruff-focused-remaining.txt
      - name: Commit targeted repairs and diagnostics
        if: always()
        run: |
          git config user.name 'eay-ci-repair-bot'
          git config user.email 'eay-ci-repair-bot@users.noreply.github.com'
          git add services/core-api .eay/ci/core-ruff-focused-remaining.txt .eay/ci/sql-wrap-output.txt
          if git diff --cached --quiet; then
            echo 'CORE_RUFF_FOCUSED_CHANGES=NONE'
            exit 0
          fi
          git commit -m 'style(core): apply focused SQL whitespace repair'
          git push origin HEAD:agent/core-ruff-focused-repair-v2
