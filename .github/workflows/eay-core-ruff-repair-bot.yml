# One-shot repair workflow v1
name: EAY Core Ruff Safe Repair Bot

on:
  push:
    branches:
      - agent/core-ruff-migration-format-repair

permissions:
  contents: write

concurrency:
  group: eay-core-ruff-safe-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-format-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/core-ruff-migration-format-repair
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the same Ruff compatibility band as Core API
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Apply only Ruff safe fixes and formatter to Core API
        run: |
          ruff check services/core-api --fix
          ruff format services/core-api
      - name: Commit formatter-only repair if changed
        run: |
          if git diff --quiet -- services/core-api; then
            echo 'CORE_RUFF_SAFE_REPAIR_CHANGES=NONE'
            exit 0
          fi
          git config user.name 'eay-ci-repair-bot'
          git config user.email 'eay-ci-repair-bot@users.noreply.github.com'
          git add services/core-api
          git commit -m 'style(core): apply safe Ruff repairs'
          git push origin HEAD:agent/core-ruff-migration-format-repair
      - name: Report remaining strict Ruff debt without weakening the gate
        if: always()
        run: ruff check services/core-api || true
