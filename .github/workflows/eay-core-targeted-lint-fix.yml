name: EAY Core Targeted Lint Fix

on:
  push:
    branches:
      - release/platform-convergence-v0.1

permissions:
  contents: write

concurrency:
  group: eay-core-targeted-lint-fix
  cancel-in-progress: true

jobs:
  targeted-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact reviewed transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "services/core-api/app/core/config.py",
              '        if self.environment in {"staging", "production"} and self.auth_mode not in {"oidc", "internal_assertion"}:\n',
              '        if (\n'
              '            self.environment in {"staging", "production"}\n'
              '            and self.auth_mode not in {"oidc", "internal_assertion"}\n'
              '        ):\n',
          )

          security_path = Path("services/core-api/tests/test_security_foundation.py")
          security = security_path.read_text(encoding="utf-8")
          old_top = (
              'import pytest\n'
              'from fastapi import HTTPException\n\n'
              'from app.core.config import Settings\n'
              'from app.core.security import _decode_development_token\n'
          )
          new_top = (
              'import pytest\n'
              'from fastapi import HTTPException, Request\n'
              'from fastapi.security import HTTPAuthorizationCredentials\n\n'
              'import app.core.security as security\n'
              'from app.core.config import Settings\n'
              'from app.core.security import _decode_development_token, get_current_principal\n'
          )
          old_late = (
              '\nfrom fastapi import Request\n'
              'from fastapi.security import HTTPAuthorizationCredentials\n\n'
              'import app.core.security as security\n'
              'from app.core.security import get_current_principal\n\n'
          )
          if security.count(old_top) != 1 or security.count(old_late) != 1:
              raise SystemExit("test_security_foundation.py: import layout did not match reviewed state")
          security = security.replace(old_top, new_top, 1).replace(old_late, "\n", 1)
          security_path.write_text(security, encoding="utf-8")

          replace_exact(
              "services/core-api/tests/test_sql_access_boundary.py",
              '''            if name in EXECUTION_CALLS:\n                if (\n                    location\n                    not in ALLOWED_SQL_EXECUTION_POINTS\n                ):\n                    violations.append(\n                        f"{relative}:{node.lineno} "\n                        f"{function} -> {name}"\n                    )\n''',
              '''            if (\n                name in EXECUTION_CALLS\n                and location not in ALLOWED_SQL_EXECUTION_POINTS\n            ):\n                violations.append(\n                    f"{relative}:{node.lineno} "\n                    f"{function} -> {name}"\n                )\n''',
          )

          replace_exact(
              "services/core-api/tests/test_sql_access_boundary.py",
              '''            if name in ENGINE_CALLS:\n                if (\n                    location\n                    not in ALLOWED_ENGINE_CREATION\n                ):\n                    violations.append(\n                        f"{relative}:{node.lineno} "\n                        f"{function} -> {name}"\n                    )\n''',
              '''            if (\n                name in ENGINE_CALLS\n                and location not in ALLOWED_ENGINE_CREATION\n            ):\n                violations.append(\n                    f"{relative}:{node.lineno} "\n                    f"{function} -> {name}"\n                )\n''',
          )
          PY
      - name: Install Core API dev dependencies
        run: python -m pip install -e './services/core-api[dev]'
      - name: Require full Core Ruff clean
        run: ruff check services/core-api
      - name: Run touched security guards
        run: |
          pytest -q services/core-api/tests/test_security_foundation.py
          pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Self-delete temporary write workflow
        run: rm .github/workflows/eay-core-targeted-lint-fix.yml
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit verified targeted fixes and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/core-api .github/workflows/eay-core-targeted-lint-fix.yml
          git commit -m 'fix(core): close remaining repo-wide lint debt'
          git push origin HEAD:release/platform-convergence-v0.1
