name: EAY Inventory Migration Contract

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
      - release/platform-convergence-v0.1
    paths:
      - "backend/migrations/*inventory*.sql"
      - "backend/app/modules/inventory/**"
      - "backend/tests/test_inventory_*.py"
      - ".github/workflows/eay-inventory-migration-contract.yml"
  push:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "backend/migrations/*inventory*.sql"
      - "backend/app/modules/inventory/**"
      - "backend/tests/test_inventory_*.py"
      - ".github/workflows/eay-inventory-migration-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eay_inventory_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eay_inventory_migrations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eay_inventory_migrations
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Apply authoritative Inventory production migration series
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t production < <(find backend/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_inventory_*.sql' | sort)
          applied=0
          for migration in "${production[@]}"; do
            base="$(basename "$migration")"
            version_text="${base%%_*}"
            version=$((10#$version_text))
            if (( version < 3 )); then
              printf 'legacy_inventory_migration_frozen=%s\n' "$migration"
              continue
            fi
            printf 'production_inventory_migration=%s\n' "$migration"
            psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            applied=$((applied + 1))
          done
          test "$applied" -ge 1
      - name: Require version registration for production migration series
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t production < <(find backend/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_inventory_*.sql' | sort)
          for migration in "${production[@]}"; do
            base="$(basename "$migration")"
            version_text="${base%%_*}"
            version=$((10#$version_text))
            if (( version < 3 )); then
              continue
            fi
            count="$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM inventory_schema_migrations WHERE version=${version}")"
            test "$count" = "1"
          done
      - name: Replay production migration series idempotently
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t production < <(find backend/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_inventory_*.sql' | sort)
          for migration in "${production[@]}"; do
            base="$(basename "$migration")"
            version_text="${base%%_*}"
            version=$((10#$version_text))
            if (( version < 3 )); then
              continue
            fi
            psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Prove v4 location-completion database authority when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f backend/migrations/004_inventory_location_completion.sql; then
            test "$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM inventory_schema_migrations WHERE version=4")" = "1"
            test "$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM pg_trigger WHERE tgname='inventory_guard_location_event_v4_trigger' AND NOT tgisinternal")" = "1"
            test "$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='inventory_location_completion_once_idx'")" = "1"
          fi
      - name: Prove v11 wall-to-wall fail-closed authority when present
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f backend/migrations/011_inventory_wall_to_wall_closeout_authority.sql; then
            exit 0
          fi
          test "$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM inventory_schema_migrations WHERE version=11")" = "1"
          test "$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM pg_class WHERE relname='inventory_document_closeouts' AND relkind='r'")" = "1"
          test "$(psql "$MIGRATION_DATABASE_URL" -Atc "SELECT count(*) FROM pg_trigger WHERE tgname IN ('inventory_wall_to_wall_location_scope_v11','inventory_wall_to_wall_sku_scope_v11','inventory_location_completion_anchor_v11','inventory_wall_to_wall_submit_guard_v11','inventory_wall_to_wall_closeout_v11') AND NOT tgisinternal")" = "5"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO inventory_documents(tenant_id,id,warehouse_id,name,state,created_by)
          VALUES('wall-v11','11111111-1111-1111-1111-111111111111','WH-WALL','Wall-to-wall v11 adversarial','COUNTING','ci');
          INSERT INTO inventory_document_locations(tenant_id,document_id,location_id)
          VALUES
            ('wall-v11','11111111-1111-1111-1111-111111111111','A01'),
            ('wall-v11','11111111-1111-1111-1111-111111111111','A02');
          INSERT INTO inventory_expected_stock(tenant_id,document_id,sku,barcode,expected_quantity,unit_cost)
          VALUES('wall-v11','11111111-1111-1111-1111-111111111111','SKU-1','8690000000001',1,1);
          SQL

          if psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "UPDATE inventory_documents SET state='SUBMITTED',revision=2,submitted_by='ci' WHERE tenant_id='wall-v11' AND id='11111111-1111-1111-1111-111111111111'"; then
            echo 'ERROR: incomplete wall-to-wall submission was accepted'
            exit 1
          fi

          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO inventory_mission_attempts(
            tenant_id,attempt_id,document_id,warehouse_id,location_id,
            created_by_subject,created_by_employee_id
          ) VALUES(
            'wall-v11','22222222-2222-2222-2222-222222222222',
            '11111111-1111-1111-1111-111111111111','WH-WALL','A01','ci','EMP-CI'
          );
          SQL

          if psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "DELETE FROM inventory_document_locations WHERE tenant_id='wall-v11' AND document_id='11111111-1111-1111-1111-111111111111' AND location_id='A02'"; then
            echo 'ERROR: location scope changed after counting authority started'
            exit 1
          fi

          if psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "UPDATE inventory_expected_stock SET expected_quantity=99 WHERE tenant_id='wall-v11' AND document_id='11111111-1111-1111-1111-111111111111'"; then
            echo 'ERROR: SKU/expected-stock scope changed after counting authority started'
            exit 1
          fi

          if psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "UPDATE inventory_document_locations SET completed_event_id='33333333-3333-3333-3333-333333333333',completed_at=now() WHERE tenant_id='wall-v11' AND document_id='11111111-1111-1111-1111-111111111111' AND location_id='A01'"; then
            echo 'ERROR: forged location-completion anchor was accepted'
            exit 1
          fi
      - name: Wall-to-wall source contract
        run: python -m unittest backend.tests.test_inventory_wall_to_wall_closeout_contract -v
      - name: Reject malformed diff
        run: git diff --check
