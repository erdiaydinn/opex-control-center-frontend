name: EAY Jarvis Grounded Intelligence Acceptance

on:
  push:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "services/eay-ai-core/app/grounded_*.py"
      - "services/eay-ai-core/tests/test_grounded_*.py"
      - "services/eay-ai-core/pyproject.toml"
      - ".github/workflows/eay-jarvis-grounded-intelligence-acceptance.yml"
  pull_request:
    branches:
      - product/eay-product-completion-v1
      - product/eay-category-leadership-v1
    paths:
      - "services/eay-ai-core/app/grounded_*.py"
      - "services/eay-ai-core/tests/test_grounded_*.py"
      - "services/eay-ai-core/pyproject.toml"
      - ".github/workflows/eay-jarvis-grounded-intelligence-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: eay-jarvis-grounded-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grounded-intelligence:
    runs-on: ubuntu-latest
    env:
      EAY_ENVIRONMENT: test
      EAY_AI_DB_PATH: /tmp/eay-ai-grounded-acceptance.db
      EAY_GROUNDED_CRITIC_ENABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - name: Install EAY AI Core test surface
        run: python -m pip install -e './services/eay-ai-core[dev]'
      - name: Compile observable grounded-intelligence boundary
        run: >-
          python -m compileall -q
          services/eay-ai-core/app/grounded_evidence_planner.py
          services/eay-ai-core/app/grounded_reasoning.py
          services/eay-ai-core/app/grounded_critic.py
          services/eay-ai-core/app/grounded_chat.py
      - name: Run planner guard critic and endpoint adversarial acceptance
        working-directory: services/eay-ai-core
        run: >-
          pytest -q
          tests/test_grounded_evidence_planner.py
          tests/test_grounded_evidence_planner_integration.py
          tests/test_grounded_reasoning.py
          tests/test_grounded_critic.py
          tests/test_grounded_critic_integration.py
          tests/test_grounded_chat.py
      - name: Prove observable-only planner and verifier contract
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('services/eay-ai-core/app/grounded_evidence_planner.py'),
              Path('services/eay-ai-core/app/grounded_reasoning.py'),
              Path('services/eay-ai-core/app/grounded_critic.py'),
              Path('services/eay-ai-core/app/grounded_chat.py'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8').lower() for path in paths)
          assert 'chain_of_thought' not in text
          assert 'evidence_plan' in text
          assert 'revision_instructions' in text
          print('JARVIS_GROUNDED_OBSERVABLE_ONLY=PASS')
          PY
      - name: Prove bounded execution order
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('services/eay-ai-core/app/grounded_chat.py').read_text(encoding='utf-8')
          plan = text.index('evidence_plan = build_evidence_plan')
          execute = text.index('evidence_candidates = execute_evidence_plan', plan)
          select = text.index('evidence = select_evidence', execute)
          answer = text.index('answer = ChatAnswer', select)
          guard = text.index('decision_quality = assess_and_calibrate_grounded_answer', answer)
          critic = text.index('critic, critic_raw = await _run_grounded_critic', guard)
          revision = text.index('revised_answer, revised_quality, revision_raw', critic)
          persist = text.index('store.save_interaction', revision)
          assert plan < execute < select < answer < guard < critic < revision < persist
          print('JARVIS_EVIDENCE_PLAN_TO_VERIFIER_ORDER=PASS')
          PY
      - name: Truth boundary
        run: |
          echo 'JARVIS_GROUNDED_REPOSITORY_ACCEPTANCE=IMPLEMENTED'
          echo 'JARVIS_PRODUCTION_TENANT_AUTHORITY=REQUIRED'
          echo 'JARVIS_PRODUCTION_BIGQUERY_EVIDENCE=REQUIRED'
          echo 'JARVIS_PRODUCTION_READY=FALSE'
