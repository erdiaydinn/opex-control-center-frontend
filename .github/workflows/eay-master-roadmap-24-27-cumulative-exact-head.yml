name: EAY Master Roadmap 24-27 Cumulative Exact-Head Acceptance

on:
  push:
    branches:
      - agent/master-roadmap-24-27-exact-head-aggregate
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "apps/planai/**"
      - "services/core-api/app/modules/planogram/**"
      - "services/core-api/tests/test_planogram*.py"
      - "services/core-api/alembic/versions/*planogram*.py"
      - "services/core-api/app/budget_main.py"
      - "config/eay_master_roadmap_60.json"
      - "src/**/*planogram*"
      - "src/**/Planogram/**"
      - ".github/workflows/eay-master-roadmap-24-planogram-physical-truth.yml"
      - ".github/workflows/eay-master-roadmap-25-planogram-optimizer.yml"
      - ".github/workflows/eay-master-roadmap-26-planogram-execution-compliance.yml"
      - ".github/workflows/eay-master-roadmap-24-27-cumulative-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: eay-master-roadmap-24-27-cumulative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planogram-24-27-cumulative:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/planai/backend/requirements.txt
            services/core-api/pyproject.toml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install PlanAI and Core test surfaces
        run: |
          python -m pip install -r apps/planai/backend/requirements.txt
          python -m pip install -e "./services/core-api[dev]"
      - name: Install reviewed frontend dependency closure
        run: |
          node scripts/ci/materialize-sheetjs.mjs
          npm ci
      - name: Verify Master Roadmap 24-27 authority and external truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap=json.loads(Path('config/eay_master_roadmap_60.json').read_text(encoding='utf-8'))
          expected={
              24:'Planogram physical truth',
              25:'Planogram optimizer',
              26:'Planogram execution/compliance',
              27:'Planogram 2D/3D experience',
          }
          for item_id,title in expected.items():
              item=next(row for row in roadmap['items'] if row['id']==item_id)
              assert item['title']==title, item
              assert item['external_status']=='REQUIRED', item
          print('MASTER_24_27_AUTHORITY=PASS')
          print('MASTER_24_27_EXTERNAL_EVIDENCE=REQUIRED')
          PY
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  exists=await c.fetchval("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')")
                  if not exists:
                      await c.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
              finally:
                  await c.close()
          asyncio.run(main())
          PY
      - name: Lint cumulative Planogram authority surface
        run: >-
          ruff check
          apps/planai/backend/physical_optimizer.py
          apps/planai/backend/physical_optimizer_v2.py
          apps/planai/backend/architecture_truth.py
          apps/planai/backend/physical_engine.py
          services/core-api/app/modules/planogram/store_dna.py
          services/core-api/app/modules/planogram/repository_store_dna.py
          services/core-api/app/modules/planogram/engine_adapter.py
          services/core-api/app/modules/planogram/optimizer_router.py
          services/core-api/app/modules/planogram/execution.py
          services/core-api/app/modules/planogram/execution_schemas.py
          services/core-api/app/modules/planogram/repository_execution.py
          services/core-api/app/modules/planogram/repository_plan_edit.py
          services/core-api/app/modules/planogram/repository_assignment_lifecycle.py
          services/core-api/app/modules/planogram/execution_service.py
          services/core-api/app/modules/planogram/execution_router.py
          services/core-api/app/modules/field_intelligence/planogram_compliance_promotion.py
          services/core-api/app/modules/field_intelligence/promotion_consumer_session.py
          services/core-api/tests/test_planogram_master24_store_dna.py
          services/core-api/tests/test_planogram_master25_optimizer_core.py
          services/core-api/tests/test_planogram_master26_execution.py
          services/core-api/tests/test_planogram_master26_handoff.py
          services/core-api/tests/test_planogram_master26_postgres.py
          services/core-api/tests/test_sql_access_boundary.py
      - name: Secure SQL data-access boundary
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Apply cumulative Core migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Master 24 Store DNA and native Core acceptance
        run: >-
          pytest -q
          services/core-api/tests/test_planogram_master24_store_dna.py
          services/core-api/tests/test_planogram_native_core.py
      - name: Prove Master 24 FORCE RLS and immutable history
        run: |
          PGPASSWORD=opex_migrator psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE versions_rls boolean; versions_force boolean; events_rls boolean; events_force boolean;
          BEGIN
            SELECT relrowsecurity, relforcerowsecurity INTO versions_rls, versions_force FROM pg_class WHERE oid='planogram_store_dna_versions'::regclass;
            SELECT relrowsecurity, relforcerowsecurity INTO events_rls, events_force FROM pg_class WHERE oid='planogram_store_dna_events'::regclass;
            IF NOT versions_rls OR NOT versions_force OR NOT events_rls OR NOT events_force THEN RAISE EXCEPTION 'Planogram Store DNA RLS is not FORCE enabled'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_planogram_store_dna_immutable_history' AND NOT tgisinternal) THEN RAISE EXCEPTION 'immutable history trigger missing'; END IF;
          END $$;
          SQL
      - name: Master 25 physical truth and optimizer deep acceptance
        working-directory: apps/planai/backend
        run: |
          python -m unittest tests.test_physical_truth tests.test_physical_engine tests.test_physical_truth_audit
          python -m pytest -q tests/test_architecture_truth.py tests/test_architecture_route_gate.py
          python -m unittest tests.test_physical_optimizer
          python - <<'PY'
          from physical_optimizer import OBJECTIVE_ORDER, STRATEGIES as V1_STRATEGIES
          from physical_optimizer_v2 import OPTIMIZER_VERSION, STRATEGIES as V2_STRATEGIES
          assert OBJECTIVE_ORDER[0]=='hard_violation_count'
          assert V1_STRATEGIES[0]==('baseline', None)
          assert V2_STRATEGIES[0]==('baseline', None)
          assert OPTIMIZER_VERSION=='physical-plan-optimizer-v2'
          assert len(V2_STRATEGIES)==8
          print('MASTER_25_HARD_FIRST=PASS')
          PY
      - name: Master 25 Core optimizer preview and Master 24 regression
        run: >-
          python -m pytest -q
          services/core-api/tests/test_planogram_master25_optimizer_core.py
          services/core-api/tests/test_planogram_native_core.py
          services/core-api/tests/test_planogram_master24_store_dna.py
      - name: Master 26 Field promotion and execution compliance acceptance
        run: >-
          python -m pytest -q
          services/core-api/tests/test_field_governed_promotion.py
          services/core-api/tests/test_planogram_master26_execution.py
          services/core-api/tests/test_planogram_master26_handoff.py
          services/core-api/tests/test_planogram_master26_postgres.py
      - name: Planogram 10-locale operations and product-state contract
        run: |
          node scripts/test-planogram-operations-ui.mjs
          node scripts/test-planogram-product-states.mjs
          node scripts/test-no-new-hardcoded-ui-strings.mjs
      - name: Master 27 digital twin and route explainability
        run: |
          node scripts/test-planogram-digital-twin.mjs
          node scripts/test-planogram-route-explainability.mjs
      - name: Production build with dynamic 3D runtime
        run: npm run build -- --manifest
      - name: Prove Three.js remains dynamically split
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('dist/.vite/manifest.json','utf8'));
          const entries=Object.entries(manifest);
          const main=manifest['index.html'] ?? entries.map(([,row])=>row).find((row)=>row.isEntry === true);
          if (!main?.file) throw new Error('Vite application entry missing');
          const mainText=fs.readFileSync(`dist/${main.file}`,'utf8');
          if (mainText.includes('WebGLRenderer') || mainText.includes('OrbitControls')) throw new Error('Three.js leaked into eager main entry');
          const dynamicThree=entries.filter(([key,row]) => {
            const identity=`${key} ${row.src ?? ''} ${row.name ?? ''} ${row.file ?? ''}`;
            return row.isDynamicEntry === true && /three\.module|OrbitControls|node_modules\/three\//i.test(identity);
          });
          if (!dynamicThree.length) throw new Error('No dynamic Three.js manifest entry found');
          console.log(`MASTER_24_27_DYNAMIC_THREE_ENTRIES=${dynamicThree.map(([,row])=>row.file).join(',')}`);
          NODE
      - name: Preserve accessibility and localization product gate
        run: npm run test:inclusion
      - name: Preserve cumulative production truth boundary
        run: |
          python - <<'PY'
          from app.modules.planogram.router import REQUIRED_EVIDENCE
          from app.modules.planogram.execution_schemas import PlanogramPlanDraftRequest
          assert 'approved_sku_dimensions' in REQUIRED_EVIDENCE
          assert 'product_image_linkage' in REQUIRED_EVIDENCE
          assert 'fixture_geometry_capacity' in REQUIRED_EVIDENCE
          assert 'physical_truth_attested' not in PlanogramPlanDraftRequest.model_json_schema()['properties']
          print('MASTER_24_27_REPOSITORY_SOFTWARE_ACCEPTANCE=PASS')
          print('MASTER_24_27_MEASURED_STORE_CAD_FIELD_UAT=REQUIRED')
          print('MASTER_24_27_PRODUCTION_READY=FALSE')
          PY