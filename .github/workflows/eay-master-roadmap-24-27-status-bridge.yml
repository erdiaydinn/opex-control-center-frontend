# Exact-head status bridge v1
name: EAY Master Roadmap 24-27 Exact-Head Status Bridge

on:
  push:
    branches:
      - agent/master-roadmap-24-27-exact-head-aggregate
      - product/eay-category-leadership-v1

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: eay-master-roadmap-24-27-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-aggregate-status:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AGGREGATE_WORKFLOW: eay-master-roadmap-24-27-cumulative-exact-head.yml
      STATUS_CONTEXT: EAY Master Roadmap 24-27 Cumulative Exact-Head
    steps:
      - name: Await aggregate exact-head conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${AGGREGATE_WORKFLOW}/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=20"
          run_id=""
          conclusion=""
          for attempt in $(seq 1 180); do
            payload="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}")"
            run_id="$(jq -r --arg sha "${GITHUB_SHA}" '.workflow_runs[] | select(.head_sha==$sha) | .id' <<<"${payload}" | head -n1)"
            if [[ -n "${run_id}" && "${run_id}" != "null" ]]; then
              status="$(jq -r --arg sha "${GITHUB_SHA}" '.workflow_runs[] | select(.head_sha==$sha) | .status' <<<"${payload}" | head -n1)"
              conclusion="$(jq -r --arg sha "${GITHUB_SHA}" '.workflow_runs[] | select(.head_sha==$sha) | .conclusion // ""' <<<"${payload}" | head -n1)"
              echo "aggregate_run_id=${run_id} status=${status} conclusion=${conclusion:-pending}"
              if [[ "${status}" == "completed" ]]; then
                break
              fi
            else
              echo "aggregate exact-head run not visible yet"
            fi
            sleep 10
          done
          if [[ -z "${run_id}" || "${run_id}" == "null" || -z "${conclusion}" ]]; then
            echo "Aggregate exact-head run did not complete inside the bounded observer window" >&2
            exit 1
          fi
          echo "AGGREGATE_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          echo "AGGREGATE_CONCLUSION=${conclusion}" >> "${GITHUB_ENV}"
      - name: Publish exact-head commit status
        if: always() && env.AGGREGATE_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${AGGREGATE_CONCLUSION}" in
            success) state=success ;;
            failure|timed_out|action_required|startup_failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${AGGREGATE_RUN_ID}"
          body="$(jq -nc \
            --arg state "${state}" \
            --arg context "${STATUS_CONTEXT}" \
            --arg description "Master 24-27 aggregate: ${AGGREGATE_CONCLUSION}" \
            --arg target_url "${target_url}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${body}"
          [[ "${state}" == "success" ]]
