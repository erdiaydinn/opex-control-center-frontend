name: EAY Master Roadmap 26 - Planogram Execution Compliance

on:
  push:
    branches:
      - agent/master-roadmap-26-planogram-execution-compliance
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "apps/planai/**"
      - "services/core-api/app/modules/planogram/**"
      - "services/core-api/tests/test_planogram*.py"
      - "services/core-api/alembic/versions/*planogram*.py"
      - "services/core-api/app/budget_main.py"
      - "config/eay_master_roadmap_60.json"
      - "src/**/*planogram*"
      - "src/**/Planogram/**"
      - ".github/workflows/eay-master-roadmap-24-planogram-physical-truth.yml"
      - ".github/workflows/eay-master-roadmap-25-planogram-optimizer.yml"
      - ".github/workflows/eay-master-roadmap-26-planogram-execution-compliance.yml"
      - ".github/workflows/eay-master-roadmap-24-27-cumulative-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execution-compliance-authority:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/core-api/pyproject.toml
            apps/planai/backend/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install Planogram and Core dependencies
        run: |
          python -m pip install -r apps/planai/backend/requirements.txt
          python -m pip install -e "./services/core-api[dev]"
      - name: Verify Master Roadmap item 26 authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap=json.loads(Path('config/eay_master_roadmap_60.json').read_text(encoding='utf-8'))
          item=next(row for row in roadmap['items'] if row['id']==26)
          assert item['title']=='Planogram execution/compliance', item
          print('MASTER_26_AUTHORITY=PASS')
          PY
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  exists=await c.fetchval("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')")
                  if not exists:
                      await c.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
              finally:
                  await c.close()
          asyncio.run(main())
          PY
      - name: Lint execution compliance boundary
        run: >-
          ruff check
          services/core-api/app/modules/planogram/execution.py
          services/core-api/app/modules/planogram/execution_schemas.py
          services/core-api/app/modules/planogram/repository_execution.py
          services/core-api/app/modules/planogram/repository_plan_edit.py
          services/core-api/app/modules/planogram/repository_assignment_lifecycle.py
          services/core-api/app/modules/planogram/execution_service.py
          services/core-api/app/modules/planogram/execution_router.py
          services/core-api/app/modules/field_intelligence/planogram_compliance_promotion.py
          services/core-api/app/modules/field_intelligence/promotion_consumer_session.py
          services/core-api/app/field_promotion_routes.py
          services/core-api/app/budget_main.py
          services/core-api/tests/test_planogram_master26_execution.py
          services/core-api/tests/test_planogram_master26_handoff.py
          services/core-api/tests/test_planogram_master26_postgres.py
          services/core-api/tests/test_sql_access_boundary.py
      - name: Secure SQL data-access boundary
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Apply cumulative Core migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Master 24 and 25 Planogram regression
        run: >-
          pytest -q
          services/core-api/tests/test_planogram_native_core.py
          services/core-api/tests/test_planogram_master24_store_dna.py
          services/core-api/tests/test_planogram_master25_optimizer_core.py
      - name: Field governed promotion regression
        run: pytest -q services/core-api/tests/test_field_governed_promotion.py
      - name: Master 26 execution compliance contract
        run: >-
          pytest -q
          services/core-api/tests/test_planogram_master26_execution.py
          services/core-api/tests/test_planogram_master26_handoff.py
      - name: Master 26 PostgreSQL adversarial acceptance
        run: pytest -q services/core-api/tests/test_planogram_master26_postgres.py
      - name: Planogram global operations UI contract
        run: |
          node scripts/test-planogram-operations-ui.mjs
          node scripts/test-planogram-product-states.mjs
          node scripts/test-no-new-hardcoded-ui-strings.mjs
      - name: Install reviewed frontend dependency closure
        run: |
          node scripts/ci/materialize-sheetjs.mjs
          npm ci
      - name: Production frontend build with converged Planogram UI
        run: npm run build
      - name: Preserve external evidence truth boundary
        run: |
          python - <<'PY'
          from app.modules.planogram.execution_schemas import PlanogramPlanDraftRequest
          assert 'physical_truth_attested' not in PlanogramPlanDraftRequest.model_json_schema()['properties']
          print('MASTER_26_RUNTIME_ATTESTATION_AUTHORITY=DENIED')
          print('MASTER_26_FIELD_EVIDENCE_STORAGE=REUSED')
          print('MASTER_26_EXTERNAL_STORE_EXECUTION_EVIDENCE=REQUIRED')
          PY
