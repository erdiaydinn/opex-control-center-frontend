name: EAY Master Roadmap 27 - Planogram 2D 3D Experience

on:
  push:
    branches:
      - agent/master-roadmap-27-planogram-2d-3d-experience
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - product/eay-category-leadership-v1

permissions:
  contents: read

jobs:
  planogram-2d-3d-authority:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/core-api/pyproject.toml
            apps/planai/backend/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install Planogram and Core dependencies
        run: |
          python -m pip install -r apps/planai/backend/requirements.txt
          python -m pip install -e "./services/core-api[dev]"
      - name: Verify Master Roadmap item 27 authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap=json.loads(Path('config/eay_master_roadmap_60.json').read_text(encoding='utf-8'))
          item=next(row for row in roadmap['items'] if row['id']==27)
          assert item['title']=='Planogram 2D/3D experience', item
          print('MASTER_27_AUTHORITY=PASS')
          PY
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  exists=await c.fetchval("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')")
                  if not exists:
                      await c.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
              finally:
                  await c.close()
          asyncio.run(main())
          PY
      - name: Lint Master 27 read-only boundary
        run: >-
          ruff check
          services/core-api/app/modules/planogram/view_router.py
          services/core-api/tests/test_planogram_master27_view.py
      - name: Secure SQL data-access boundary
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Apply cumulative Core migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Revalidate Master 24 and 25 Planogram contracts
        run: >-
          pytest -q
          services/core-api/tests/test_planogram_native_core.py
          services/core-api/tests/test_planogram_master24_store_dna.py
          services/core-api/tests/test_planogram_master25_optimizer_core.py
      - name: Revalidate Master 26 execution compliance
        run: >-
          pytest -q
          services/core-api/tests/test_field_governed_promotion.py
          services/core-api/tests/test_planogram_master26_execution.py
          services/core-api/tests/test_planogram_master26_handoff.py
          services/core-api/tests/test_planogram_master26_postgres.py
      - name: Master 27 persisted assignment view contract
        run: pytest -q services/core-api/tests/test_planogram_master27_view.py
      - name: Master 27 exact geometry view model and localization
        run: node scripts/test-planogram-2d3d-ui.mjs
      - name: Revalidate Planogram product quality contracts
        run: |
          node scripts/test-planogram-operations-ui.mjs
          node scripts/test-planogram-product-states.mjs
          node scripts/test-no-new-hardcoded-ui-strings.mjs
      - name: Install reviewed frontend dependency closure
        run: |
          node scripts/ci/materialize-sheetjs.mjs
          npm ci
      - name: Production frontend build with native 2D 3D experience
        run: npm run build
      - name: Preserve physical-truth visualization boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const viewer = fs.readFileSync('src/modules/planogram/PlanogramExperience.jsx', 'utf8');
          const model = fs.readFileSync('src/modules/planogram/planogramSceneModel.js', 'utf8');
          const viewRoute = fs.readFileSync('services/core-api/app/modules/planogram/view_router.py', 'utf8');
          if (/Spline|iframe|postMessage\(|access_token/.test(viewer)) throw new Error('legacy_visual_authority_detected');
          if (!/geometryReady/.test(model)) throw new Error('exact_geometry_gate_missing');
          if (/\bINSERT\b|\bUPDATE\b|\bDELETE\b/.test(viewRoute)) throw new Error('visualization_route_not_read_only');
          console.log('MASTER_27_EXTERNAL_PHYSICAL_EVIDENCE=REQUIRED');
          console.log('MASTER_27_VISUALIZATION_AUTHORITY=READ_ONLY');
          console.log('MASTER_27_INVENTED_GEOMETRY=DENIED');
          NODE
