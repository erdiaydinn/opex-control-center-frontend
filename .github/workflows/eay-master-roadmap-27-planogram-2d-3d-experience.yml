name: EAY Master Roadmap 27 - Planogram 2D 3D Experience

on:
  push:
    branches:
      - agent/master-roadmap-27-exact-head-gate
      - product/eay-category-leadership-v1
      - product/planogram-market-leadership-v1
  pull_request:
    branches:
      - product/eay-product-completion-v1
      - product/eay-category-leadership-v1
    paths:
      - "src/modules/planogram/**"
      - "src/platform/i18n/planogramDigitalTwinMessages.js"
      - "src/platform/i18n/planogramEconomicsMessages.js"
      - "src/platform/i18n/planogramScenarioMessages.js"
      - "src/platform/i18n/planogramStoreScanMessages.js"
      - "src/platform/i18n/planogramScanAnnotationMessages.js"
      - "src/platform/i18n/planogramScannedTwinMessages.js"
      - "src/platform/i18n/planogramFixtureBindingMessages.js"
      - "src/platform/i18n/planogramScannedOptimizerMessages.js"
      - "src/platform/i18n/planogramPickerEyeMessages.js"
      - "src/platform/i18n/planogramAuthoringMessages.js"
      - "scripts/test-planogram-digital-twin.mjs"
      - "scripts/test-planogram-engineering-2d.mjs"
      - "scripts/test-planogram-route-explainability.mjs"
      - "scripts/test-planogram-candidate-baskets.mjs"
      - "scripts/test-planogram-candidate-bundle.mjs"
      - "scripts/test-planogram-visual-quality-model.mjs"
      - "scripts/test-planogram-economics-ui.mjs"
      - "scripts/test-planogram-scenario-portfolio.mjs"
      - "scripts/test-planogram-store-scan-ui.mjs"
      - "scripts/test-planogram-scan-annotation.mjs"
      - "scripts/test-planogram-scanned-twin.mjs"
      - "scripts/test-planogram-fixture-binding.mjs"
      - "scripts/test-planogram-scanned-optimizer-v6.mjs"
      - "scripts/test-planogram-picker-eye-assets.mjs"
      - "scripts/test-planogram-authoring.mjs"
      - "config/eay_planogram_visual_quality_v1.json"
      - "package.json"
      - ".github/workflows/eay-master-roadmap-27-planogram-2d-3d-experience.yml"

permissions:
  contents: read

concurrency:
  group: eay-roadmap-27-planogram-digital-twin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digital-twin-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Reject new hard-coded Planogram UI strings
        run: node scripts/test-no-new-hardcoded-ui-strings.mjs
      - name: Verify Master Roadmap item 27 authority
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const roadmap=JSON.parse(fs.readFileSync('config/eay_master_roadmap_60.json','utf8'));
          const item=roadmap.items.find((row)=>row.id===27);
          if (!item || item.title !== 'Planogram 2D/3D experience') throw new Error('Roadmap 27 authority drifted');
          if (item.external_status !== 'REQUIRED') throw new Error('Roadmap 27 external truth boundary drifted');
          console.log('MASTER_27_AUTHORITY=PASS');
          console.log('MASTER_27_EXTERNAL_EVIDENCE=REQUIRED');
          NODE
      - name: Anonymous basket Studio evidence boundary
        run: node scripts/test-planogram-candidate-baskets.mjs
      - name: Governed candidate asset manifest boundary
        run: node scripts/test-planogram-candidate-bundle.mjs
      - name: Governed visual quality planning boundary
        run: node scripts/test-planogram-visual-quality-model.mjs
      - name: Store Scan measured capture review boundary
        run: node scripts/test-planogram-store-scan-ui.mjs
      - name: Fingerprint-bound visual Store Scan annotation
        run: node scripts/test-planogram-scan-annotation.mjs
      - name: Reviewed Store Scan 3D Digital Twin
        run: node scripts/test-planogram-scanned-twin.mjs
      - name: Scanned fixture catalog binding boundary
        run: node scripts/test-planogram-fixture-binding.mjs
      - name: Scanned V6 end-to-end Studio chain
        run: node scripts/test-planogram-scanned-optimizer-v6.mjs
      - name: Picker Eye same-origin asset fidelity boundary
        run: node scripts/test-planogram-picker-eye-assets.mjs
      - name: Architectural authoring and immersive walk-through contract
        run: node scripts/test-planogram-authoring.mjs
      - name: CFO economics UI authority and provenance boundary
        run: node scripts/test-planogram-economics-ui.mjs
      - name: V5 Pareto decision portfolio boundary
        run: node scripts/test-planogram-scenario-portfolio.mjs
      - name: Digital twin truth and market-quality renderer contract
        run: node scripts/test-planogram-digital-twin.mjs
      - name: Engineering 2D arbitrary-angle and scale contract
        run: node scripts/test-planogram-engineering-2d.mjs
      - name: Route explainability backend-to-twin contract
        run: node scripts/test-planogram-route-explainability.mjs
      - name: Preserve canonical Planogram product-state boundary
        run: node scripts/test-planogram-product-states.mjs
      - name: Production build with dynamic 3D runtime
        run: npm run build -- --manifest
      - name: Prove Three.js is code-split away from the main entry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('dist/.vite/manifest.json','utf8'));
          const entries=Object.entries(manifest);
          const main=manifest['index.html'] ?? entries.map(([,row])=>row).find((row)=>row.isEntry === true);
          if (!main?.file) throw new Error('Vite application entry missing');
          const mainText=fs.readFileSync(`dist/${main.file}`,'utf8');
          if (mainText.includes('WebGLRenderer') || mainText.includes('OrbitControls')) throw new Error('Three.js leaked into the eager main entry');
          const dynamicThree=entries.filter(([key,row]) => {
            const identity=`${key} ${row.src ?? ''} ${row.name ?? ''} ${row.file ?? ''}`;
            return row.isDynamicEntry === true && /three\.module|OrbitControls|PointerLockControls|RoomEnvironment|GLTFLoader|node_modules\/three\//i.test(identity);
          });
          if (!dynamicThree.length) throw new Error('No dynamic Three.js manifest entry found');
          for (const [,row] of dynamicThree) {
            if (!row.file || row.file === main.file) throw new Error('Three.js dynamic entry collapsed into eager main entry');
          }
          console.log(`MASTER_27_MAIN_ENTRY=${main.file}`);
          console.log(`MASTER_27_DYNAMIC_THREE_ENTRIES=${dynamicThree.map(([,row])=>row.file).join(',')}`);
          console.log('MASTER_27_DYNAMIC_THREE_BOUNDARY=PASS');
          NODE
      - name: Preserve accessibility and localization product gate
        run: npm run test:inclusion
      - name: Truth boundary
        run: |
          echo 'MASTER_27_REPOSITORY_RENDERER=IMPLEMENTED'
          echo 'MASTER_27_STORE_SCAN_REVIEW=IMPLEMENTED'
          echo 'MASTER_27_STORE_SCAN_RAW_MEDIA_PERSISTED=FALSE'
          echo 'MASTER_27_STORE_SCAN_AUTO_STORE_DNA_PROMOTION=FALSE'
          echo 'MASTER_27_STORE_SCAN_VISUAL_ANNOTATION=IMPLEMENTED'
          echo 'MASTER_27_STORE_SCAN_ANNOTATION_KEYBOARD_ACCESSIBLE=TRUE'
          echo 'MASTER_27_STORE_SCAN_REVIEWED_DRAFT_AUTHORITY=FALSE'
          echo 'MASTER_27_SCAN_TO_EDITABLE_MODEL=IMPLEMENTED'
          echo 'MASTER_27_ARCHITECTURAL_AUTHORING=IMPLEMENTED'
          echo 'MASTER_27_AUTHORING_STORE_DNA_AUTHORITY=FALSE'
          echo 'MASTER_27_SCANNED_DIGITAL_TWIN=IMPLEMENTED'
          echo 'MASTER_27_SCANNED_TWIN_FIELD_ACCURACY=REQUIRED'
          echo 'MASTER_27_SCANNED_FIXTURE_CATALOG_BINDING=IMPLEMENTED'
          echo 'MASTER_27_SCANNED_FIXTURE_LAYOUT_AUTHORITY=FALSE'
          echo 'MASTER_27_SCANNED_V6_OPTIMIZER=IMPLEMENTED'
          echo 'MASTER_27_SCANNED_V6_CLIENT_LAYOUT_AUTHORITY=FALSE'
          echo 'MASTER_27_SCANNED_V6_STORE_DNA_AUTHORITY=FALSE'
          echo 'MASTER_27_SCANNED_V6_GLOBAL_OPTIMUM_CLAIM=FALSE'
          echo 'MASTER_27_SCANNED_V6_FIELD_EVIDENCE=FALSE'
          echo 'MASTER_27_PICKER_EYE_ASSET_PREVIEW=IMPLEMENTED'
          echo 'MASTER_27_GOVERNED_VISUAL_ASSET_MANIFEST=IMPLEMENTED'
          echo 'MASTER_27_GOVERNED_VISUAL_QUALITY_PLAN=IMPLEMENTED'
          echo 'MASTER_27_HIGH_FIDELITY_RENDERER_ASSET_BINDING=NOT_YET_CLAIMED'
          echo 'MASTER_27_PBR_WALKTHROUGH=IMPLEMENTED'
          echo 'MASTER_27_REMOTE_PREVIEW_ASSET_URLS=BLOCKED'
          echo 'MASTER_27_ANONYMOUS_BASKET_UI_BOUNDARY=IMPLEMENTED'
          echo 'MASTER_27_CFO_ECONOMICS_UI=IMPLEMENTED'
          echo 'MASTER_27_CFO_ECONOMICS_REALIZED_SAVINGS=FALSE'
          echo 'MASTER_27_V5_OPERATIONAL_PARETO_PORTFOLIO=IMPLEMENTED'
          echo 'MASTER_27_V5_GLOBAL_OPTIMUM_CLAIM=FALSE'
          echo 'MASTER_27_V5_PORTFOLIO_CAPEX_COMPARED=FALSE'
          echo 'MASTER_27_ARBITRARY_ANGLE_2D_GEOMETRY=IMPLEMENTED'
          echo 'MASTER_27_ENGINEERING_DIMENSION_SCALE_LAYER=IMPLEMENTED'
          echo 'MASTER_27_FACING_AWARE_OPEN_FIXTURE_RENDERER=IMPLEMENTED'
          echo 'MASTER_27_ROUTE_EXPLAINABILITY=IMPLEMENTED'
          echo 'MASTER_27_MEASURED_STORE_CAD_FIELD_UAT=REQUIRED'
          echo 'MASTER_27_REAL_PRODUCT_ASSET_FIDELITY=FIELD_ASSETS_REQUIRED'
          echo 'MASTER_27_FULL_CAD_BIM_KERNEL=NOT_CLAIMED'
          echo 'MASTER_27_RAW_POINT_CLOUD_SLAM=NOT_CLAIMED'
          echo 'MASTER_27_PRODUCTION_READY=FALSE'