name: EAY Master Roadmap 28 - Budget Planning Engine

on:
  push:
    branches: [agent/master-roadmap-28-budget-planning-engine, product/eay-category-leadership-v1]
  pull_request:
    branches: [product/eay-category-leadership-v1]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: eay-master-28-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget-planning-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: opex_migrator
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: opex_test, POSTGRES_USER: opex_migrator, POSTGRES_PASSWORD: opex_migrator}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.12", cache: pip}
      - name: Install Core test shape
        working-directory: services/core-api
        run: python -m pip install -e ".[dev,bigquery]"
      - name: Create runtime role
        run: |
          python - <<'PY'
          import asyncio,asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  if not await c.fetchval("SELECT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')"):
                      await c.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOBYPASSRLS")
              finally: await c.close()
          asyncio.run(main())
          PY
      - name: Lint and unit contracts
        run: |
          ruff check --ignore E501 services/core-api/app/modules/budget/planning_engine.py services/core-api/app/modules/budget/planning_engine_routes.py services/core-api/app/modules/budget/planning_engine_schemas.py services/core-api/tests/test_budget_master28_planning.py
          pytest -q services/core-api/tests/test_budget_domain.py services/core-api/tests/test_budget_master28_planning.py
      - name: Apply cumulative migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Assert planning truth schema
        run: |
          python - <<'PY'
          import asyncio,asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  assert await c.fetchval('SELECT version_num FROM alembic_version') == '0037_budget_planning_authority'
                  for t in ('budget_plan_snapshot','budget_scenario','budget_scenario_assumption','budget_scenario_line','budget_allocation_rule'):
                      r=await c.fetchrow('SELECT relrowsecurity,relforcerowsecurity FROM pg_class WHERE relname=$1',t)
                      assert r and r['relrowsecurity'] and r['relforcerowsecurity'],t
                  assert await c.fetchval("SELECT EXISTS(SELECT 1 FROM pg_constraint WHERE conname='fk_budget_forecast_exact_scope')")
              finally: await c.close()
          asyncio.run(main())
          PY
      - name: Budget route contract
        working-directory: services/core-api
        run: python -c "from app.budget_main import app; assert '/v1/budget/planning/scenarios' in app.openapi()['paths']"
