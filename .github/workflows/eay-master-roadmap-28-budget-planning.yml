name: EAY Master Roadmap 28 - Budget Planning Engine

on:
  push:
    branches:
      - agent/master-roadmap-28-budget-planning
  pull_request:
    branches:
      - product/eay-category-leadership-v1

permissions:
  contents: read

concurrency:
  group: eay-master-roadmap-28-budget-planning-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EAY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prior-27-exact-head:
    name: Re-prove Master 27 on the exact Budget head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EAY_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$EAY_EXACT_HEAD"
      - uses: actions/setup-node@1e60f620b9541d00f47ce3d3e2e1ed8bd9d1df6c
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Master 27 authority
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const roadmap=JSON.parse(fs.readFileSync('config/eay_master_roadmap_60.json','utf8'));
          const item=roadmap.items.find((row)=>row.id===27);
          if (!item || item.title !== 'Planogram 2D/3D experience') throw new Error('Master 27 authority drifted');
          if (item.external_status !== 'REQUIRED') throw new Error('Master 27 external boundary drifted');
          NODE
      - name: Re-run Master 27 deep acceptance
        run: |
          node scripts/test-planogram-digital-twin.mjs
          node scripts/test-planogram-route-explainability.mjs
          node scripts/test-planogram-product-states.mjs
          npm run build -- --manifest
          npm run test:inclusion
      - name: Preserve Master 27 production truth boundary
        run: |
          echo 'MASTER_27_REPOSITORY_RENDERER=REPROVED'
          echo 'MASTER_27_MEASURED_STORE_CAD_FIELD_UAT=REQUIRED'
          echo 'MASTER_27_PRODUCTION_READY=FALSE'

  budget-planning-authority:
    name: Master 28 immutable planning authority and exact scope
    needs: prior-27-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: opex_migrator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EAY_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$EAY_EXACT_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Create canonical non-bypass runtime role before grants migrate
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c=await asyncpg.connect('postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test')
              try:
                  exists=await c.fetchval("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opex_runtime')")
                  if not exists:
                      await c.execute("CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
              finally:
                  await c.close()
          asyncio.run(main())
          PY
      - name: Lint and unit-test Budget + reviewed SQL boundary
        run: |
          ruff check --ignore E501 \
            services/core-api/app/modules/budget/planning.py \
            services/core-api/app/modules/budget/read_models.py \
            services/core-api/app/modules/budget/routes.py \
            services/core-api/tests/test_budget_master28_planning.py \
            services/core-api/tests/test_sql_access_boundary.py \
            services/core-api/alembic/versions/0037_budget_planning_authority.py \
            services/core-api/alembic/versions/0038_budget_planning_scope_boundary.py
          pytest -q \
            services/core-api/tests/test_budget_domain.py \
            services/core-api/tests/test_budget_master28_planning.py \
            services/core-api/tests/test_sql_access_boundary.py
      - name: Upgrade through prior cumulative head
        working-directory: services/core-api
        run: alembic upgrade 0036_planogram_product_roles
      - name: Seed legacy ACTIVE finance truth before Master 28 migrations
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants(id,slug,display_name) VALUES
            ('11111111-1111-1111-1111-111111111111','budget-a','Budget A'),
            ('22222222-2222-2222-2222-222222222222','budget-b','Budget B');
          INSERT INTO budget_plan(
            id,tenant_id,name,fiscal_year,base_currency,status,created_by,activated_by,activated_at
          ) VALUES (
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa0',
            '11111111-1111-1111-1111-111111111111',
            'Legacy FY26',2026,'TRY','ACTIVE','legacy-maker','legacy-checker','2026-08-17T20:00:00Z'
          );
          INSERT INTO fiscal_period(id,tenant_id,plan_id,code,starts_on,ends_on) VALUES (
            'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb00',
            '11111111-1111-1111-1111-111111111111',
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa0',
            '2026-08','2026-08-01','2026-08-31'
          );
          INSERT INTO cost_center(id,tenant_id,code,name,store_code,created_by) VALUES (
            'cccccccc-cccc-cccc-cccc-cccccccccc01',
            '11111111-1111-1111-1111-111111111111',
            'FULYA','Fulya','FULYA','finance-admin'
          );
          INSERT INTO budget_line(
            id,tenant_id,plan_id,fiscal_period_id,cost_center_id,category,budget_base_amount,created_by
          ) VALUES (
            'dddddddd-dddd-dddd-dddd-dddddddddd00',
            '11111111-1111-1111-1111-111111111111',
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa0',
            'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb00',
            'cccccccc-cccc-cccc-cccc-cccccccccc01',
            'OPEX',1000.00,'finance-admin'
          );
          SQL
      - name: Apply Master 28 migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Prove exact head and legacy ACTIVE snapshot backfill
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE head text; fp text; snapshot jsonb; recomputed text;
          BEGIN
            SELECT version_num INTO head FROM alembic_version;
            IF head <> '0038_budget_planning_scope_boundary' THEN
              RAISE EXCEPTION 'Unexpected Alembic head: %', head;
            END IF;
            SELECT planning_fingerprint,planning_snapshot INTO fp,snapshot
            FROM budget_plan WHERE id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa0';
            IF snapshot IS NULL OR fp IS NULL THEN
              RAISE EXCEPTION 'Legacy ACTIVE plan was not backfilled';
            END IF;
            IF jsonb_array_length(snapshot->'periods') <> 1 OR jsonb_array_length(snapshot->'lines') <> 1 THEN
              RAISE EXCEPTION 'Legacy snapshot shape is incomplete';
            END IF;
            recomputed := encode(digest(convert_to(snapshot::text,'UTF8'),'sha256'),'hex');
            IF fp <> recomputed THEN RAISE EXCEPTION 'Legacy snapshot fingerprint mismatch'; END IF;
          END $$;
          SQL
      - name: Seed governed draft planning truth and activate exact snapshot
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO budget_plan(id,tenant_id,name,fiscal_year,base_currency,created_by) VALUES
            ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1','11111111-1111-1111-1111-111111111111','FY27',2027,'TRY','maker'),
            ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa2','11111111-1111-1111-1111-111111111111','Draft A',2028,'TRY','maker'),
            ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa3','11111111-1111-1111-1111-111111111111','Draft B',2029,'TRY','maker');
          INSERT INTO cost_center(id,tenant_id,code,name,store_code,created_by) VALUES (
            'cccccccc-cccc-cccc-cccc-cccccccccc02',
            '11111111-1111-1111-1111-111111111111',
            'USKUDAR','Uskudar','USKUDAR','finance-admin'
          );
          INSERT INTO fiscal_period(id,tenant_id,plan_id,code,starts_on,ends_on) VALUES
            ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb11','11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1','2027-01','2027-01-01','2027-01-31'),
            ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb12','11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1','2027-02','2027-02-01','2027-02-28'),
            ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb21','11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa2','2028-01','2028-01-01','2028-01-31'),
            ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb31','11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa3','2029-01','2029-01-01','2029-01-31');
          INSERT INTO budget_line(
            id,tenant_id,plan_id,fiscal_period_id,cost_center_id,category,supplier_id,supplier_name,
            store_code,budget_base_amount,created_by
          ) VALUES (
            'dddddddd-dddd-dddd-dddd-dddddddddd11',
            '11111111-1111-1111-1111-111111111111',
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1',
            'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb11',
            'cccccccc-cccc-cccc-cccc-cccccccccc01',
            'Packaging','SUP-1','Supplier One','FULYA',2500.00,'maker'
          );
          UPDATE budget_plan SET status='ACTIVE',activated_by='checker',activated_at='2026-08-18T00:30:00Z'
          WHERE id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1';
          DO $$
          DECLARE snapshot jsonb; fp text; recomputed text;
          BEGIN
            SELECT planning_snapshot,planning_fingerprint INTO snapshot,fp
            FROM budget_plan WHERE id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1';
            IF jsonb_array_length(snapshot->'periods') <> 2 THEN RAISE EXCEPTION 'Snapshot period loss'; END IF;
            IF jsonb_array_length(snapshot->'lines') <> 1 THEN RAISE EXCEPTION 'Snapshot line loss'; END IF;
            IF snapshot#>>'{plan,base_currency}' <> 'TRY' THEN RAISE EXCEPTION 'Snapshot plan identity loss'; END IF;
            IF snapshot#>>'{lines,0,cost_center_code}' <> 'FULYA' THEN RAISE EXCEPTION 'Snapshot center identity loss'; END IF;
            recomputed := encode(digest(convert_to(snapshot::text,'UTF8'),'sha256'),'hex');
            IF fp <> recomputed THEN RAISE EXCEPTION 'Activation fingerprint mismatch'; END IF;
          END $$;
          SQL
      - name: Prove ACTIVE truth immutability and exact composite scope
        run: |
          if psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "UPDATE budget_plan SET planning_snapshot='{}'::jsonb WHERE id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1'"; then
            echo 'ACTIVE snapshot tamper was accepted'; exit 1; fi
          if psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "UPDATE budget_line SET budget_base_amount=9999 WHERE id='dddddddd-dddd-dddd-dddd-dddddddddd11'"; then
            echo 'ACTIVE Budget Line mutation was accepted'; exit 1; fi
          if psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "UPDATE fiscal_period SET starts_on='2027-01-02' WHERE id='bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb11'"; then
            echo 'ACTIVE Fiscal Period structure mutation was accepted'; exit 1; fi
          if psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "INSERT INTO budget_line(tenant_id,plan_id,fiscal_period_id,cost_center_id,category,budget_base_amount,created_by) VALUES ('11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa2','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb31','cccccccc-cccc-cccc-cccc-cccccccccc01','Invalid cross-plan period',10,'maker')"; then
            echo 'Cross-plan Fiscal Period was accepted'; exit 1; fi
          if psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "INSERT INTO forecast(tenant_id,budget_line_id,fiscal_period_id,cost_center_id,forecast_base_amount,as_of,created_by) VALUES ('11111111-1111-1111-1111-111111111111','dddddddd-dddd-dddd-dddd-dddddddddd11','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb12','cccccccc-cccc-cccc-cccc-cccccccccc02',2600,'2026-08-18','forecaster')"; then
            echo 'Mismatched forecast scope was accepted'; exit 1; fi
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "INSERT INTO forecast(tenant_id,budget_line_id,fiscal_period_id,cost_center_id,forecast_base_amount,as_of,created_by) VALUES ('11111111-1111-1111-1111-111111111111','dddddddd-dddd-dddd-dddd-dddddddddd11','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb11','cccccccc-cccc-cccc-cccc-cccccccccc01',2450,'2026-08-18','forecaster')"
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 -c "UPDATE fiscal_period SET status='CLOSED',closed_by='closer',closed_at='2026-08-18T00:40:00Z' WHERE id='bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb11'"
      - name: Prove runtime partial scope cannot mutate planning structure
        env:
          PGPASSWORD: opex_runtime
        run: |
          if psql -h localhost -U opex_runtime -d opex_test -v ON_ERROR_STOP=1 -c "SET app.tenant_id='11111111-1111-1111-1111-111111111111'; SET app.budget_cost_center_ids='cccccccc-cccc-cccc-cccc-cccccccccc01'; INSERT INTO budget_plan(id,tenant_id,name,fiscal_year,base_currency,created_by) VALUES ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaa99','11111111-1111-1111-1111-111111111111','Partial Scope',2030,'TRY','partial')"; then
            echo 'Partial-scope runtime created Budget Plan'; exit 1; fi
          if psql -h localhost -U opex_runtime -d opex_test -v ON_ERROR_STOP=1 -c "SET app.tenant_id='11111111-1111-1111-1111-111111111111'; SET app.budget_cost_center_ids='cccccccc-cccc-cccc-cccc-cccccccccc01'; UPDATE fiscal_period SET code='PARTIAL' WHERE id='bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb21'"; then
            echo 'Partial-scope runtime mutated Fiscal Period'; exit 1; fi
          if psql -h localhost -U opex_runtime -d opex_test -v ON_ERROR_STOP=1 -c "SET app.tenant_id='11111111-1111-1111-1111-111111111111'; SET app.budget_cost_center_ids='cccccccc-cccc-cccc-cccc-cccccccccc01'; INSERT INTO budget_line(tenant_id,plan_id,fiscal_period_id,cost_center_id,category,budget_base_amount,created_by) VALUES ('11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa2','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb21','cccccccc-cccc-cccc-cccc-cccccccccc01','Partial Scope',10,'partial')"; then
            echo 'Partial-scope runtime created Budget Line'; exit 1; fi
      - name: Prove tenant RLS and all-cost-center snapshot route boundary
        run: |
          PGPASSWORD=opex_runtime psql -h localhost -U opex_runtime -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          SET app.tenant_id='11111111-1111-1111-1111-111111111111';
          SET app.budget_cost_center_ids='__all__';
          SELECT 1/CASE WHEN COUNT(*)=4 THEN 1 ELSE 0 END FROM budget_plan;
          SELECT 1/CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END FROM budget_plan
          WHERE id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1' AND planning_snapshot IS NOT NULL;
          SET app.tenant_id='22222222-2222-2222-2222-222222222222';
          SET app.budget_cost_center_ids='__all__';
          SELECT 1/CASE WHEN COUNT(*)=0 THEN 1 ELSE 0 END FROM budget_plan;
          SQL
          python - <<'PY'
          from app.budget_main import app
          paths=app.openapi()['paths']
          assert '/v1/budget/plans/{plan_id}/snapshot' in paths
          source=open('services/core-api/app/modules/budget/routes.py', encoding='utf-8').read()
          assert 'PlanSnapshotSession' in source and 'all_cost_centers=True' in source
          print('MASTER_28_SNAPSHOT_ROUTE_SCOPE=PASS')
          PY
      - name: Validate Master 28 authority and truth boundary
        run: |
          python scripts/validate_master_roadmap_60.py
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap=json.loads(Path('config/eay_master_roadmap_60.json').read_text())
          item=next(row for row in roadmap['items'] if row['id']==28)
          assert item['title']=='Budget Intelligence planning engine'
          assert item['external_status']=='REQUIRED'
          print('MASTER_28_REPOSITORY_PLANNING_AUTHORITY=PASS')
          print('MASTER_28_REAL_FINANCE_DATA_UAT=REQUIRED')
          print('MASTER_28_PRODUCTION_READY=FALSE')
          PY
