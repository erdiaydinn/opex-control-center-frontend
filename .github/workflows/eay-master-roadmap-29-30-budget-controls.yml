name: EAY Master Roadmap 29-30 - Budget AI and Finance Controls
on:
  push:
    branches: [agent/master-roadmap-28-budget-planning-engine]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  budget-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - run: ruff check --ignore E501 services/core-api/app/modules/budget/intelligence.py services/core-api/tests/test_budget_master29_30_controls.py
      - run: pytest -q services/core-api/tests/test_budget_master29_30_controls.py services/core-api/tests/test_budget_domain.py
      - run: python -m py_compile services/core-api/alembic/versions/0038_budget_ai_recommendation_authority.py services/core-api/alembic/versions/0039_budget_finance_controls.py
