name: EAY Master Roadmap 32-33 - Academy Tutor and Media Plane

on:
  push:
    branches:
      - agent/master-roadmap-31-33-academy-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches: [product/eay-category-leadership-v1]
    paths:
      - 'services/core-api/app/modules/academy/tutor.py'
      - 'services/core-api/app/modules/academy/media_plane.py'
      - 'services/core-api/tests/test_academy_master32_33.py'
      - '.github/workflows/eay-master-roadmap-32-33-academy-tutor-media.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eay-master-32-33-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-tutor-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Create non-superuser runtime role
        env:
          PGPASSWORD: opex_migrator
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime') THEN
              CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE;
            END IF;
          END
          $$;
          SQL
      - name: Strict Ruff and compile gate
        run: |
          ruff check \
            services/core-api/app/modules/academy/learning_os.py \
            services/core-api/app/modules/academy/tutor.py \
            services/core-api/app/modules/academy/media_plane.py \
            services/core-api/tests/test_academy_master31_learning_os.py \
            services/core-api/tests/test_academy_master32_33.py
          python -m py_compile \
            services/core-api/app/modules/academy/learning_os.py \
            services/core-api/app/modules/academy/tutor.py \
            services/core-api/app/modules/academy/media_plane.py
      - name: Apply cumulative Academy database authority
        working-directory: services/core-api
        run: |
          alembic heads | tee /tmp/academy-heads.txt
          test "$(grep -c '(head)' /tmp/academy-heads.txt)" -eq 1
          test -n "$(awk '/\(head\)/ {print $1}' /tmp/academy-heads.txt)"
          alembic history | tee /tmp/academy-history.txt
          grep -q '0043_shared_platform_delivery_search' /tmp/academy-history.txt
          grep -q '0041_academy_learning_os' /tmp/academy-history.txt
          alembic upgrade head
          alembic current | tee /tmp/academy-current.txt
          grep -q '(head)' /tmp/academy-current.txt
      - name: Run Tutor, media and current Academy regression contracts
        run: |
          pytest -q \
            services/core-api/tests/test_academy_master31_learning_os.py \
            services/core-api/tests/test_academy_master32_33.py \
            services/core-api/tests/test_academy_contracts.py \
            services/core-api/tests/test_academy_integration.py \
            services/core-api/tests/test_academy_media_tenant_isolation.py
      - name: Prove production media truth remains external
        run: |
          python - <<'PY'
          from app.modules.academy.media_plane import (
              MediaLoadEvidence,
              production_media_capacity_accepted,
          )

          assert not production_media_capacity_accepted(
              MediaLoadEvidence(1200, 'ci', 'SYNTHETIC', True, 'synthetic')
          )
          assert not production_media_capacity_accepted(
              MediaLoadEvidence(2000, 'staging', 'REAL_MEDIA_ENVIRONMENT', False, 'unmeasured')
          )
          PY
      - name: Publish Master 32-33 canonical exact-head status
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/product/eay-category-leadership-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Master 32-33 Academy canonical exact-head acceptance failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Master 32-33 Academy canonical exact-head acceptance passed'
          fi
          payload=$(printf '{"state":"%s","context":"EAY Master 32-33 Academy Exact-Head","description":"%s"}' "$state" "$description")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
