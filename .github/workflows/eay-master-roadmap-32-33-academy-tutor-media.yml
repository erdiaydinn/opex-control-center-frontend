name: EAY Master Roadmap 32-33 - Academy Tutor and Media Plane

on:
  push:
    branches: [agent/master-roadmap-31-33-academy-compose-v2]
  pull_request:
    branches: [product/eay-category-leadership-v1]
    paths:
      - 'services/core-api/app/modules/academy/tutor.py'
      - 'services/core-api/app/modules/academy/media_plane.py'
      - 'services/core-api/tests/test_academy_master32_33.py'
      - '.github/workflows/eay-master-roadmap-32-33-academy-tutor-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-master-32-33-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-tutor-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff and compile gate
        run: |
          ruff check \
            services/core-api/app/modules/academy/learning_os.py \
            services/core-api/app/modules/academy/tutor.py \
            services/core-api/app/modules/academy/media_plane.py \
            services/core-api/tests/test_academy_master31_learning_os.py \
            services/core-api/tests/test_academy_master32_33.py
          python -m py_compile \
            services/core-api/app/modules/academy/learning_os.py \
            services/core-api/app/modules/academy/tutor.py \
            services/core-api/app/modules/academy/media_plane.py
      - name: Run Tutor, media and current Academy regression contracts
        run: |
          pytest -q \
            services/core-api/tests/test_academy_master31_learning_os.py \
            services/core-api/tests/test_academy_master32_33.py \
            services/core-api/tests/test_academy_contracts.py \
            services/core-api/tests/test_academy_integration.py \
            services/core-api/tests/test_academy_media_tenant_isolation.py
      - name: Prove production media truth remains external
        run: |
          python - <<'PY'
          from app.modules.academy.media_plane import (
              MediaLoadEvidence,
              production_media_capacity_accepted,
          )

          assert not production_media_capacity_accepted(
              MediaLoadEvidence(1200, 'ci', 'SYNTHETIC', True, 'synthetic')
          )
          assert not production_media_capacity_accepted(
              MediaLoadEvidence(2000, 'staging', 'REAL_MEDIA_ENVIRONMENT', False, 'unmeasured')
          )
          PY
