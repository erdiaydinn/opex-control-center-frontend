name: EAY Master Roadmap 32-33 - Academy Tutor and Media Plane
on:
  push:
    branches: [agent/master-roadmap-31-33-academy-learning-os]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  academy-tutor-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - run: ruff check --ignore E501 services/core-api/app/modules/academy/learning_os.py services/core-api/app/modules/academy/tutor.py services/core-api/app/modules/academy/media_plane.py services/core-api/tests/test_academy_master31_learning_os.py services/core-api/tests/test_academy_master32_33.py
      - run: pytest -q services/core-api/tests/test_academy_master31_learning_os.py services/core-api/tests/test_academy_master32_33.py services/core-api/tests/test_academy_rag.py services/core-api/tests/test_academy_media.py
      - name: Media production truth boundary
        run: |
          python - <<'PY'
          from app.modules.academy.media_plane import MediaLoadEvidence,production_media_capacity_accepted
          assert not production_media_capacity_accepted(MediaLoadEvidence(1200,'ci','SYNTHETIC',True,'synthetic'))
          PY
