name: EAY Master Roadmap 34 - Jarvis Operational Tool Authority

on:
  push:
    branches:
      - agent/master-roadmap-34-38-jarvis-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches: [product/eay-category-leadership-v1]
    paths:
      - 'services/core-api/app/core/operational_tool_authority.py'
      - 'services/core-api/tests/test_master34_operational_tool_authority.py'
      - '.github/workflows/eay-master-roadmap-34-jarvis-tool-authority.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eay-master-34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API authority test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff and compile gate
        run: |
          ruff check \
            services/core-api/app/core/operational_tool_authority.py \
            services/core-api/tests/test_master34_operational_tool_authority.py
          python -m py_compile \
            services/core-api/app/core/operational_tool_authority.py \
            services/core-api/tests/test_master34_operational_tool_authority.py
      - name: Preserve canonical AI authorization and Master 34 contracts
        run: |
          pytest -q \
            services/core-api/tests/test_ai_tool_authorization.py \
            services/core-api/tests/test_master34_operational_tool_authority.py
      - name: Prove operational tools are read-only and scope cannot self-expand
        run: |
          python - <<'PY'
          from app.core.operational_tool_authority import OPERATIONAL_TOOL_REGISTRY

          assert len(OPERATIONAL_TOOL_REGISTRY) == 9
          assert all(spec.risk == 'read_only' for spec in OPERATIONAL_TOOL_REGISTRY.values())
          PY
      - name: Publish Master 34 canonical exact-head status
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/product/eay-category-leadership-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Master 34 Jarvis canonical exact-head acceptance failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Master 34 Jarvis canonical exact-head acceptance passed'
          fi
          payload=$(printf '{"state":"%s","context":"EAY Master 34 Jarvis Exact-Head","description":"%s"}' "$state" "$description")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
