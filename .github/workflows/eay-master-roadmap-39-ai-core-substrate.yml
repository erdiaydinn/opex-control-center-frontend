name: EAY Master Roadmap 39 - AI Core Shared Substrate
on:
  push:
    branches: [agent/master-roadmap-39-40-ai-repository-intelligence]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  substrate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: services/core-api
        run: python -m pip install pytest
      - run: pytest -q services/core-api/tests/test_master39_ai_core_substrate.py services/core-api/tests/test_master40_repository_registry.py
      - name: Frozen baseline truth
        run: |
          python - <<'PY'
          import json
          d=json.load(open('docs/governance/eay_ai_core_shared_substrate.json'))
          assert d['frozen_baseline']=={'pull_request':15,'mutable':False}
          assert d['truth_boundaries']['synthetic_is_production_evidence'] is False
          PY
