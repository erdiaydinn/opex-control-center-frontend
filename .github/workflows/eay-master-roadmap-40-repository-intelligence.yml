name: EAY Master Roadmap 40 - Repository Intelligence Registry
on:
  push:
    branches: [agent/master-roadmap-39-40-ai-repository-intelligence]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: eay-master-40-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Validate registry without resolving unknown archives by guess
        working-directory: services/core-api
        run: |
          python -m pip install pytest
          pytest -q tests/test_master40_repository_registry.py
      - name: Frozen AI Core baseline remains untouched
        run: |
          test -f docs/governance/eay_repository_intelligence_registry.json
          python - <<'PY'
          import json
          d=json.load(open('docs/governance/eay_repository_intelligence_registry.json'))
          assert any(e['identity_status']=='UNRESOLVED' for e in d['entries'])
          PY
