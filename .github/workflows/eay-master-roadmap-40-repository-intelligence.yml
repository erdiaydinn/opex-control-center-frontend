name: EAY Master Roadmap 40 - Repository Intelligence Authority

on:
  push:
    branches:
      - agent/master-roadmap-39-40-ai-repository-compose-v3
      - product/eay-category-leadership-v1
  pull_request:
    branches: [product/eay-category-leadership-v1]
    paths:
      - 'docs/governance/eay_repository_intelligence_registry.json'
      - 'services/core-api/app/repository_intelligence/registry.py'
      - 'services/core-api/app/repository_intelligence/graph.py'
      - 'services/core-api/tests/test_master40_repository_registry.py'
      - 'services/core-api/tests/test_master40_repository_graph.py'
      - '.github/workflows/eay-master-roadmap-40-repository-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-master-40-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff, compile and JSON syntax gate
        run: |
          ruff check \
            services/core-api/app/repository_intelligence/registry.py \
            services/core-api/app/repository_intelligence/graph.py \
            services/core-api/tests/test_master40_repository_registry.py \
            services/core-api/tests/test_master40_repository_graph.py
          python -m py_compile \
            services/core-api/app/repository_intelligence/registry.py \
            services/core-api/app/repository_intelligence/graph.py \
            services/core-api/tests/test_master40_repository_registry.py \
            services/core-api/tests/test_master40_repository_graph.py
          python -m json.tool docs/governance/eay_repository_intelligence_registry.json >/dev/null
      - name: Prove registry and provenance graph contracts
        run: |
          pytest -q \
            services/core-api/tests/test_master40_repository_registry.py \
            services/core-api/tests/test_master40_repository_graph.py
      - name: Enforce unresolved and restrictive source boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.repository_intelligence.registry import load_registry

          entries = load_registry(Path('docs/governance/eay_repository_intelligence_registry.json'))
          unresolved = [entry for entry in entries if entry.identity_status == 'UNRESOLVED']
          assert unresolved
          assert all(entry.decision == 'PENDING' for entry in unresolved)
          assert all(entry.license_status == 'BLOCKED_UNRESOLVED' for entry in unresolved)
          assert all(not entry.analysis_permitted for entry in unresolved)
          assert all(not entry.usable_as_code_source for entry in unresolved)
          for entry in entries:
              if entry.license_status == 'REFERENCE_ONLY_RESTRICTIVE':
                  assert entry.analysis_permitted
                  assert not entry.usable_as_code_source
                  assert entry.decision != 'ADOPT'
          by_id = {entry.registry_id: entry for entry in entries}
          assert by_id['discovered:superset'].repository == 'apache/superset'
          assert by_id['discovered:superset-tr'].canonical_upstream == 'apache/superset'
          PY
