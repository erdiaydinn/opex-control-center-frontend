name: EAY Master Roadmap 41 - Shared Platform Authority

on:
  push:
    branches:
      - agent/master-roadmap-41-44-shared-platform-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - agent/master-roadmap-39-40-ai-repository-compose-v3
      - product/eay-category-leadership-v1
    paths:
      - 'services/core-api/alembic/versions/0042_shared_platform_authorities.py'
      - 'services/core-api/alembic/versions/0043_shared_platform_delivery_search.py'
      - 'services/core-api/app/shared_platform/**'
      - 'services/core-api/tests/test_master41_44_shared_platform.py'
      - 'services/core-api/tests/test_master42_44_operational_platform.py'
      - 'services/core-api/tests/test_master42_notification_delivery.py'
      - '.github/workflows/eay-master-roadmap-41-shared-platform.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eay-master-41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-platform-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Create non-superuser runtime role
        env:
          PGPASSWORD: opex_migrator
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime') THEN
              CREATE ROLE opex_runtime LOGIN PASSWORD 'opex_runtime'
                NOSUPERUSER NOCREATEDB NOCREATEROLE;
            END IF;
          END
          $$;
          SQL
      - name: Strict Ruff and compile gate
        run: |
          ruff check \
            services/core-api/alembic/versions/0042_shared_platform_authorities.py \
            services/core-api/alembic/versions/0043_shared_platform_delivery_search.py \
            services/core-api/app/shared_platform/contracts.py \
            services/core-api/app/shared_platform/notification_delivery.py \
            services/core-api/app/shared_platform/search_integration.py \
            services/core-api/tests/test_master41_44_shared_platform.py \
            services/core-api/tests/test_master42_44_operational_platform.py \
            services/core-api/tests/test_master42_notification_delivery.py
          python -m py_compile \
            services/core-api/alembic/versions/0042_shared_platform_authorities.py \
            services/core-api/alembic/versions/0043_shared_platform_delivery_search.py \
            services/core-api/app/shared_platform/contracts.py \
            services/core-api/app/shared_platform/notification_delivery.py \
            services/core-api/app/shared_platform/search_integration.py
      - name: Enforce cumulative single Alembic head
        working-directory: services/core-api
        run: |
          alembic heads | tee /tmp/shared-heads.txt
          test "$(grep -c '(head)' /tmp/shared-heads.txt)" -eq 1
          test -n "$(awk '/\(head\)/ {print $1}' /tmp/shared-heads.txt)"
          alembic history | tee /tmp/shared-history.txt
          grep -q '0043_shared_platform_delivery_search' /tmp/shared-history.txt
          grep -q '0042_shared_platform_authorities' /tmp/shared-history.txt
          grep -q '0041_academy_learning_os' /tmp/shared-history.txt
      - name: Apply cumulative migrations
        working-directory: services/core-api
        run: |
          alembic upgrade head
          alembic current | tee /tmp/shared-current.txt
          grep -q '(head)' /tmp/shared-current.txt
      - name: Prove FORCE RLS, runtime grants and cross-tenant isolation
        env:
          PGPASSWORD: opex_migrator
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            protected_count integer;
          BEGIN
            SELECT count(*) INTO protected_count
            FROM pg_class
            WHERE relname IN (
              'audit_field_binding',
              'platform_notification_outbox',
              'operational_search_document',
              'integration_contract_version',
              'platform_notification_preference',
              'platform_notification_escalation_policy'
            )
            AND relrowsecurity
            AND relforcerowsecurity;
            IF protected_count <> 6 THEN
              RAISE EXCEPTION 'shared platform FORCE RLS incomplete: %', protected_count;
            END IF;
            IF has_table_privilege(
              'opex_runtime', 'platform_notification_outbox', 'DELETE'
            ) THEN
              RAISE EXCEPTION 'runtime notification delete privilege is forbidden';
            END IF;
          END
          $$;

          SET ROLE opex_runtime;
          SELECT set_config('app.tenant_id', '11111111-1111-4111-8111-111111111111', false);
          INSERT INTO platform_notification_outbox (
            tenant_id, module, event_key, recipient_subject, channel,
            payload, idempotency_key
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'academy', 'training_due', 'employee-1', 'IN_APP', '{}', 'intent-1'
          );
          SELECT set_config('app.tenant_id', '22222222-2222-4222-8222-222222222222', false);
          DO $$
          DECLARE visible_count integer;
          BEGIN
            SELECT count(*) INTO visible_count FROM platform_notification_outbox;
            IF visible_count <> 0 THEN
              RAISE EXCEPTION 'cross-tenant notification visibility detected';
            END IF;
          END
          $$;
          RESET ROLE;
          SQL
      - name: Prove independent integration approval
        env:
          PGPASSWORD: opex_migrator
        run: |
          psql -h localhost -U opex_migrator -d opex_test -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('app.tenant_id', '11111111-1111-4111-8111-111111111111', false);
          INSERT INTO integration_contract_version (
            tenant_id, connector_key, direction, version,
            schema_json, validation_policy, created_by
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'hr-roster', 'INBOUND', 1, '{}', '{}', 'creator'
          );
          DO $$
          BEGIN
            BEGIN
              UPDATE integration_contract_version
              SET status = 'APPROVED', approved_by = 'creator', approved_at = now()
              WHERE connector_key = 'hr-roster';
              RAISE EXCEPTION 'same-actor approval unexpectedly succeeded';
            EXCEPTION
              WHEN OTHERS THEN
                IF SQLERRM NOT LIKE '%independent integration contract approval required%' THEN
                  RAISE;
                END IF;
            END;
          END
          $$;
          UPDATE integration_contract_version
          SET status = 'APPROVED', approved_by = 'reviewer', approved_at = now()
          WHERE connector_key = 'hr-roster';
          SQL
      - name: Run shared platform contracts
        run: |
          pytest -q \
            services/core-api/tests/test_master41_44_shared_platform.py \
            services/core-api/tests/test_master42_44_operational_platform.py \
            services/core-api/tests/test_master42_notification_delivery.py
      - name: Publish Master 41 canonical exact-head status
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/product/eay-category-leadership-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Master 41 shared platform canonical exact-head acceptance failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Master 41 shared platform canonical exact-head acceptance passed'
          fi
          payload=$(printf '{"state":"%s","context":"EAY Master 41 Shared Platform Exact-Head","description":"%s"}' "$state" "$description")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
