name: EAY Master Roadmap 42-44 - Notification Search Integration

on:
  push:
    branches:
      - agent/master-roadmap-41-44-shared-platform-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - agent/master-roadmap-39-40-ai-repository-compose-v3
      - product/eay-category-leadership-v1
    paths:
      - 'services/core-api/app/shared_platform/contracts.py'
      - 'services/core-api/app/shared_platform/notification_delivery.py'
      - 'services/core-api/app/shared_platform/search_integration.py'
      - 'services/core-api/tests/test_master41_44_shared_platform.py'
      - 'services/core-api/tests/test_master42_44_operational_platform.py'
      - 'services/core-api/tests/test_master42_notification_delivery.py'
      - '.github/workflows/eay-master-roadmap-42-44-operational-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-master-42-44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict operational platform gate
        run: |
          ruff check \
            services/core-api/app/shared_platform/contracts.py \
            services/core-api/app/shared_platform/notification_delivery.py \
            services/core-api/app/shared_platform/search_integration.py \
            services/core-api/tests/test_master41_44_shared_platform.py \
            services/core-api/tests/test_master42_44_operational_platform.py \
            services/core-api/tests/test_master42_notification_delivery.py
          python -m py_compile \
            services/core-api/app/shared_platform/contracts.py \
            services/core-api/app/shared_platform/notification_delivery.py \
            services/core-api/app/shared_platform/search_integration.py
      - name: Run notification search and integration contracts
        run: |
          pytest -q \
            services/core-api/tests/test_master41_44_shared_platform.py \
            services/core-api/tests/test_master42_44_operational_platform.py \
            services/core-api/tests/test_master42_notification_delivery.py
      - name: Preserve platform authority boundaries
        run: |
          python - <<'PY'
          from app.shared_platform.contracts import validate_authority_boundary
          from app.shared_platform.notification_delivery import DeliveryPolicy

          assert validate_authority_boundary(tenant_from_session='tenant-a') == 'tenant-a'
          assert DeliveryPolicy().max_attempts <= 20
          try:
              validate_authority_boundary(
                  tenant_from_session='tenant-a', tenant_from_payload='tenant-b'
              )
          except ValueError:
              pass
          else:
              raise AssertionError('payload tenant authority unexpectedly accepted')
          PY
