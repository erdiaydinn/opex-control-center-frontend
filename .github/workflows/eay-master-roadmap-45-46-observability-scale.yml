name: EAY Master Roadmap 45-46 - Observability and Scale Profiles
on:
  push:
    branches: [agent/master-roadmap-45-48-sre-scale-resilience]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  observability-scale-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: services/core-api
        run: python -m pip install pytest
      - run: pytest -q services/core-api/tests/test_master45_46_observability_scale.py services/core-api/tests/test_master47_48_chaos_dr.py
