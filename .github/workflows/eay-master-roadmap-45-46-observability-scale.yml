name: EAY Master Roadmap 45-46 - Observability and Scale Authority

on:
  push:
    branches:
      - agent/master-roadmap-45-48-sre-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - agent/master-roadmap-41-44-shared-platform-compose-v2
      - product/eay-category-leadership-v1
    paths:
      - 'docs/governance/eay_observability_contract.json'
      - 'docs/governance/eay_production_shape_load_profiles.json'
      - 'docs/governance/eay_sre_service_registry.json'
      - 'services/core-api/app/sre/governance.py'
      - 'services/core-api/app/sre/observability.py'
      - 'services/core-api/tests/test_master45_46_observability_scale.py'
      - 'services/core-api/tests/test_master45_48_sre_governance.py'
      - '.github/workflows/eay-master-roadmap-45-46-observability-scale.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eay-master-45-46-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability-scale-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff compile and JSON gate
        run: |
          ruff check \
            services/core-api/app/sre/governance.py \
            services/core-api/app/sre/observability.py \
            services/core-api/tests/test_master45_46_observability_scale.py \
            services/core-api/tests/test_master45_48_sre_governance.py
          python -m py_compile \
            services/core-api/app/sre/governance.py \
            services/core-api/app/sre/observability.py \
            services/core-api/tests/test_master45_46_observability_scale.py \
            services/core-api/tests/test_master45_48_sre_governance.py
          python -m json.tool docs/governance/eay_observability_contract.json >/dev/null
          python -m json.tool docs/governance/eay_production_shape_load_profiles.json >/dev/null
          python -m json.tool docs/governance/eay_sre_service_registry.json >/dev/null
      - name: Run observability and production-shape contracts
        run: |
          pytest -q \
            services/core-api/tests/test_master45_46_observability_scale.py \
            services/core-api/tests/test_master45_48_sre_governance.py
      - name: Prove repository and synthetic load evidence stay non-production
        run: |
          python - <<'PY'
          from app.sre.governance import AcceptanceEvidence, external_gate_satisfied

          for evidence_class in ('REPOSITORY', 'SYNTHETIC'):
              evidence = AcceptanceEvidence(
                  key='production-shape',
                  evidence_class=evidence_class,
                  environment='ci',
                  measured=True,
                  provenance='ci:synthetic',
              )
              assert not external_gate_satisfied(evidence)
          PY
      - name: Publish Master 45-46 canonical exact-head status
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/product/eay-category-leadership-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Master 45-46 SRE canonical exact-head acceptance failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Master 45-46 SRE canonical exact-head acceptance passed'
          fi
          payload=$(printf '{"state":"%s","context":"EAY Master 45-46 SRE Exact-Head","description":"%s"}' "$state" "$description")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
