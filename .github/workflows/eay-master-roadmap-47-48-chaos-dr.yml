name: EAY Master Roadmap 47-48 - Chaos and DR Authority

on:
  push:
    branches:
      - agent/master-roadmap-45-48-sre-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - agent/master-roadmap-41-44-shared-platform-compose-v2
      - product/eay-category-leadership-v1
    paths:
      - 'docs/governance/eay_chaos_dr_acceptance.json'
      - 'docs/governance/eay_sre_service_registry.json'
      - 'services/core-api/app/sre/chaos_dr.py'
      - 'services/core-api/app/sre/governance.py'
      - 'services/core-api/tests/test_master45_48_sre_governance.py'
      - 'services/core-api/tests/test_master47_48_chaos_dr.py'
      - '.github/workflows/eay-master-roadmap-47-48-chaos-dr.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eay-master-47-48-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-dr-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff compile and JSON gate
        run: |
          ruff check \
            services/core-api/app/sre/chaos_dr.py \
            services/core-api/app/sre/governance.py \
            services/core-api/tests/test_master45_48_sre_governance.py \
            services/core-api/tests/test_master47_48_chaos_dr.py
          python -m py_compile \
            services/core-api/app/sre/chaos_dr.py \
            services/core-api/app/sre/governance.py \
            services/core-api/tests/test_master45_48_sre_governance.py \
            services/core-api/tests/test_master47_48_chaos_dr.py
          python -m json.tool docs/governance/eay_chaos_dr_acceptance.json >/dev/null
          python -m json.tool docs/governance/eay_sre_service_registry.json >/dev/null
      - name: Run chaos DR and external-evidence contracts
        run: |
          pytest -q \
            services/core-api/tests/test_master45_48_sre_governance.py \
            services/core-api/tests/test_master47_48_chaos_dr.py
      - name: Preserve external DR truth boundary
        run: |
          python - <<'PY'
          from app.sre.chaos_dr import DrResult, dr_result_accepted

          assert not dr_result_accepted(
              DrResult('ci', True, 0, 0, 'synthetic:restore')
          )
          assert not dr_result_accepted(
              DrResult('managed-staging', True, None, 180, 'restore:unmeasured')
          )
          PY
      - name: Publish Master 47-48 canonical exact-head status
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/product/eay-category-leadership-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Master 47-48 chaos DR canonical exact-head acceptance failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Master 47-48 chaos DR canonical exact-head acceptance passed'
          fi
          payload=$(printf '{"state":"%s","context":"EAY Master 47-48 Chaos DR Exact-Head","description":"%s"}' "$state" "$description")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
