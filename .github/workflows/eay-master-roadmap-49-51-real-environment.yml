name: EAY Master Roadmap 49-51 - Real Identity Device Data Contracts
on:
  push:
    branches: [agent/master-roadmap-49-55-real-acceptance]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-environment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: services/core-api
        run: python -m pip install pytest
      - run: pytest -q services/core-api/tests/test_master49_55_external_acceptance.py services/core-api/tests/test_master49_51_real_environment.py services/core-api/tests/test_master52_55_acceptance_matrix.py
