name: EAY Master Roadmap 49-51 - Real Environment Acceptance Authority

on:
  push:
    branches:
      - agent/master-roadmap-49-55-real-acceptance-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - agent/master-roadmap-45-48-sre-compose-v2
      - product/eay-category-leadership-v1
    paths:
      - 'services/core-api/app/acceptance/real_environment.py'
      - 'services/core-api/app/acceptance/external_evidence.py'
      - 'services/core-api/tests/test_master49_51_real_environment.py'
      - 'services/core-api/tests/test_master49_55_external_acceptance.py'
      - 'docs/governance/eay_external_acceptance_requirements.json'
      - '.github/workflows/eay-master-roadmap-49-51-real-environment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-master-49-51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-environment-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff compile and requirements gate
        run: |
          ruff check \
            services/core-api/app/acceptance/real_environment.py \
            services/core-api/app/acceptance/external_evidence.py \
            services/core-api/tests/test_master49_51_real_environment.py \
            services/core-api/tests/test_master49_55_external_acceptance.py
          python -m py_compile \
            services/core-api/app/acceptance/real_environment.py \
            services/core-api/app/acceptance/external_evidence.py
          python -m json.tool docs/governance/eay_external_acceptance_requirements.json >/dev/null
      - name: Run real identity device and data authority contracts
        run: |
          pytest -q \
            services/core-api/tests/test_master49_51_real_environment.py \
            services/core-api/tests/test_master49_55_external_acceptance.py
      - name: Prove CI cannot manufacture real acceptance
        run: |
          python - <<'PY'
          from app.acceptance.real_environment import (
              CorporateIdentityAcceptance,
              corporate_identity_accepted,
          )

          ci = CorporateIdentityAcceptance(
              environment_class='MANAGED_STAGING',
              issuer='ci', tenant='ci', employee_id_claim='employee_id',
              warehouse_scope_claim='warehouse_scope',
              stale_token_rejected=True, exit_revocation_passed=True,
              workload_identity_passed=True, service_account_passed=True,
              provenance='ci:fixture', approver='ci-bot',
          )
          assert not corporate_identity_accepted(ci)
          PY
