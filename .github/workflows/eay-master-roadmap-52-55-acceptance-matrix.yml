name: EAY Master Roadmap 52-55 - UAT Security Accessibility Matrix Authority

on:
  push:
    branches:
      - agent/master-roadmap-49-55-real-acceptance-compose-v2
      - product/eay-category-leadership-v1
  pull_request:
    branches:
      - agent/master-roadmap-45-48-sre-compose-v2
      - product/eay-category-leadership-v1
    paths:
      - 'services/core-api/app/acceptance/matrix.py'
      - 'services/core-api/tests/test_master52_55_acceptance_matrix.py'
      - 'docs/governance/eay_real_acceptance_matrix.json'
      - 'docs/governance/eay_external_acceptance_requirements.json'
      - '.github/workflows/eay-master-roadmap-52-55-acceptance-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-master-52-55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-matrix-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev,bigquery]'
      - name: Strict Ruff compile and JSON matrix gate
        run: |
          ruff check \
            services/core-api/app/acceptance/matrix.py \
            services/core-api/tests/test_master52_55_acceptance_matrix.py
          python -m py_compile \
            services/core-api/app/acceptance/matrix.py \
            services/core-api/tests/test_master52_55_acceptance_matrix.py
          python -m json.tool docs/governance/eay_real_acceptance_matrix.json >/dev/null
          python -m json.tool docs/governance/eay_external_acceptance_requirements.json >/dev/null
      - name: Run UAT penetration accessibility matrix contract
        run: pytest -q services/core-api/tests/test_master52_55_acceptance_matrix.py
      - name: Preserve external field-acceptance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          requirements = json.loads(
              Path('docs/governance/eay_external_acceptance_requirements.json').read_text()
          )['requirements']
          by_item = {item['item']: item for item in requirements}
          assert by_item[54]['required_class'] == 'REAL_STAGING'
          assert by_item[55]['required_class'] == 'REAL_BUILD_UAT'
          assert 'cross_tenant' in by_item[54]['evidence']
          assert 'screen_reader' in by_item[55]['evidence']
          assert 'arabic_rtl' in by_item[55]['evidence']
          PY
