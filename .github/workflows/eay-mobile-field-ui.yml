name: EAY Mobile Field UI Compatibility

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "android-field-ui/**"
      - "mobile-presentation-contracts/**"
      - "ops/mobile/verify-field-ui-foundation.sh"
      - "config/eay_localization.json"
      - ".github/workflows/eay-mobile-field-ui.yml"
  push:
    branches:
      - agent/eay-mobile-platform-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  field-ui-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify presentation and localization boundary
        run: sh ops/mobile/verify-field-ui-foundation.sh

  field-ui-compose-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-field-ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.4.1"
      - name: Compile, unit test and lint isolated Compose field UI
        run: gradle --no-daemon clean :field-ui:testDebugUnitTest :field-ui:lintDebug :field-ui:assembleDebug
