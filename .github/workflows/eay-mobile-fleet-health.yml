name: EAY Mobile Fleet Health

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "services/core-api/app/core/mobile_fleet_health.py"
      - "services/core-api/app/mobile_fleet_routes.py"
      - "services/core-api/app/main.py"
      - "services/core-api/tests/test_mobile_fleet_health.py"
      - "android-inventory/mobile-core/src/main/java/com/eay/mobile/core/FleetHealth.kt"
      - "android-inventory/mobile-core/src/test/java/com/eay/mobile/core/FleetHealthTest.kt"
      - "docs/mobile/EAY_MOBILE_FLEET_OPERATIONS.md"
      - ".github/workflows/eay-mobile-fleet-health.yml"
  push:
    branches:
      - agent/eay-mobile-platform-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fleet-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev]'
      - name: Lint fleet health authority and route surface
        working-directory: services/core-api
        run: >-
          ruff check
          app/core/mobile_fleet_health.py
          app/mobile_fleet_routes.py
          app/main.py
          tests/test_mobile_fleet_health.py
      - name: Prove privacy, proof, replay and classification contracts
        working-directory: services/core-api
        run: python -m pytest -q tests/test_mobile_fleet_health.py
      - name: Prove fleet routes are mounted in Core API
        working-directory: services/core-api
        run: >-
          python -c "from app.main import app;
          paths=set(app.openapi().get('paths',{}));
          required={'/v1/mobile/fleet/credentials','/v1/mobile/fleet/health'};
          assert required.issubset(paths), paths"

  fleet-android-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Preserve Android fleet classifier and mobile-core contracts
        run: >-
          gradle --no-daemon
          :mobile-core:testDebugUnitTest
          :mobile-core:lintDebug
