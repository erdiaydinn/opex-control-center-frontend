name: EAY Mobile Platform Foundation

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "android-inventory/**"
      - "mobile-presentation-contracts/**"
      - "config/eay_mobile_platform.json"
      - "docs/mobile/**"
      - "mobile/**"
      - "ops/mobile/**"
      - "backend/app/modules/inventory/router.py"
      - "backend/app/modules/inventory/production.py"
      - "backend/tests/test_inventory_production_identity_authority.py"
      - "backend/tests/test_inventory_terminal_event_hash_contract.py"
      - "services/core-api/app/core/mobile_device_trust.py"
      - "services/core-api/app/core/mobile_policy.py"
      - "services/core-api/app/core/mobile_policy_signing.py"
      - "services/core-api/tests/test_mobile_device_trust.py"
      - "services/core-api/tests/test_mobile_policy.py"
      - "services/core-api/tests/test_mobile_policy_signing.py"
      - ".github/workflows/eay-mobile-foundation.yml"
  push:
    branches:
      - agent/eay-mobile-platform-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Mobile fail-closed static contract
        run: sh ops/mobile/verify-mobile-foundation.sh
      - name: Preserve canonical Inventory Android hardening
        run: sh ops/inventory/verify-android-production.sh

  mobile-core-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API test surface
        working-directory: services/core-api
        run: python -m pip install -e '.[dev]'
      - name: Lint mobile authority, device trust and terminal event contracts
        run: >-
          ruff check
          services/core-api/app/core/mobile_device_trust.py
          services/core-api/app/core/mobile_policy.py
          services/core-api/app/core/mobile_policy_signing.py
          services/core-api/tests/test_mobile_device_trust.py
          services/core-api/tests/test_mobile_policy.py
          services/core-api/tests/test_mobile_policy_signing.py
          backend/tests/test_inventory_production_identity_authority.py
          backend/tests/test_inventory_terminal_event_hash_contract.py
      - name: Prove mobile authority fail-closed behavior
        working-directory: services/core-api
        run: >-
          pytest -q
          tests/test_mobile_device_trust.py
          tests/test_mobile_policy.py
          tests/test_mobile_policy_signing.py
      - name: Prove production Inventory identity and event hash contracts
        run: >-
          pytest -q
          backend/tests/test_inventory_production_identity_authority.py
          backend/tests/test_inventory_terminal_event_hash_contract.py

  android-mobile-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Unit, lint, typed presentation adapter and executable terminal regression
        run: >-
          gradle --no-daemon clean
          :mobile-core:testDebugUnitTest
          :mobile-core:lintDebug
          :field-presentation-adapter:testDebugUnitTest
          :field-presentation-adapter:lintDebug
          :field-presentation-adapter:assembleDebug
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
