name: EAY Mobile Platform Foundation

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "android-inventory/**"
      - "config/eay_mobile_platform.json"
      - "docs/mobile/**"
      - "mobile/**"
      - "ops/mobile/**"
      - ".github/workflows/eay-mobile-foundation.yml"
  push:
    branches:
      - agent/eay-mobile-platform-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Mobile fail-closed static contract
        run: sh ops/mobile/verify-mobile-foundation.sh
      - name: Preserve canonical Inventory Android hardening
        run: sh ops/inventory/verify-android-production.sh

  android-mobile-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Unit, lint and executable terminal regression
        run: gradle --no-daemon clean :mobile-core:testDebugUnitTest :mobile-core:lintDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
