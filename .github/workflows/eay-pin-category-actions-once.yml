name: EAY Pin Category Actions Once

on:
  push:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - ".github/workflows/eay-pin-category-actions-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eay-pin-category-actions-once
  cancel-in-progress: false

jobs:
  pin-category-actions:
    if: github.repository == 'erdiaydinn/opex-control-center-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: product/eay-category-leadership-v1
          fetch-depth: 0

      - name: Pin only category-leadership action refs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/eay-category-leadership-ci.yml')
          text = path.read_text(encoding='utf-8')
          checkout_old = 'actions/checkout@v4'
          python_old = 'actions/setup-python@v5'
          assert text.count(checkout_old) == 2, text.count(checkout_old)
          assert text.count(python_old) == 1, text.count(python_old)
          text = text.replace(
              checkout_old,
              'actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09',
          )
          text = text.replace(
              python_old,
              'actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1',
          )
          path.write_text(text, encoding='utf-8')
          PY
          node scripts/test-github-action-pinning.mjs
          git config user.name 'eay-ci-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/eay-category-leadership-ci.yml
          git rm .github/workflows/eay-pin-category-actions-once.yml
          git diff --cached --check
          git commit -m 'ci: pin category leadership actions to immutable commits'
          git push origin HEAD:product/eay-category-leadership-v1
