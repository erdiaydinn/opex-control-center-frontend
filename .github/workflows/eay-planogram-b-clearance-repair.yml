name: EAY Planogram B - One Shot Clearance Projection Repair

on:
  push:
    branches:
      - product/planogram-market-leadership-v1
    paths:
      - ".github/workflows/eay-planogram-b-clearance-repair.yml"

permissions:
  contents: write

jobs:
  repair-clearance-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: product/planogram-market-leadership-v1
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Preserve StoreScene metadata through 2D and 3D projections
        run: |
          python - <<'PY'
          from pathlib import Path

          model_path = Path('src/modules/planogram/planogramAuthoringModel.js')
          model = model_path.read_text()
          projection_anchor = '''      geometry: { ...node.geometry },\n      locked: node.locked,\n'''
          projection_replacement = '''      geometry: { ...node.geometry },\n      locked: node.locked,\n      metadata: stableValue(node.metadata || {}),\n      provenance: stableValue(node.provenance || {}),\n'''
          if model.count(projection_anchor) != 1:
              raise SystemExit(f'Unexpected StoreScene projection anchor count: {model.count(projection_anchor)}')
          model = model.replace(projection_anchor, projection_replacement, 1)
          model_path.write_text(model)

          twin_path = Path('src/modules/planogram/planogramDigitalTwinModel.js')
          twin = twin_path.read_text()
          rotation_anchor = '''        depth_m: node.geometry.depthM,\n        rotation_deg: node.geometry.rotationDeg,\n'''
          rotation_replacement = '''        depth_m: node.geometry.depthM,\n        rotation_deg: node.geometry.rotationDeg,\n        clearance_m: node.metadata?.clearanceM ?? 0,\n'''
          if twin.count(rotation_anchor) != 1:
              raise SystemExit(f'Unexpected 3D StoreScene mapping anchor count: {twin.count(rotation_anchor)}')
          twin = twin.replace(rotation_anchor, rotation_replacement, 1)
          twin_path.write_text(twin)
          PY
          git diff --check
          node scripts/test-planogram-authoring.mjs
          node scripts/test-planogram-digital-twin.mjs
      - name: Commit projection repair if acceptance passes
        run: |
          git config user.name 'eay-planogram-ci'
          git config user.email 'eay-planogram-ci@users.noreply.github.com'
          git add \
            src/modules/planogram/planogramAuthoringModel.js \
            src/modules/planogram/planogramDigitalTwinModel.js
          git commit -m 'fix(planogram): preserve StoreScene clearance metadata'
          git push origin HEAD:product/planogram-market-leadership-v1
