name: EAY Planogram B - Isolated Engine Ruff Repair

on:
  push:
    branches:
      - agent/planogram-b-engine-ruff-repair-20260821
    paths:
      - ".github/workflows/eay-planogram-b-engine-ruff-repair-agent-20260821.yml"

permissions:
  contents: write

jobs:
  repair-engine-ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/planogram-b-engine-ruff-repair-20260821
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply behavior-preserving engine corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/planai/backend/engine.py')
          source = path.read_text()
          replacements = [
              ('except Exception:\n    def apply_overrides_to_product(p):\n', 'except ImportError:\n    def apply_overrides_to_product(p):\n'),
              ('    except Exception:\n        return d\n\n\ndef inum', '    except (TypeError, ValueError, OverflowError):\n        return d\n\n\ndef inum'),
              ('    except Exception:\n        return d\n\n\ndef clean_text', '    except (TypeError, ValueError, OverflowError):\n        return d\n\n\ndef clean_text'),
              ('    supplier = as_text_list(rule.get("supplier") or rule.get("supplier_name"))\n    if supplier and not _matches_token(get(p, ["supplier_name", "vendor_name"], ""), supplier):\n        return False\n\n    return True\n', '    supplier = as_text_list(rule.get("supplier") or rule.get("supplier_name"))\n    return not supplier or _matches_token(get(p, ["supplier_name", "vendor_name"], ""), supplier)\n'),
              ('    aid = key(aisle.get("aisle_id"))\n    groups = cached_groups if cached_groups is not None else existing_groups_on_aisle(aisle)\n\n', '    aid = key(aisle.get("aisle_id"))\n\n'),
              ('    if product_group == "NON_FOOD_ODOR" and any(str(g).startswith("FOOD") for g in shelf_groups):\n        return False\n\n    return True\n', '    return product_group != "NON_FOOD_ODOR" or not any(str(g).startswith("FOOD") for g in shelf_groups)\n'),
              ('    if oriented_depth(p) > num(shelf.get("shelf_depth_cm"), 50):\n        return False\n    return True\n', '    return oriented_depth(p) <= num(shelf.get("shelf_depth_cm"), 50)\n'),
              ('        if num(shelf.get("max_weight_kg"), 45) - num(shelf.get("used_weight_kg"), 0) + 1e-9 < product_weight:\n            return False\n        return True\n', '        return num(shelf.get("max_weight_kg"), 45) - num(shelf.get("used_weight_kg"), 0) + 1e-9 >= product_weight\n'),
              ('        "placement_score": round(best_score, 1),\n', '        "placement_score": round(float(best_score), 1),\n'),
              ('        if any(_column_key(column) in INPUT_COLUMN_ALIASES for column in (raw or {}).keys()):\n', '        if any(_column_key(column) in INPUT_COLUMN_ALIASES for column in (raw or {})):\n'),
              ('        ok, reason = can_place(p, aisle, module, shelf, existing_groups_on_aisle(aisle))\n        if not ok:\n            continue\n', '        ok, _reason = can_place(p, aisle, module, shelf, existing_groups_on_aisle(aisle))\n        if not ok:\n            continue\n'),
              ('            ok, reason = can_place(p, aisle, module, shelf, existing_groups_on_aisle(aisle))\n            if not ok:\n                continue\n', '            ok, _reason = can_place(p, aisle, module, shelf, existing_groups_on_aisle(aisle))\n            if not ok:\n                continue\n'),
              ('    travel_seconds = len(set(x["aisle_id"] for x in route)) * 8\n', '    travel_seconds = len({x["aisle_id"] for x in route}) * 8\n'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one repair anchor, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          git diff --check
          python -m py_compile apps/planai/backend/engine.py
      - name: Prove exact P0 Ruff gate
        run: |
          python -m pip install 'ruff>=0.8,<1'
          ruff check --ignore I001,E501 \
            apps/planai/backend/physical_truth.py \
            apps/planai/backend/engine.py \
            apps/planai/backend/tests/test_physical_truth.py \
            apps/planai/backend/tests/test_physical_engine.py \
            services/core-api/app/modules/planogram/access.py \
            services/core-api/app/modules/planogram/execution_router.py \
            services/core-api/app/modules/planogram/router.py \
            services/core-api/tests/test_planogram_store_scope.py
      - name: Run focused physical engine regression
        run: |
          python -m pip install -r apps/planai/backend/requirements.txt
          pytest -q \
            apps/planai/backend/tests/test_physical_truth.py \
            apps/planai/backend/tests/test_physical_engine.py
      - name: Commit repair only after acceptance passes
        run: |
          git config user.name 'eay-planogram-ci'
          git config user.email 'eay-planogram-ci@users.noreply.github.com'
          git add apps/planai/backend/engine.py
          git commit -m 'fix(planogram): clear exact P0 engine lint gate'
          git push origin HEAD:agent/planogram-b-engine-ruff-repair-20260821
