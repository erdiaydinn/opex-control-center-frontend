name: EAY Planogram B - One Shot StoreScene Integration

on:
  push:
    branches:
      - product/planogram-market-leadership-v1
    paths:
      - ".github/workflows/eay-planogram-b-integration-repair.yml"

permissions:
  contents: write

jobs:
  integrate-store-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: product/planogram-market-leadership-v1
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Bind existing 2D and 3D renderers to canonical StoreScene
        run: |
          python - <<'PY'
          from pathlib import Path

          model_path = Path('src/modules/planogram/planogramAuthoringModel.js')
          model = model_path.read_text()
          restore_start = model.index('  if (command.type === "RESTORE_NODES") {')
          restore_end = model.index('\n\n  throw new Error(`Unsupported StoreScene command:', restore_start)
          restore_block = model[restore_start:restore_end]
          model = model[:restore_start] + model[restore_end:]
          lookup = '  const index = scene.nodes.findIndex((row) => row.nodeId === command.nodeId);'
          if lookup not in model:
              raise SystemExit('StoreScene lookup anchor missing')
          model = model.replace(lookup, restore_block + '\n\n' + lookup, 1)
          model_path.write_text(model)

          authoring_path = Path('src/modules/planogram/PlanogramArchitecturalAuthoring.jsx')
          authoring = authoring_path.read_text()
          import_anchor = '  buildPlanogramAuthoringDocument,\n'
          if import_anchor not in authoring:
              raise SystemExit('2D import anchor missing')
          authoring = authoring.replace(
              import_anchor,
              import_anchor + '  buildStoreScene,\n',
              1,
          )
          candidate_anchor = '  candidateWithPlanogramAuthoringDocument,\n'
          authoring = authoring.replace(
              candidate_anchor,
              candidate_anchor + '  projectStoreScene2D,\n',
              1,
          )
          projection_anchor = '  const projection = useMemo(() => projectionFor(document), [document]);\n'
          projection_insert = '''  const scene2D = useMemo(() => {\n    if (!document) return null;\n    const scene = buildStoreScene(candidate, document);\n    return scene ? projectStoreScene2D(scene) : null;\n  }, [candidate, document]);\n  const renderedElements = useMemo(() => {\n    const projectedById = new Map((scene2D?.nodes || []).map((node) => [node.nodeId, node]));\n    return (document?.architecture?.elements || []).map((element) => {\n      const projected = projectedById.get(element.element_id);\n      if (!projected) return element;\n      return {\n        ...element,\n        center_x_m: projected.geometry.centerXM,\n        center_y_m: projected.geometry.centerYM,\n        width_m: projected.geometry.widthM,\n        depth_m: projected.geometry.depthM,\n        rotation_deg: projected.geometry.rotationDeg,\n      };\n    });\n  }, [document, scene2D]);\n'''
          if projection_anchor not in authoring:
              raise SystemExit('2D projection anchor missing')
          authoring = authoring.replace(projection_anchor, projection_anchor + projection_insert, 1)
          render_anchor = '            {document.architecture.elements.map((element) => (\n'
          if authoring.count(render_anchor) != 1:
              raise SystemExit(f'Unexpected 2D render anchor count: {authoring.count(render_anchor)}')
          authoring = authoring.replace(render_anchor, '            {renderedElements.map((element) => (\n', 1)
          authoring_path.write_text(authoring)

          twin_path = Path('src/modules/planogram/planogramDigitalTwinModel.js')
          twin = twin_path.read_text()
          if not twin.startswith('const DEFAULT_MODULE_WIDTH_M'):
              raise SystemExit('3D model header anchor missing')
          twin = 'import { buildPlanogramAuthoringDocument, buildStoreScene, projectStoreScene3D } from "./planogramAuthoringModel.js";\n\n' + twin
          elements_anchor = '''  const elements = profile\n    ? (architecture?.elements || []).map((element) => architectureElement(element, profile)).filter((item) => item.widthM > 0 && item.depthM > 0)\n    : [];\n'''
          replacement = '''  const storeScene = profile\n    ? buildStoreScene(candidate, buildPlanogramAuthoringDocument(candidate))\n    : null;\n  const storeScene3D = storeScene ? projectStoreScene3D(storeScene) : null;\n  const elements = profile\n    ? (storeScene3D?.nodes || []).map((node) => architectureElement({\n        element_id: node.nodeId,\n        element_type: node.nodeType,\n        center_x_m: node.geometry.centerXM,\n        center_y_m: node.geometry.centerYM,\n        width_m: node.geometry.widthM,\n        depth_m: node.geometry.depthM,\n        rotation_deg: node.geometry.rotationDeg,\n      }, profile)).filter((item) => item.widthM > 0 && item.depthM > 0)\n    : [];\n'''
          if elements_anchor not in twin:
              raise SystemExit('3D elements anchor missing')
          twin = twin.replace(elements_anchor, replacement, 1)
          twin_path.write_text(twin)

          test_path = Path('scripts/test-planogram-authoring.mjs')
          test = test_path.read_text()
          undo_anchor = 'pass("UNDO-001", "reversible command history preserves deterministic geometry");\n'
          delete_test = '''\nlet deleteHistory = createStoreSceneHistory(scene);\ndeleteHistory = executeStoreSceneCommand(deleteHistory, {\n  commandId: "CMD-DELETE-1",\n  type: "DELETE_NODE",\n  nodeId: stableNodeId,\n  expectedRevision: deleteHistory.present.revision,\n});\nif (deleteHistory.present.nodes.some((node) => node.nodeId === stableNodeId)) fail("Delete command did not remove the node.");\ndeleteHistory = undoStoreSceneCommand(deleteHistory);\nif (!deleteHistory.present.nodes.some((node) => node.nodeId === stableNodeId)) fail("Undo-delete did not restore the node with its stable id.");\n'''
          if undo_anchor not in test:
              raise SystemExit('Undo acceptance anchor missing')
          test = test.replace(undo_anchor, undo_anchor + delete_test, 1)
          source_anchor = 'const pickerEye = fs.readFileSync("src/modules/planogram/PlanogramPickerEyePreview.jsx", "utf8");\n'
          source_insert = 'const digitalTwinModel = fs.readFileSync("src/modules/planogram/planogramDigitalTwinModel.js", "utf8");\n'
          if source_anchor not in test:
              raise SystemExit('Source-check anchor missing')
          test = test.replace(source_anchor, source_anchor + source_insert, 1)
          renderer_anchor = 'if (!scanWorkspace.includes("onOpenEditableModel(reviewedResult)")) fail("Reviewed scan cannot be opened in editable model.");\n'
          renderer_checks = '''if (!authoring.includes("projectStoreScene2D") || !authoring.includes("renderedElements.map")) fail("2D renderer is not bound to canonical StoreScene projection.");\nif (!digitalTwinModel.includes("projectStoreScene3D") || !digitalTwinModel.includes("storeScene3D?.nodes")) fail("3D renderer model is not bound to canonical StoreScene projection.");\n'''
          if renderer_anchor not in test:
              raise SystemExit('Renderer acceptance anchor missing')
          test = test.replace(renderer_anchor, renderer_anchor + renderer_checks, 1)
          test_path.write_text(test)
          PY
          git diff --check
          node scripts/test-planogram-authoring.mjs
      - name: Commit integration if acceptance passes
        run: |
          git config user.name 'eay-planogram-ci'
          git config user.email 'eay-planogram-ci@users.noreply.github.com'
          git add \
            src/modules/planogram/planogramAuthoringModel.js \
            src/modules/planogram/PlanogramArchitecturalAuthoring.jsx \
            src/modules/planogram/planogramDigitalTwinModel.js \
            scripts/test-planogram-authoring.mjs
          git commit -m 'feat(planogram): bind 2d and 3d to canonical StoreScene'
          git push origin HEAD:product/planogram-market-leadership-v1
