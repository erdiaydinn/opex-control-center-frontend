name: EAY Planogram B - One Shot Safe Lint Repair

on:
  push:
    branches:
      - product/planogram-market-leadership-v1
    paths:
      - ".github/workflows/eay-planogram-b-lint-repair.yml"

permissions:
  contents: write

jobs:
  safe-lint-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: product/planogram-market-leadership-v1
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply Ruff safe fixes to exact P0 surface
        run: |
          python -m pip install 'ruff>=0.8,<1'
          ruff check --fix --ignore I001,E501 \
            apps/planai/backend/physical_truth.py \
            apps/planai/backend/engine.py \
            apps/planai/backend/tests/test_physical_truth.py \
            apps/planai/backend/tests/test_physical_engine.py \
            services/core-api/app/modules/planogram/access.py \
            services/core-api/app/modules/planogram/execution_router.py \
            services/core-api/app/modules/planogram/router.py \
            services/core-api/tests/test_planogram_store_scope.py || true
          git diff --check
      - name: Commit safe lint repair if needed
        run: |
          if git diff --quiet; then
            echo 'NO_SAFE_FIXES=TRUE'
            exit 0
          fi
          git config user.name 'eay-planogram-ci'
          git config user.email 'eay-planogram-ci@users.noreply.github.com'
          git add \
            apps/planai/backend/physical_truth.py \
            apps/planai/backend/engine.py \
            apps/planai/backend/tests/test_physical_truth.py \
            apps/planai/backend/tests/test_physical_engine.py \
            services/core-api/app/modules/planogram/access.py \
            services/core-api/app/modules/planogram/execution_router.py \
            services/core-api/app/modules/planogram/router.py \
            services/core-api/tests/test_planogram_store_scope.py
          git commit -m 'style(planogram): apply safe P0 Ruff fixes'
          git push origin HEAD:product/planogram-market-leadership-v1
