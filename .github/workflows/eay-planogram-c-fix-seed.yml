name: EAY Planogram C - Fix Visual Quality Seed

on:
  push:
    branches:
      - product/planogram-market-leadership-v1
    paths:
      - ".github/workflows/eay-planogram-c-fix-seed.yml"

permissions:
  contents: write

jobs:
  fix-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: product/planogram-market-leadership-v1
          fetch-depth: 0
      - name: Use Vite build as the JSX syntax authority and retrigger
        run: |
          git config user.name 'eay-planogram-ci'
          git config user.email 'eay-planogram-ci@users.noreply.github.com'
          sed -i '/node --check src\/modules\/planogram\/PlanogramDigitalTwin.jsx/d' .github/workflows/eay-planogram-c-visual-quality-seed.yml
          printf '\n# retrigger-jsx-safe\n' >> .github/workflows/eay-planogram-c-visual-quality-seed.yml
          git add .github/workflows/eay-planogram-c-visual-quality-seed.yml
          git commit -m 'ci(planogram): validate visual quality JSX through production build'
          git push origin HEAD:product/planogram-market-leadership-v1
