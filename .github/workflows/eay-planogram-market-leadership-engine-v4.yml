name: EAY Planogram Market Leadership - Engine V4

on:
  push:
    branches:
      - product/planogram-market-leadership-v1
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "apps/planai/backend/physical_optimizer_v4.py"
      - "apps/planai/backend/tests/test_physical_optimizer_v4.py"
      - "apps/planai/backend/physical_optimizer_v3.py"
      - "apps/planai/backend/physical_optimizer_v2.py"
      - "apps/planai/backend/physical_optimizer.py"
      - "apps/planai/backend/picker_tour_simulation.py"
      - ".github/workflows/eay-planogram-market-leadership-engine-v4.yml"

permissions:
  contents: read

concurrency:
  group: eay-planogram-market-leadership-engine-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-market-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/planai/backend/requirements.txt
      - name: Install PlanAI dependencies and test tools
        run: |
          python -m pip install -r apps/planai/backend/requirements.txt
          python -m pip install pytest ruff
      - name: Lint V4 search surface
        run: >-
          ruff check
          apps/planai/backend/physical_optimizer_v4.py
          apps/planai/backend/tests/test_physical_optimizer_v4.py
      - name: V4 deterministic search acceptance
        working-directory: apps/planai/backend
        run: python -m pytest -q tests/test_physical_optimizer_v4.py
      - name: Preserve V3 and picker-tour behavior
        working-directory: apps/planai/backend
        run: >-
          python -m pytest -q
          tests/test_physical_optimizer_v3.py
          tests/test_picker_tour_simulation.py
      - name: Prove bounded expansion and truth boundary
        working-directory: apps/planai/backend
        run: |
          python - <<'PY'
          import physical_optimizer_v3 as v3
          import physical_optimizer_v4 as v4
          profiles=v4.search_profiles()
          assert profiles[0] == ('baseline', None)
          assert len(profiles) > len(v3.STRATEGIES)
          assert len(profiles) <= v4.MAX_SEARCH_CANDIDATES
          assert v4.MAX_SEARCH_CANDIDATES == 32
          print(f'PLANOGRAM_V3_PROFILE_COUNT={len(v3.STRATEGIES)}')
          print(f'PLANOGRAM_V4_AVAILABLE_PROFILE_COUNT={len(profiles)}')
          print('PLANOGRAM_V4_SEARCH_BOUNDED=PASS')
          print('PLANOGRAM_V4_PRODUCTION_AUTHORITY=FALSE')
          print('PLANOGRAM_V4_FIELD_KPI_BACKTEST=REQUIRED')
          PY
