name: EAY Planogram Market Leadership - Spatial V2

on:
  push:
    branches:
      - product/planogram-market-leadership-v1
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "apps/planai/backend/architecture_truth_v2.py"
      - "apps/planai/backend/tests/test_architecture_truth_v2.py"
      - "services/core-api/app/modules/planogram/store_scan.py"
      - "services/core-api/app/modules/planogram/schemas.py"
      - "services/core-api/app/modules/planogram/router.py"
      - "services/core-api/tests/test_planogram_store_scan_contract.py"
      - ".github/workflows/eay-planogram-market-leadership-spatial-v2.yml"

permissions:
  contents: read

concurrency:
  group: eay-planogram-market-leadership-spatial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arbitrary-angle-spatial-truth:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/planai/backend/requirements.txt
            services/core-api/pyproject.toml
      - name: Install PlanAI and Core test surfaces
        run: |
          python -m pip install -r apps/planai/backend/requirements.txt
          python -m pip install -e "./services/core-api[dev]"
      - name: Lint spatial V2 and Store Scan boundaries
        run: >-
          ruff check
          apps/planai/backend/architecture_truth_v2.py
          apps/planai/backend/tests/test_architecture_truth_v2.py
          services/core-api/app/modules/planogram/store_scan.py
          services/core-api/app/modules/planogram/schemas.py
          services/core-api/app/modules/planogram/router.py
          services/core-api/tests/test_planogram_store_scan_contract.py
      - name: Arbitrary-angle architecture acceptance
        working-directory: apps/planai/backend
        run: python -m pytest -q tests/test_architecture_truth_v2.py
      - name: Store Scan V1 compatibility and V2 preservation
        run: python -m pytest -q services/core-api/tests/test_planogram_store_scan_contract.py
      - name: Preserve V1 production-facing physical truth
        working-directory: apps/planai/backend
        run: >-
          python -m pytest -q
          tests/test_architecture_truth.py
          tests/test_architecture_route_gate.py
          tests/test_physical_optimizer_v3.py
      - name: Truth boundary
        run: |
          echo 'PLANOGRAM_ARCHITECTURE_V2_ARBITRARY_ROTATION=IMPLEMENTED_PREVIEW'
          echo 'PLANOGRAM_STORE_SCAN_V2_GEOMETRY_PRESERVATION=IMPLEMENTED_PREVIEW'
          echo 'PLANOGRAM_ARCHITECTURE_V1_PRODUCTION_AUTHORITY=UNCHANGED'
          echo 'PLANOGRAM_REAL_DEVICE_SCAN_UAT=REQUIRED'
          echo 'PLANOGRAM_MARKET_LEADERSHIP_CLAIM=FALSE'
