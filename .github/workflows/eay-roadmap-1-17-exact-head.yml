name: EAY Roadmap 1-17 Exact-Head Acceptance

on:
  pull_request:
    branches: [product/eay-product-completion-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EAY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prior-1-16:
    name: Require roadmap 1-16 GREEN on same exact head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for exact-head 1-16 cumulative gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..180}; do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/eay-roadmap-1-16-exact-head.yml/runs?event=pull_request&per_page=30" --jq ".workflow_runs | map(select(.head_sha == \"$EAY_EXACT_HEAD\")) | sort_by(.id) | last | [.status,.conclusion] | @tsv")"
            echo "prior_1_16=$row"
            status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 8
          done
          echo 'timed out waiting for roadmap 1-16 exact-head gate' >&2
          exit 1

  glossary-scoped-authority:
    name: Item 17 scoped effective semantic authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eay_glossary_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eay_glossary_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EAY_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$EAY_EXACT_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install canonical backend dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Run scoped resolver acceptance
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_business_glossary_item17_scoped_effective_versions.py
      - name: Apply canonical glossary persistence
        run: psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/007_business_glossary.sql
      - name: Seed RLS identities and scoped effective definitions
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE glossary_a LOGIN PASSWORD 'runtime_a' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE glossary_b LOGIN PASSWORD 'runtime_b' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          INSERT INTO glossary_tenant_bindings(role_name,tenant_id) VALUES ('glossary_a','tenant-a'),('glossary_b','tenant-b');
          GRANT USAGE ON SCHEMA public TO glossary_a, glossary_b;
          GRANT SELECT, INSERT ON glossary_terms, glossary_governance_events TO glossary_a, glossary_b;
          GRANT EXECUTE ON FUNCTION glossary_current_tenant() TO glossary_a, glossary_b;
          INSERT INTO glossary_terms(tenant_id,concept_id,canonical_key,business_unit,domain,version,status,effective_from,display_name,short_definition,aliases,owner_subject) VALUES
          ('tenant-a','nsfr.market','nsfr','Market','operations',1,'effective','2026-01-01Z','{"en":"NSFR"}','{"en":"Market tenant A definition"}','["NSFR"]','semantic-governance'),
          ('tenant-a','nsfr.qcommerce','nsfr','QCommerce','operations',1,'effective','2026-01-01Z','{"en":"NSFR"}','{"en":"QCommerce tenant A definition"}','["NSFR"]','semantic-governance'),
          ('tenant-b','nsfr.market','nsfr','Market','operations',1,'effective','2026-01-01Z','{"en":"NSFR"}','{"en":"Market tenant B definition"}','["NSFR"]','semantic-governance');
          SQL
      - name: Prove PostgreSQL tenant isolation and scoped authority
        run: |
          PGPASSWORD=runtime_a psql -h localhost -U glossary_a -d eay_glossary_ci -Atc "SELECT short_definition->>'en' FROM glossary_terms WHERE canonical_key='nsfr' AND business_unit='Market';" | grep -qx 'Market tenant A definition'
          PGPASSWORD=runtime_a psql -h localhost -U glossary_a -d eay_glossary_ci -Atc "SELECT short_definition->>'en' FROM glossary_terms WHERE canonical_key='nsfr' AND business_unit='QCommerce';" | grep -qx 'QCommerce tenant A definition'
          PGPASSWORD=runtime_b psql -h localhost -U glossary_b -d eay_glossary_ci -Atc "SELECT short_definition->>'en' FROM glossary_terms WHERE canonical_key='nsfr' AND business_unit='Market';" | grep -qx 'Market tenant B definition'
          PGPASSWORD=runtime_a psql -h localhost -U glossary_a -d eay_glossary_ci -Atc "SELECT count(*) FROM glossary_terms WHERE tenant_id='tenant-b';" | grep -qx '0'
          PGPASSWORD=runtime_b psql -h localhost -U glossary_b -d eay_glossary_ci -Atc "SELECT count(*) FROM glossary_terms WHERE tenant_id='tenant-a';" | grep -qx '0'
          if PGPASSWORD=runtime_a psql -h localhost -U glossary_a -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "INSERT INTO glossary_terms(tenant_id,concept_id,canonical_key,version,status,effective_from,display_name,short_definition,owner_subject) VALUES ('tenant-b','forbidden','nsfr',9,'effective',now(),'{\"en\":\"NSFR\"}','{\"en\":\"forbidden\"}','attacker');"; then
            echo 'cross-tenant glossary write unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Preserve production truth boundary
        run: |
          echo 'item17_repository_acceptance=true'
          echo 'same_acronym_tenant_business_unit_resolution=true'
          echo 'cross_tenant_fallback=false'
          echo 'production_ready=false'

  accepted:
    name: Roadmap 1-17 exact-head repository acceptance
    runs-on: ubuntu-latest
    needs: [prior-1-16, glossary-scoped-authority]
    steps:
      - run: |
          echo "exact_head=$EAY_EXACT_HEAD"
          echo 'roadmap_1_16_exact_head_green=true'
          echo 'item17_repository_software_acceptance=true'
          echo 'production_ready=false'
          echo 'external_evidence_not_substituted=true'
