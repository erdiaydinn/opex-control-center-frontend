name: EAY Roadmap 1-18 Exact-Head Acceptance

on:
  pull_request:
    branches: [product/eay-product-completion-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EAY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prior-1-17:
    name: Require roadmap 1-17 GREEN on same exact head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for exact-head 1-17 cumulative gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..180}; do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/eay-roadmap-1-17-exact-head.yml/runs?event=pull_request&per_page=30" --jq ".workflow_runs | map(select(.head_sha == \"$EAY_EXACT_HEAD\")) | sort_by(.id) | last | [.status,.conclusion] | @tsv")"
            echo "prior_1_17=$row"
            status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 8
          done
          echo 'timed out waiting for roadmap 1-17 exact-head gate' >&2
          exit 1

  glossary-lifecycle-authority:
    name: Item 18 lifecycle and Jarvis authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eay_glossary_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eay_glossary_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EAY_EXACT_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$EAY_EXACT_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install canonical backend dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Prove governance and Jarvis draft exclusion
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q \
            backend/tests/test_business_glossary_governance.py \
            backend/tests/test_business_glossary_item18_lifecycle_authority.py
      - name: Apply canonical glossary migrations
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/007_business_glossary.sql
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -f backend/migrations/016_business_glossary_lifecycle_authority.sql
      - name: Prove direct-write lifecycle bypasses fail closed
        run: |
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO glossary_terms(tenant_id,concept_id,canonical_key,business_unit,domain,version,status,display_name,short_definition,owner_subject)
          VALUES ('tenant-a','nsfr','nsfr','Market','operations',1,'draft','{"en":"NSFR"}','{"en":"draft definition"}','semantic-governance');
          SQL
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "INSERT INTO glossary_terms(tenant_id,concept_id,canonical_key,version,status,effective_from,display_name,short_definition,owner_subject) VALUES ('tenant-a','direct-effective','direct-effective',1,'effective',now(),'{\"en\":\"Direct\"}','{\"en\":\"forbidden\"}','bypass');"; then
            echo 'direct effective insert unexpectedly succeeded' >&2; exit 1
          fi
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='effective', effective_from=now() WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"; then
            echo 'draft-to-effective bypass unexpectedly succeeded' >&2; exit 1
          fi
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='approved' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"; then
            echo 'draft-to-approved bypass unexpectedly succeeded' >&2; exit 1
          fi
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='review' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='approved' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='effective' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"; then
            echo 'effective transition without effective_from unexpectedly succeeded' >&2; exit 1
          fi
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='effective', effective_from='2026-08-17T08:30:00Z' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET short_definition='{\"en\":\"mutated\"}' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"; then
            echo 'effective definition mutation unexpectedly succeeded' >&2; exit 1
          fi
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='draft' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"; then
            echo 'effective-to-draft resurrection unexpectedly succeeded' >&2; exit 1
          fi
          psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='superseded', effective_to='2026-08-17T09:30:00Z' WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"
          if psql -h localhost -U postgres -d eay_glossary_ci -v ON_ERROR_STOP=1 -c "UPDATE glossary_terms SET status='effective', effective_to=NULL WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1;"; then
            echo 'superseded resurrection unexpectedly succeeded' >&2; exit 1
          fi
          test "$(psql -h localhost -U postgres -d eay_glossary_ci -Atc "SELECT status FROM glossary_terms WHERE tenant_id='tenant-a' AND concept_id='nsfr' AND version=1")" = superseded
      - name: Preserve production truth boundary
        run: |
          echo 'item18_repository_acceptance=true'
          echo 'jarvis_draft_authoritative=false'
          echo 'db_lifecycle_bypass=false'
          echo 'production_ready=false'

  accepted:
    name: Roadmap 1-18 exact-head repository acceptance
    runs-on: ubuntu-latest
    needs: [prior-1-17, glossary-lifecycle-authority]
    steps:
      - run: |
          echo "exact_head=$EAY_EXACT_HEAD"
          echo 'roadmap_1_17_exact_head_green=true'
          echo 'item18_repository_software_acceptance=true'
          echo 'production_ready=false'
          echo 'external_evidence_not_substituted=true'
