# Temporary branch-only repair harness v4 artifact export; remove before canonical composition.
name: EAY Roadmap Cumulative Gate Repair Bot

on:
  pull_request:
    branches:
      - product/eay-category-leadership-v1
    paths:
      - "scripts/ci/repair_roadmap_legacy_migration_gates.py"
      - ".github/workflows/eay-roadmap-cumulative-gate-repair-bot.yml"

permissions:
  contents: read

concurrency:
  group: eay-roadmap-cumulative-gate-repair-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/cumulative-migration-gate-repair
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply assertion-bounded legacy gate repair
        run: python scripts/ci/repair_roadmap_legacy_migration_gates.py
      - name: Upload exactly the repaired workflow files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eay-roadmap-1-11-14-repaired-workflows
          path: |
            .github/workflows/eay-roadmap-1-11-exact-head.yml
            .github/workflows/eay-roadmap-1-12-exact-head.yml
            .github/workflows/eay-roadmap-1-13-exact-head.yml
            .github/workflows/eay-roadmap-1-14-exact-head.yml
          if-no-files-found: error
          retention-days: 1
