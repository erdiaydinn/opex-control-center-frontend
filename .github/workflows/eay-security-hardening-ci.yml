name: EAY Security Hardening

on:
  pull_request:
    branches:
      - product/eay-product-completion-v1
    paths:
      - "services/core-api/app/core/security.py"
      - "services/core-api/app/core/internal_identity.py"
      - "services/core-api/app/core/internal_service_replay.py"
      - "services/core-api/app/core/client_ip.py"
      - "services/core-api/app/core/config.py"
      - "services/core-api/app/core/permission_catalog.py"
      - "services/core-api/app/main.py"
      - "services/core-api/app/intelligence_routes.py"
      - "services/core-api/app/field_promotion_routes.py"
      - "services/core-api/app/field_evidence_object_routes.py"
      - "services/core-api/app/modules/field_intelligence/**"
      - "services/core-api/alembic/**"
      - "services/core-api/tests/test_bearer_header_boundary.py"
      - "services/core-api/tests/test_security_foundation.py"
      - "services/core-api/tests/test_internal_service_auth_dependency.py"
      - "services/core-api/tests/test_internal_service_replay.py"
      - "services/core-api/tests/test_trusted_proxy_boundary.py"
      - "services/core-api/tests/test_cors_runtime_boundary.py"
      - "services/core-api/tests/test_production_tls_boundary.py"
      - "services/core-api/tests/test_frontend_browser_trust_boundary.py"
      - "services/core-api/tests/test_identity_foundation_adversarial.py"
      - "services/core-api/tests/test_field_intelligence_rls.py"
      - "services/core-api/tests/test_field_intelligence_ui_contract.py"
      - "services/core-api/tests/test_field_mobile_offline.py"
      - "services/core-api/tests/test_field_governed_promotion.py"
      - "services/core-api/tests/test_sql_access_boundary.py"
      - "config/eay_security_hardening_contract.json"
      - ".github/workflows/eay-security-hardening-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-hardening:
    name: Bearer tenant identity replay proxy TLS and SQL boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install Core API with test dependencies
        run: python -m pip install -e './services/core-api[dev]'
      - name: Compile security boundary
        run: |
          python -m py_compile \
            services/core-api/app/core/security.py \
            services/core-api/app/core/internal_identity.py \
            services/core-api/app/core/internal_service_replay.py \
            services/core-api/app/core/client_ip.py \
            services/core-api/app/core/config.py \
            services/core-api/app/core/permission_catalog.py \
            services/core-api/app/main.py \
            services/core-api/app/intelligence_routes.py \
            services/core-api/app/field_promotion_routes.py \
            services/core-api/app/field_evidence_object_routes.py \
            services/core-api/app/modules/field_intelligence/schemas.py \
            services/core-api/app/modules/field_intelligence/repository.py \
            services/core-api/app/modules/field_intelligence/mobile_offline.py \
            services/core-api/app/modules/field_intelligence/evidence_integrity.py \
            services/core-api/app/modules/field_intelligence/evidence_object_upload.py \
            services/core-api/app/modules/field_intelligence/promotion.py \
            services/core-api/app/modules/field_intelligence/promotion_access.py
      - name: Create RLS-bound runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Apply canonical database migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Run bearer identity tenant isolation and Field base authority tests
        env:
          PYTHONPATH: services/core-api
        run: |
          python -m pytest -q \
            services/core-api/tests/test_bearer_header_boundary.py \
            services/core-api/tests/test_security_foundation.py \
            services/core-api/tests/test_identity_foundation_adversarial.py \
            services/core-api/tests/test_field_intelligence_rls.py \
            services/core-api/tests/test_field_intelligence_ui_contract.py
      - name: Run Field mobile offline and receipt-authority tests
        env:
          PYTHONPATH: services/core-api
        run: python -m pytest -q services/core-api/tests/test_field_mobile_offline.py
      - name: Run Field governed promotion tests
        env:
          PYTHONPATH: services/core-api
        run: python -m pytest -q services/core-api/tests/test_field_governed_promotion.py
      - name: Run internal service and replay tests
        env:
          PYTHONPATH: services/core-api
        run: |
          python -m pytest -q \
            services/core-api/tests/test_internal_service_auth_dependency.py \
            services/core-api/tests/test_internal_service_replay.py
      - name: Run proxy CORS TLS browser and SQL boundary tests
        env:
          PYTHONPATH: services/core-api
        run: |
          python -m pytest -q \
            services/core-api/tests/test_trusted_proxy_boundary.py \
            services/core-api/tests/test_cors_runtime_boundary.py \
            services/core-api/tests/test_production_tls_boundary.py \
            services/core-api/tests/test_frontend_browser_trust_boundary.py \
            services/core-api/tests/test_sql_access_boundary.py
      - name: Preserve frozen baseline and production truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path('config/eay_security_hardening_contract.json').read_text()
          )
          assert contract['master_plan_item'] == '4/60'
          assert contract['frozen_baseline']['pull_request'] == 16
          assert contract['frozen_baseline']['mutable_from_this_continuation'] is False
          assert contract['production_ready'] is False
          assert contract['production_activation_permitted'] is False
          assert contract['main_merge_permitted'] is False
          truth = contract['truth_boundary']
          assert truth['repository_security_tests_are_production_identity_evidence'] is False
          assert truth['corporate_oidc_is_still_external'] is True
          assert truth['managed_runtime_proxy_waf_tls_acceptance_is_still_external'] is True
          print('Security hardening truth boundary preserved')
          PY
