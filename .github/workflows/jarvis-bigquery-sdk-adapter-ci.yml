name: Jarvis BigQuery SDK Adapter CI

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-bigquery-sdk-parameter-adapter
  pull_request:
    branches:
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: jarvis-bigquery-sdk-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-parameter-adapter:
    name: BigQuery SDK parameter adapter
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:unused@localhost:5432/unused
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:unused@localhost:5432/unused
      OPEX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API with reviewed BigQuery extra
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Lint SDK adapter slice
        run: >-
          ruff check
          services/core-api/app/core/ai_orders_v2_bigquery_parameters.py
          services/core-api/app/core/ai_orders_v2_bigquery_sdk_adapter.py
          services/core-api/tests/test_ai_orders_v2_bigquery_parameters.py
          services/core-api/tests/test_ai_orders_v2_bigquery_sdk_adapter.py
      - name: Test real SDK adapter without network execution
        run: >-
          pytest -q
          services/core-api/tests/test_ai_orders_v2_bigquery_parameters.py
          services/core-api/tests/test_ai_orders_v2_bigquery_sdk_adapter.py
          services/core-api/tests/test_ai_orders_v2_query_contract.py
          services/core-api/tests/test_ai_query_contract_policy.py
