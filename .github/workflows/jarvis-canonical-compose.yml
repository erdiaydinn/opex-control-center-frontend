name: Jarvis Canonical Convergence Compose

on:
  push:
    branches:
      - release/platform-convergence-jarvis-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-jarvis-v0.1
          fetch-depth: 0
      - name: Fetch canonical current Jarvis source
        run: |
          git fetch origin platform-core/eay-v2-jarvis-orders-policy-transition-guard
          test "$(git rev-parse origin/platform-core/eay-v2-jarvis-orders-policy-transition-guard)" = "cb7c514b776ee87a3bbac9e5c01ef36d994aeecc"
      - name: Merge and resolve only reviewed platform-authority conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EAY Convergence CI'
          git config user.email 'ci@eay.invalid'
          set +e
          git merge --no-commit --no-ff origin/platform-core/eay-v2-jarvis-orders-policy-transition-guard >/tmp/jarvis-compose.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=(
            'scripts/security/identity_gateway_runtime_gate.py'
            'services/core-api/app/core/permission_catalog.py'
            'services/core-api/app/main.py'
            'services/core-api/tests/test_security_foundation.py'
          )
          printf '%s\n' "${conflicts[@]}" >/tmp/jarvis-conflicts.txt
          test "${#conflicts[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${conflicts[$i]}" = "${expected[$i]}"; done

          git checkout --ours scripts/security/identity_gateway_runtime_gate.py
          git checkout --ours services/core-api/tests/test_security_foundation.py
          git checkout --ours services/core-api/app/core/permission_catalog.py
          git checkout --ours services/core-api/app/main.py

          python - <<'PY'
          from pathlib import Path

          catalog = Path('services/core-api/app/core/permission_catalog.py')
          source = catalog.read_text(encoding='utf-8')
          assert '"ai_assistant": frozenset(' not in source
          anchor = 'ACTIONS = MappingProxyType(\n    {\n'
          assert source.count(anchor) == 1
          block = '''ACTIONS = MappingProxyType(\n    {\n        "ai_assistant": frozenset(\n            {\n                "executeOpsRead",\n                "executeCatalogRead",\n                "executeLegalRead",\n            }\n        ),\n'''
          source = source.replace(anchor, block)
          catalog.write_text(source, encoding='utf-8')

          main = Path('services/core-api/app/main.py')
          source = main.read_text(encoding='utf-8')
          import_line = 'from app.ai_tool_routes import router as ai_tool_router\n'
          if import_line not in source:
              anchor = 'from app.core.audit import build_audit_event\n'
              assert source.count(anchor) == 1
              source = source.replace(anchor, import_line + anchor)
          include_line = 'app.include_router(ai_tool_router)\n'
          if include_line not in source:
              anchor = 'app.add_middleware(TrustedHostMiddleware, allowed_hosts=settings.allowed_host_list)\n'
              assert source.count(anchor) == 1
              source = source.replace(anchor, include_line + '\n' + anchor)
          assert source.count(import_line) == 1
          assert source.count(include_line) == 1
          main.write_text(source, encoding='utf-8')
          PY

          # Preserve the newer cumulative platform workflows during the Git merge.
          # Jarvis-focused workflow files will be restored separately from the
          # canonical source through the GitHub connector after code convergence.
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -f .github/workflows/jarvis-integration-diagnostic.yml
          rm -f .github/workflows/jarvis-canonical-compose.yml

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core API
        run: python -m pip install -e './services/core-api[dev]'
      - name: Full Core Ruff gate
        run: ruff check services/core-api
      - name: Server-authority live proof regression
        run: pytest -q services/core-api/tests/test_ai_orders_v2_live_cross_tenant_runner.py
      - name: Preserve current security foundation
        run: pytest -q services/core-api/tests/test_security_foundation.py services/core-api/tests/test_sql_access_boundary.py
      - name: Verify cumulative runtime wiring
        run: |
          grep -F 'from app.ai_tool_routes import router as ai_tool_router' services/core-api/app/main.py
          grep -F 'app.include_router(ai_tool_router)' services/core-api/app/main.py
          grep -F 'from app.modules.academy.router import router as academy_router' services/core-api/app/main.py
          grep -F 'app.include_router(academy_router)' services/core-api/app/main.py
          grep -F '"ai_assistant": frozenset(' services/core-api/app/core/permission_catalog.py
      - name: Commit canonical Jarvis composition
        shell: bash
        run: |
          git commit -m 'release(jarvis): compose current Orders V2 evidence line onto platform convergence'
          git push origin HEAD:release/platform-convergence-jarvis-v0.1
