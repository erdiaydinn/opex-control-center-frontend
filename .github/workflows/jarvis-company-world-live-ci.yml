name: EAY Jarvis Company World Live

on:
  push:
    branches:
      - product/jarvis-company-world-live-v1
    paths:
      - "services/eay-ai-core/app/company_world_live_bridge.py"
      - "services/eay-ai-core/app/context_provider_gateway.py"
      - "services/eay-ai-core/app/context_provider_registry.py"
      - "services/eay-ai-core/app/context_provider_runtime.py"
      - "services/eay-ai-core/field_evidence/tuik_portal_probe_v1.json"
      - "services/eay-ai-core/app/continuous_world_understanding.py"
      - "services/eay-ai-core/app/real_world_timeline.py"
      - "services/eay-ai-core/app/world_model.py"
      - "services/eay-ai-core/tests/test_company_world_live_bridge_intelligence.py"
      - "services/eay-ai-core/tests/test_context_provider_runtime_intelligence.py"
      - "services/eay-ai-core/tests/test_continuous_world_understanding_intelligence.py"
      - "services/eay-ai-core/tests/test_world_model.py"
      - ".github/workflows/jarvis-company-world-live-ci.yml"
  pull_request:
    paths:
      - "services/eay-ai-core/app/company_world_live_bridge.py"
      - "services/eay-ai-core/app/context_provider_gateway.py"
      - "services/eay-ai-core/app/context_provider_registry.py"
      - "services/eay-ai-core/app/context_provider_runtime.py"
      - "services/eay-ai-core/field_evidence/tuik_portal_probe_v1.json"
      - "services/eay-ai-core/app/continuous_world_understanding.py"
      - "services/eay-ai-core/app/real_world_timeline.py"
      - "services/eay-ai-core/app/world_model.py"
      - "services/eay-ai-core/tests/test_company_world_live_bridge_intelligence.py"
      - "services/eay-ai-core/tests/test_context_provider_runtime_intelligence.py"
      - "services/eay-ai-core/tests/test_continuous_world_understanding_intelligence.py"
      - "services/eay-ai-core/tests/test_world_model.py"
      - ".github/workflows/jarvis-company-world-live-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-company-world-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  company-world-live:
    name: Company World external-context authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPANY_WORLD_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove literal Company World head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "COMPANY_WORLD_EXPECTED_SHA=$COMPANY_WORLD_EXPECTED_SHA"
          echo "COMPANY_WORLD_ACTUAL_SHA=$actual"
          test "$actual" = "$COMPANY_WORLD_EXPECTED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install canonical AI Core runtime and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: One-shot TUIK portal field acceptance probe
        run: |
          set -euo pipefail
          url='https://veriportali.tuik.gov.tr/tr'
          headers="${RUNNER_TEMP}/tuik-portal.headers"
          body="${RUNNER_TEMP}/tuik-portal.body"
          status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 --header 'Accept: text/html' --header 'User-Agent: EAY-Jarvis-Field-Probe/1.0' "$url")"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
          bytes="$(wc -c < "$body" | tr -d ' ')"
          sha="$(sha256sum "$body" | awk '{print $1}')"
          echo "TUIK_PROBE_URL=$url"
          echo "TUIK_PROBE_STATUS=$status"
          echo "TUIK_PROBE_CONTENT_TYPE=$content_type"
          echo "TUIK_PROBE_BYTES=$bytes"
          echo "TUIK_PROBE_SHA256=$sha"
          test "$status" = "200"
          test "$bytes" -gt 1000
      - name: Probe TUIK public JSON candidate without promotion
        run: |
          set -euo pipefail
          url='https://veriportali.tuik.gov.tr/api/tr/data/statistical-themes'
          headers="${RUNNER_TEMP}/tuik-json.headers"
          body="${RUNNER_TEMP}/tuik-json.body"
          status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 --header 'Accept: application/json' --header 'User-Agent: EAY-Jarvis-Field-Probe/1.0' "$url" || true)"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers" 2>/dev/null || true)"
          bytes="$(wc -c < "$body" 2>/dev/null | tr -d ' ' || printf '0')"
          sha="$(sha256sum "$body" 2>/dev/null | awk '{print $1}' || true)"
          echo "TUIK_JSON_CANDIDATE_URL=$url"
          echo "TUIK_JSON_CANDIDATE_STATUS=${status:-transport_error}"
          echo "TUIK_JSON_CANDIDATE_CONTENT_TYPE=${content_type:-unknown}"
          echo "TUIK_JSON_CANDIDATE_BYTES=${bytes:-0}"
          echo "TUIK_JSON_CANDIDATE_SHA256=${sha:-unavailable}"
          if [ "$status" = "200" ] && printf '%s' "$content_type" | grep -qi 'application/json'; then
            python -c 'import json,sys; data=json.load(open(sys.argv[1],"rb")); print("TUIK_JSON_CANDIDATE_KIND=" + type(data).__name__); print("TUIK_JSON_CANDIDATE_TOP_KEYS=" + ",".join(sorted(map(str,data.keys()))[:30]) if isinstance(data,dict) else "TUIK_JSON_CANDIDATE_LENGTH=" + str(len(data)))' "$body"
          fi
      - name: Ruff Company World live and provider runtime
        run: >-
          ruff check
          app/company_world_live_bridge.py
          app/context_provider_gateway.py
          app/context_provider_registry.py
          app/context_provider_runtime.py
          tests/test_company_world_live_bridge_intelligence.py
          tests/test_context_provider_runtime_intelligence.py
      - name: Compile Company World authority surface
        run: >-
          python -m compileall -q
          app/company_world_live_bridge.py
          app/context_provider_gateway.py
          app/context_provider_registry.py
          app/context_provider_runtime.py
          app/continuous_world_understanding.py
          app/real_world_timeline.py
          app/world_model.py
          tests/test_company_world_live_bridge_intelligence.py
          tests/test_context_provider_runtime_intelligence.py
      - name: Run Company World adversarial and lineage contracts
        run: >-
          pytest -q
          tests/test_company_world_live_bridge_intelligence.py
          tests/test_context_provider_runtime_intelligence.py
          tests/test_continuous_world_understanding_intelligence.py
          tests/test_world_model.py
