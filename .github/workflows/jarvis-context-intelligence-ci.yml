permissions:
  contents: read

concurrency:
  group: jarvis-context-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Jarvis executive context, API learning, supremacy runtime and decision contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.9,<3.0" "pytest>=8,<9"
      - name: Compile Jarvis executive intelligence contracts
        run: |
          python -m compileall -q \
            app/context_intelligence.py \
            app/context_taxonomy.py \
            app/context_provider_registry.py \
            app/context_provider_gateway.py \
            app/source_governance.py \
