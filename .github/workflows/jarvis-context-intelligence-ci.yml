name: EAY Jarvis Context Intelligence

on:
  push:
    branches:
      - product/jarvis-context-intelligence-v1
    paths:
      - "services/eay-ai-core/app/context_intelligence.py"
      - "services/eay-ai-core/app/enterprise_domain_registry.py"
      - "services/eay-ai-core/app/finance_intelligence.py"
      - "services/eay-ai-core/app/repository_intelligence.py"
      - "services/eay-ai-core/config/repository_intelligence_registry.json"
      - "services/eay-ai-core/tests/test_context_intelligence.py"
      - "services/eay-ai-core/tests/test_context_anomaly_guard.py"
      - "services/eay-ai-core/tests/test_enterprise_domain_registry.py"
      - "services/eay-ai-core/tests/test_enterprise_economics_domain.py"
      - "services/eay-ai-core/tests/test_finance_intelligence.py"
      - "services/eay-ai-core/tests/test_repository_intelligence.py"
      - "services/eay-ai-core/tests/test_repository_intelligence_legal_sources.py"
      - ".github/workflows/jarvis-context-intelligence-ci.yml"
  pull_request:
    paths:
      - "services/eay-ai-core/app/context_intelligence.py"
      - "services/eay-ai-core/app/enterprise_domain_registry.py"
      - "services/eay-ai-core/app/finance_intelligence.py"
      - "services/eay-ai-core/app/repository_intelligence.py"
      - "services/eay-ai-core/config/repository_intelligence_registry.json"
      - "services/eay-ai-core/tests/test_context_intelligence.py"
      - "services/eay-ai-core/tests/test_context_anomaly_guard.py"
      - "services/eay-ai-core/tests/test_enterprise_domain_registry.py"
      - "services/eay-ai-core/tests/test_enterprise_economics_domain.py"
      - "services/eay-ai-core/tests/test_finance_intelligence.py"
      - "services/eay-ai-core/tests/test_repository_intelligence.py"
      - "services/eay-ai-core/tests/test_repository_intelligence_legal_sources.py"
      - ".github/workflows/jarvis-context-intelligence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-context-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Context, economics, finance and Turkish legal source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.9,<3.0" "pytest>=8,<9"
      - name: Compile Jarvis context, domain, finance and repository contracts
        run: |
          python -m compileall -q \
            app/context_intelligence.py \
            app/enterprise_domain_registry.py \
            app/finance_intelligence.py \
            app/repository_intelligence.py \
            tests/test_context_intelligence.py \
            tests/test_context_anomaly_guard.py \
            tests/test_enterprise_domain_registry.py \
            tests/test_enterprise_economics_domain.py \
            tests/test_finance_intelligence.py \
            tests/test_repository_intelligence.py \
            tests/test_repository_intelligence_legal_sources.py
      - name: Run Jarvis executive-intelligence adversarial tests
        run: |
          python -m pytest -q \
            tests/test_context_intelligence.py \
            tests/test_context_anomaly_guard.py \
            tests/test_enterprise_domain_registry.py \
            tests/test_enterprise_economics_domain.py \
            tests/test_finance_intelligence.py \
            tests/test_repository_intelligence.py \
            tests/test_repository_intelligence_legal_sources.py
