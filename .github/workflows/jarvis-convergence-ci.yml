name: EAY Jarvis Orders V2 Convergence

on:
  push:
    branches:
      - release/platform-convergence-jarvis-v0.1
      - release/platform-convergence-v0.1
  pull_request:
    branches:
      - release/platform-convergence-v0.1

permissions:
  contents: read

concurrency:
  group: jarvis-orders-v2-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jarvis-contracts:
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API with reviewed BigQuery SDK extra
        run: python -m pip install -e './services/core-api[dev,bigquery]'
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Full Core Ruff gate
        run: ruff check services/core-api --output-format=github
      - name: Preserve central SQL access boundary before migrations
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py
      - name: Enforce one cumulative Alembic head
        working-directory: services/core-api
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t heads < <(alembic heads | awk '/\(head\)/ {print $1}')
          printf 'ALEMBIC_HEAD=%s\n' "${heads[@]}"
          test "${#heads[@]}" -eq 1
          test "${heads[0]}" = '0018_academy_product_roles'
      - name: Apply cumulative database migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Complete AI/Jarvis contract suite with file-level process isolation
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in services/core-api/tests/test_ai_*.py; do
            echo "=== JARVIS_TEST_FILE: ${test_file} ==="
            pytest -q "${test_file}"
            count=$((count + 1))
          done
          test "${count}" -gt 0
          echo "JARVIS_TEST_FILES=${count}"
      - name: Server-authoritative Orders V2 live-proof contract
        run: pytest -q services/core-api/tests/test_ai_orders_v2_live_cross_tenant_runner.py
      - name: Preserve central platform security boundaries
        run: pytest -q services/core-api/tests/test_security_foundation.py services/core-api/tests/test_sql_access_boundary.py
      - name: Verify cumulative runtime authority composition
        run: |
          grep -F 'from app.ai_tool_routes import router as ai_tool_router' services/core-api/app/main.py
          grep -F 'app.include_router(ai_tool_router)' services/core-api/app/main.py
          grep -F 'from app.modules.academy.router import router as academy_router' services/core-api/app/main.py
          grep -F 'app.include_router(academy_router)' services/core-api/app/main.py
          grep -F '"ai_assistant": frozenset(' services/core-api/app/core/permission_catalog.py
          test ! -e src/auth/accessConfig.js
          echo 'JARVIS_PLATFORM_AUTHORITY_COMPOSITION=PASS'
      - name: Compile governed Orders V2 surface
        run: >-
          python -m compileall -q
          services/core-api/app/ai_tool_routes.py
          services/core-api/app/core/ai_orders_v2_live_cross_tenant_runner.py
          services/core-api/app/core/ai_orders_v2_policy_transition.py
          services/core-api/app/core/ai_orders_v2_policy_transition_guard.py
