name: EAY Jarvis Cyber Defense Acceptance

on:
  push:
    branches:
      - product/jarvis-context-intelligence-v1
      - product/jarvis-general-intelligence-v1
    paths:
      - "services/eay-ai-core/app/cyber_*.py"
      - "services/eay-ai-core/app/company_detection_coverage_intelligence.py"
      - "services/eay-ai-core/tests/test_cyber_*.py"
      - "services/eay-ai-core/tests/test_company_detection_coverage_intelligence.py"
      - "services/eay-ai-core/config/cyber_*.json"
      - "services/eay-ai-core/config/eay_cyber_*.json"
      - "services/eay-ai-core/scripts/run_live_cyber_defense_smoke.py"
      - "services/eay-ai-core/scripts/run_cyber_world_championship_readiness.py"
      - "services/eay-ai-core/pyproject.toml"
      - ".github/workflows/jarvis-cyber-defense-ci.yml"
  pull_request:
    paths:
      - "services/eay-ai-core/app/cyber_*.py"
      - "services/eay-ai-core/app/company_detection_coverage_intelligence.py"
      - "services/eay-ai-core/tests/test_cyber_*.py"
      - "services/eay-ai-core/tests/test_company_detection_coverage_intelligence.py"
      - "services/eay-ai-core/config/cyber_*.json"
      - "services/eay-ai-core/config/eay_cyber_*.json"
      - "services/eay-ai-core/scripts/run_live_cyber_defense_smoke.py"
      - "services/eay-ai-core/scripts/run_cyber_world_championship_readiness.py"
      - "services/eay-ai-core/pyproject.toml"
      - ".github/workflows/jarvis-cyber-defense-ci.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-cyber-defense-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cyber-defense-contracts:
    name: Cyber threat, company truth, detection, assurance and response contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove literal cyber defense head
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "CYBER_EXPECTED_SHA=$expected"
          echo "CYBER_ACTUAL_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install canonical AI Core runtime and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff cyber defense surface
        run: |
          set +e
          python -m ruff check \
            app/cyber_*.py \
            app/company_detection_coverage_intelligence.py \
            tests/test_cyber_*.py \
            tests/test_company_detection_coverage_intelligence.py \
            scripts/run_live_cyber_defense_smoke.py \
            scripts/run_cyber_world_championship_readiness.py \
            --output-format=json > /tmp/cyber-ruff.json
          ruff_status=$?
          python - <<'PY'
          import collections
          import json

          with open('/tmp/cyber-ruff.json', encoding='utf-8') as handle:
              findings = json.load(handle)

          by_code = collections.Counter(item['code'] for item in findings)
          by_file = collections.Counter(item['filename'] for item in findings)
          print(f'CYBER_RUFF_TOTAL={len(findings)}')
          print(
              'CYBER_RUFF_BY_CODE='
              + ','.join(f'{code}:{count}' for code, count in sorted(by_code.items()))
          )
          print(
              'CYBER_RUFF_BY_FILE='
              + ','.join(f'{path}:{count}' for path, count in sorted(by_file.items()))
          )
          for item in findings:
              location = item['location']
              print(
                  f"CYBER_RUFF_FINDING {item['filename']}:"
                  f"{location['row']}:{location['column']} "
                  f"{item['code']} {item['message']}"
              )
          PY
          exit "$ruff_status"
      - name: Compile cyber defense contracts and adversarial tests
        run: |
          python -m compileall -q \
            app/cyber_*.py \
            app/company_detection_coverage_intelligence.py \
            tests/test_cyber_*.py \
            tests/test_company_detection_coverage_intelligence.py \
            scripts/run_live_cyber_defense_smoke.py \
            scripts/run_cyber_world_championship_readiness.py
      - name: Run cyber defense adversarial and end-to-end acceptance
        run: |
          python -m pytest -q \
            tests/test_cyber_*.py \
            tests/test_company_detection_coverage_intelligence.py

  continuous-cyber-benchmark:
    name: Continuous cyber benchmark safety floors
    needs: cyber-defense-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove literal benchmark head
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "CYBER_BENCH_EXPECTED_SHA=$expected"
          echo "CYBER_BENCH_ACTUAL_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run canonical cyber benchmark contract and safety floors
        run: |
          python -m pytest -q \
            tests/test_cyber_benchmark_intelligence.py \
            tests/test_cyber_continuous_defense_pipeline.py \
            -k "benchmark or full_continuous_cycle"

  cyber-world-championship-readiness:
    name: Cyber world championship blind-arena readiness
    needs: cyber-defense-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove literal championship head
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "CYBER_CHAMP_EXPECTED_SHA=$expected"
          echo "CYBER_CHAMP_ACTUAL_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install championship runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Enforce world championship truth gates
        run: python -m pytest -q tests/test_cyber_world_championship.py
      - name: Prove challenge-ready but not self-declared leader
        run: python scripts/run_cyber_world_championship_readiness.py

  live-public-threat-intelligence:
    name: Live CISA KEV, NVD and EPSS read-only observation
    needs: cyber-defense-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove literal live-observation head
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "CYBER_LIVE_EXPECTED_SHA=$expected"
          echo "CYBER_LIVE_ACTUAL_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install minimal cyber runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Observe current public threat intelligence without credentials or writes
        run: python scripts/run_live_cyber_defense_smoke.py
