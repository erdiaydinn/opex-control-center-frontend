name: Jarvis Execution Security CI

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-execution-security
  pull_request:
    branches:
      - platform-core/eay-v2-jarvis-security

permissions:
  contents: read

concurrency:
  group: jarvis-execution-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jarvis-execution-security:
    name: Jarvis execution security
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5434/opex_jarvis_execution_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5434/opex_jarvis_execution_test
      OPEX_REDIS_URL: redis://localhost:6381/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_jarvis_execution_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_jarvis_execution_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"

      - name: Lint Jarvis execution slice
        run: >-
          ruff check
          services/core-api/app/ai_tool_routes.py
          services/core-api/app/core/ai_tool_grants.py
          services/core-api/app/core/jarvis_service_identity.py
          services/core-api/app/core/jarvis_service_security.py
          services/core-api/tests/test_ai_tool_routes.py
          services/core-api/tests/test_jarvis_execution_contract.py
          services/core-api/tests/test_jarvis_execution_grants.py
          services/core-api/tests/test_jarvis_service_identity.py
          services/core-api/tests/test_jarvis_service_security.py

      - name: Test Jarvis execution security boundaries
        run: >-
          pytest -q
          services/core-api/tests/test_ai_tool_authorization.py
          services/core-api/tests/test_ai_tool_grants.py
          services/core-api/tests/test_ai_tool_routes.py
          services/core-api/tests/test_jarvis_execution_contract.py
          services/core-api/tests/test_jarvis_execution_grants.py
          services/core-api/tests/test_jarvis_service_identity.py
          services/core-api/tests/test_jarvis_service_security.py

      - name: Verify Jarvis routes are registered
        working-directory: services/core-api
        run: |
          python - <<'PY'
          from app.main import app

          def collect_paths(routes):
              paths = set()
              for route in routes:
                  path = getattr(route, "path", None)
                  if path is not None:
                      paths.add(path)
                  nested = getattr(route, "routes", None)
                  if nested is not None:
                      paths.update(collect_paths(nested))
              return paths

          paths = collect_paths(app.routes)
          assert "/v1/ai/tool-grants" in paths
          assert "/internal/ai/tool-executions/authorize" in paths
          PY

      - name: Verify external internal-route quarantine
        run: >-
          pytest -q
          services/core-api/tests/test_dockos_gateway_quarantine.py

      - name: Create RLS-bound runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5434/opex_jarvis_execution_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Apply migrations through Jarvis permission revision
        working-directory: services/core-api
        run: alembic upgrade 0009_ai_tool_permissions

      - name: Verify migration head
        working-directory: services/core-api
        run: alembic current
