name: EAY Frozen Authority V3 Coverage

on:
  pull_request:
    branches:
      - agent/jarvis-security-consolidation-v3
    paths:
      - "services/eay-ai-core/**"
      - "services/core-api/**"
      - "services/identity-gateway/**"
      - "services/postgres-backup/**"
      - "scripts/security/**"
      - "config/eay_frozen_authority_coverage_matrix_v1.json"
      - "config/eay_frozen_authority_coverage_extension_v2.json"
      - "config/eay_frozen_authority_coverage_extension_v3.json"
      - "scripts/validate_frozen_authority_coverage.py"
      - ".github/workflows/jarvis-frozen-authority-coverage-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-frozen-authority:
    name: Frozen #15 AI authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - name: Install AI Core
        run: python -m pip install -e "./services/eay-ai-core[dev]"
      - name: Validate composed frozen authority matrix
        run: python scripts/validate_frozen_authority_coverage.py
      - name: Revalidate frozen AI Core authority
        working-directory: services/eay-ai-core
        shell: bash
        run: |
          tests="$(python ../../scripts/validate_frozen_authority_coverage.py --print-ai-tests)"
          test -n "$tests"
          pytest -q $tests

  core-frozen-authority:
    name: Frozen #16 Core authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      EAY_TEST_MIGRATOR_DSN: postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test
      EAY_JARVIS_SECURITY_REDIS_INTEGRATION: "1"
      EAY_JARVIS_SECURITY_POSTGRES_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Require one Alembic head
        working-directory: services/core-api
        run: |
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" -eq 1
      - name: Apply cumulative migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Validate composed frozen authority matrix
        run: python scripts/validate_frozen_authority_coverage.py
      - name: Revalidate frozen Core authority
        working-directory: services/core-api
        shell: bash
        run: |
          tests="$(python ../../scripts/validate_frozen_authority_coverage.py --print-core-tests)"
          test -n "$tests"
          pytest -q $tests

  identity-gateway-security:
    name: Frozen #16 identity signing and secret runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/identity-gateway/pyproject.toml
      - name: Install Identity Gateway
        run: python -m pip install -e "./services/identity-gateway[dev]"
      - name: Validate composed frozen authority matrix
        run: python scripts/validate_frozen_authority_coverage.py
      - name: Revalidate frozen Identity Gateway authority
        working-directory: services/identity-gateway
        shell: bash
        run: |
          tests="$(python ../../scripts/validate_frozen_authority_coverage.py --print-identity-tests)"
          test -n "$tests"
          pytest -q $tests
      - name: Generate ephemeral signing material
        run: python scripts/security/generate_identity_ci_material.py
      - name: Production secret boundary
        run: python scripts/security/production_identity_secret_gate.py
      - name: Prepare non-root secret ownership
        run: python scripts/security/prepare_identity_ci_secret.py
      - name: Compose runtime adversarial gate
        run: python scripts/security/identity_gateway_runtime_gate.py
