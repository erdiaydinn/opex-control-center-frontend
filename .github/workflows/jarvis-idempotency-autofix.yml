name: Jarvis Idempotency Lint Autofix

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-request-idempotency
    paths:
      - .github/workflows/jarvis-idempotency-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform-core/eay-v2-jarvis-request-idempotency

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.9"

      - name: Apply only approved lint fixes
        run: |
          ruff check --fix \
            services/core-api/app/ai_tool_routes.py \
            services/core-api/tests/test_jarvis_execution_idempotency_runtime.py
          ruff format \
            services/core-api/tests/test_jarvis_execution_idempotency_runtime.py

      - name: Enforce file allowlist and clean Ruff result
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(services/core-api/app/ai_tool_routes.py|services/core-api/tests/test_jarvis_execution_idempotency_runtime.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Autofix touched unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          ruff check \
            services/core-api/app/ai_tool_routes.py \
            services/core-api/tests/test_jarvis_execution_idempotency_runtime.py

      - name: Commit approved lint-only changes
        run: |
          if git diff --quiet; then
            echo "No lint changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            services/core-api/app/ai_tool_routes.py \
            services/core-api/tests/test_jarvis_execution_idempotency_runtime.py
          git diff --cached --check
          git commit -m "style: normalize Jarvis idempotency lint"
          git push origin HEAD:platform-core/eay-v2-jarvis-request-idempotency
