name: Jarvis integration diagnostic

on:
  push:
    branches:
      - release/platform-convergence-jarvis-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical Jarvis head
        run: git fetch origin platform-core/eay-v2-orders-live-proof-authority-binding
      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set +e
          git config user.email "ci@eay.invalid"
          git config user.name "EAY CI"
          git merge --no-commit --no-ff origin/platform-core/eay-v2-orders-live-proof-authority-binding >/tmp/jarvis-merge.log 2>&1
          status=$?
          git diff --name-only --diff-filter=U | tee /tmp/jarvis-conflicts.txt
          cat /tmp/jarvis-merge.log
          if [ "$status" -eq 0 ]; then
            echo "JARVIS_MERGE_CONFLICTS=NONE"
            git merge --abort || true
            exit 0
          fi
          if [ ! -s /tmp/jarvis-conflicts.txt ]; then
            echo "JARVIS_MERGE_FAILED_WITHOUT_CONFLICT_LIST"
            git merge --abort || true
            exit 1
          fi
          echo "JARVIS_MERGE_CONFLICTS=FOUND"
          git merge --abort || true
          exit 1
      - name: Upload conflict diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-integration-conflicts
          path: |
            /tmp/jarvis-conflicts.txt
            /tmp/jarvis-merge.log
          if-no-files-found: error
          retention-days: 3
