name: Jarvis Orders Schema Attestation CI

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-orders-schema-attestation-cli
      - platform-core/eay-v2-jarvis-orders-live-cross-tenant-proof-contract
      - platform-core/eay-v2-jarvis-orders-human-promotion-review
  pull_request:
    branches:
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: jarvis-orders-schema-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-attestation-cli:
    name: Orders schema attestation CLI
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:unused@localhost:5432/unused
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:unused@localhost:5432/unused
      OPEX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API with BigQuery extra
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Lint orders-v2 evidence and human review slices
        run: >-
          ruff check
          services/core-api/app/core/ai_orders_v2_schema_attestation.py
          services/core-api/app/core/ai_orders_v2_live_cross_tenant_evidence.py
          services/core-api/app/core/ai_orders_v2_human_promotion_review.py
          services/core-api/app/cli/attest_orders_v2_schema.py
          services/core-api/tests/test_ai_orders_v2_schema_attestation.py
          services/core-api/tests/test_ai_orders_v2_live_cross_tenant_evidence.py
          services/core-api/tests/test_ai_orders_v2_human_promotion_review.py
      - name: Test evidence and review remain fail-closed and non-promoting
        run: >-
          pytest -q
          services/core-api/tests/test_ai_orders_v2_schema_attestation.py
          services/core-api/tests/test_ai_orders_v2_live_cross_tenant_evidence.py
          services/core-api/tests/test_ai_orders_v2_human_promotion_review.py
          services/core-api/tests/test_ai_orders_v2_live_schema_collector.py
          services/core-api/tests/test_ai_orders_v2_schema_evidence.py
          services/core-api/tests/test_ai_orders_v2_synthetic_proof.py
          services/core-api/tests/test_ai_query_contract_policy.py
