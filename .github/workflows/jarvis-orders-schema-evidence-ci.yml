name: Jarvis Orders Schema Evidence CI

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-orders-schema-evidence-contract
  pull_request:
    branches:
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: jarvis-orders-schema-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-evidence-contract:
    name: Orders schema evidence contract
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:unused@localhost:5432/unused
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:unused@localhost:5432/unused
      OPEX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Lint schema evidence contract
        run: >-
          ruff check
          services/core-api/app/core/ai_orders_v2_query_contract.py
          services/core-api/app/core/ai_orders_v2_schema_evidence.py
          services/core-api/tests/test_ai_orders_v2_schema_evidence.py
      - name: Test schema evidence contract remains non-promoting
        run: >-
          pytest -q
          services/core-api/tests/test_ai_orders_v2_schema_evidence.py
          services/core-api/tests/test_ai_orders_v2_query_contract.py
          services/core-api/tests/test_ai_query_contract_policy.py
