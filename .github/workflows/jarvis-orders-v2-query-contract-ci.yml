name: Jarvis Orders V2 Query Contract CI

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-orders-v2-query-contract
  pull_request:
    branches:
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: jarvis-orders-v2-query-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orders-v2-candidate-security:
    name: Orders V2 candidate security
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:unused@localhost:5432/unused
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:unused@localhost:5432/unused
      OPEX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Lint orders v2 candidate slice
        run: >-
          ruff check
          services/core-api/app/core/ai_orders_v2_query_contract.py
          services/core-api/tests/test_ai_orders_v2_query_contract.py
      - name: Test orders v2 candidate and promotion blocker
        run: >-
          pytest -q
          services/core-api/tests/test_ai_orders_v2_query_contract.py
          services/core-api/tests/test_ai_query_contract_policy.py
