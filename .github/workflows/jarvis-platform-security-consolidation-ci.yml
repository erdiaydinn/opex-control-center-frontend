name: EAY Jarvis Platform Security Consolidation

on:
  pull_request:
    branches:
      - agent/jarvis-security-consolidation-v3
    paths:
      - "services/core-api/app/ai_tool_routes.py"
      - "services/core-api/app/core/jarvis_execution_admission.py"
      - "services/core-api/app/core/jarvis_grant_idempotency.py"
      - "services/core-api/app/core/permission_catalog.py"
      - "services/core-api/alembic/versions/0045_jarvis_audit_hash_chain.py"
      - "services/core-api/tests/conftest.py"
      - "services/core-api/tests/test_ai_tool_routes.py"
      - "services/core-api/tests/test_ai_tool_audit_fail_closed.py"
      - "services/core-api/tests/test_jarvis_audit_hash_chain.py"
      - "services/core-api/tests/test_jarvis_platform_security_consolidation.py"
      - "services/core-api/tests/test_permission_catalog.py"
      - "services/eay-ai-core/app/platform_tool_authorizer.py"
      - "services/eay-ai-core/app/tool_execution.py"
      - "services/eay-ai-core/tests/test_governed_tool_execution_authorization.py"
      - "services/eay-ai-core/tests/test_tool_execution.py"
      - "services/eay-ai-core/tests/test_voice_governed_tool_adapter.py"
      - "src/modules/planogram/PlanogramStudio.jsx"
      - "config/eay_frozen_authority_coverage_matrix_v1.json"
      - "config/eay_frozen_authority_coverage_extension_v2.json"
      - "scripts/validate_frozen_authority_coverage.py"
      - ".github/workflows/jarvis-platform-security-consolidation-ci.yml"
      - "docs/security/JARVIS_PLATFORM_SECURITY_CONSOLIDATION_V1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-authority:
    name: Grant V4 idempotency and distributed admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_REDIS_URL: redis://localhost:6379/0
      EAY_JARVIS_SECURITY_REDIS_INTEGRATION: "1"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Compile consolidation surface
        run: python -m compileall -q services/core-api/app services/core-api/tests
      - name: Ruff consolidation surface
        run: >-
          ruff check
          services/core-api/app/ai_tool_routes.py
          services/core-api/app/core/jarvis_execution_admission.py
          services/core-api/app/core/jarvis_grant_idempotency.py
          services/core-api/tests/conftest.py
          services/core-api/tests/test_jarvis_platform_security_consolidation.py
          services/core-api/tests/test_ai_tool_routes.py
          services/core-api/tests/test_ai_tool_audit_fail_closed.py
      - name: Real Redis authority acceptance
        run: >-
          pytest -q
          services/core-api/tests/test_jarvis_platform_security_consolidation.py
      - name: Grant and route regression
        run: >-
          pytest -q
          services/core-api/tests/test_ai_tool_grants.py
          services/core-api/tests/test_ai_tool_routes.py
          services/core-api/tests/test_ai_tool_audit_fail_closed.py

  audit-evidence:
    name: PostgreSQL tamper-evident audit chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      EAY_JARVIS_SECURITY_POSTGRES_INTEGRATION: "1"
      EAY_TEST_MIGRATOR_DSN: postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Require one Alembic head
        working-directory: services/core-api
        run: |
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" -eq 1
      - name: Apply cumulative migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Ruff audit migration and acceptance
        run: >-
          ruff check
          services/core-api/alembic/versions/0045_jarvis_audit_hash_chain.py
          services/core-api/tests/test_jarvis_audit_hash_chain.py
      - name: Tamper-evident per-tenant chain acceptance
        run: pytest -q services/core-api/tests/test_jarvis_audit_hash_chain.py
      - name: SQL and audit fail-closed regression
        run: >-
          pytest -q
          services/core-api/tests/test_sql_access_boundary.py
          services/core-api/tests/test_ai_tool_audit_fail_closed.py

  ai-core-execution:
    name: AI Core and Voice governed execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - name: Install AI Core
        run: python -m pip install -e ".[dev]"
      - name: Validate frozen authority matrix paths
        run: python ../../scripts/validate_frozen_authority_coverage.py
      - name: Compile governed execution
        run: python -m compileall -q app tests
      - name: Ruff governed execution
        run: >-
          ruff check
          app/platform_tool_authorizer.py
          app/tool_execution.py
          tests/test_governed_tool_execution_authorization.py
          tests/test_tool_execution.py
          tests/test_voice_governed_tool_adapter.py
          tests/test_governed_tool_execution_adoption.py
      - name: Revalidate frozen AI Core authority on current head
        shell: bash
        run: |
          tests="$(python ../../scripts/validate_frozen_authority_coverage.py --print-ai-tests)"
          test -n "$tests"
          pytest -q $tests
      - name: Governed execution adversarial acceptance
        run: >-
          pytest -q
          tests/test_governed_tool_execution_authorization.py
          tests/test_tool_execution.py
          tests/test_voice_governed_tool_adapter.py
          tests/test_governed_tool_execution_adoption.py
      - name: Full AI Core regression
        run: pytest -q

  frozen-authority-coverage:
    name: "Frozen #15/#16 authority coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
      EAY_TEST_MIGRATOR_DSN: postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/pyproject.toml
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev,bigquery]"
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Require one Alembic head
        working-directory: services/core-api
        run: |
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" -eq 1
      - name: Apply cumulative migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Validate frozen source heads, capability paths and evidence paths
        run: python scripts/validate_frozen_authority_coverage.py
      - name: Ruff coverage validator
        run: ruff check scripts/validate_frozen_authority_coverage.py
      - name: Revalidate frozen Phase 1 authority on current head
        working-directory: services/core-api
        shell: bash
        run: |
          tests="$(python ../../scripts/validate_frozen_authority_coverage.py --print-core-tests)"
          test -n "$tests"
          pytest -q $tests
