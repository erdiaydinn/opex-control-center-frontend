name: Jarvis Query Contract CI

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-query-contract-gate
  pull_request:
    branches:
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: jarvis-query-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query-contract-security:
    name: Query contract security
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:unused@localhost:5432/unused
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:unused@localhost:5432/unused
      OPEX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Lint query-contract slice
        run: >-
          ruff check
          services/core-api/app/core/ai_query_contract_policy.py
          services/core-api/app/core/ai_tool_grants.py
          services/core-api/app/ai_tool_routes.py
          services/core-api/tests/test_ai_query_contract_policy.py
          services/core-api/tests/test_ai_tool_grants.py
          services/core-api/tests/test_jarvis_execution_contract.py
      - name: Test query-contract and grant binding
        run: >-
          pytest -q
          services/core-api/tests/test_ai_query_contract_policy.py
          services/core-api/tests/test_ai_tool_grants.py
          services/core-api/tests/test_jarvis_execution_contract.py
          services/core-api/tests/test_ai_tool_routes.py
