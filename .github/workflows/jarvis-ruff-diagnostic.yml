name: Jarvis Ruff Diagnostic

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-tool-authorization

permissions:
  contents: read

jobs:
  ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.2"
      - name: Show canonical import diff
        run: >-
          ruff check --diff
          services/core-api/app/core/ai_tool_authorization.py
          services/core-api/tests/test_ai_tool_authorization.py
          services/core-api/alembic/versions/0009_ai_tool_permissions.py
