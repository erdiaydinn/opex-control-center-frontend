name: EAY Jarvis Security Lint Fix Once

on:
  push:
    branches:
      - agent/jarvis-security-consolidation-v3
    paths:
      - ".github/workflows/jarvis-security-lint-fix-once.yml"

permissions:
  contents: write

concurrency:
  group: jarvis-security-lint-fix-once
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/jarvis-security-consolidation-v3
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Apply only reported Ruff fixes
        working-directory: services/eay-ai-core
        run: |
          python -m pip install 'ruff>=0.8,<1'
          python -m ruff check --fix --unsafe-fixes \
            app/bigquery_safe_executor.py \
            app/platform_tool_authorizer.py \
            tests/test_governed_tool_execution_adoption.py
      - name: Fail closed on unexpected changes
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            services/eay-ai-core/app/bigquery_safe_executor.py \
            services/eay-ai-core/app/platform_tool_authorizer.py \
            services/eay-ai-core/tests/test_governed_tool_execution_adoption.py | sort)"
          test "$changed" = "$expected"
          git diff --check
      - name: Commit bounded lint repair and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/jarvis-security-lint-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/eay-ai-core/app/bigquery_safe_executor.py \
            services/eay-ai-core/app/platform_tool_authorizer.py \
            services/eay-ai-core/tests/test_governed_tool_execution_adoption.py \
            .github/workflows/jarvis-security-lint-fix-once.yml
          git diff --cached --check
          git commit -m 'style(jarvis): align consolidated security with current Ruff'
          git push origin HEAD:agent/jarvis-security-consolidation-v3
