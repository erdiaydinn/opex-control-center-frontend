name: Jarvis Service Identity CI

on:
  push:
    branches:
      - platform-core/**
    paths:
      - "services/core-api/app/core/jarvis_service_identity.py"
      - "services/core-api/tests/test_jarvis_service_identity.py"
      - ".github/workflows/jarvis-service-identity-ci.yml"
  pull_request:
    branches:
      - platform-core/**
    paths:
      - "services/core-api/app/core/jarvis_service_identity.py"
      - "services/core-api/tests/test_jarvis_service_identity.py"
      - ".github/workflows/jarvis-service-identity-ci.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-service-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Jarvis service verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Compile verifier
        run: >-
          python -m py_compile
          services/core-api/app/core/jarvis_service_identity.py
          services/core-api/tests/test_jarvis_service_identity.py
      - name: Lint verifier boundary
        run: >-
          ruff check
          services/core-api/app/core/jarvis_service_identity.py
          services/core-api/tests/test_jarvis_service_identity.py
      - name: Run adversarial verifier tests
        run: >-
          pytest -q
          services/core-api/tests/test_jarvis_service_identity.py
