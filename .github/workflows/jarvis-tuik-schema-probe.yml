name: EAY Jarvis TUIK Schema Probe

on:
  pull_request:
    paths:
      - ".github/workflows/jarvis-tuik-schema-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: TUIK nested schema probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official TUIK theme catalog schema
        shell: bash
        run: |
          set -euo pipefail
          landing='https://veriportali.tuik.gov.tr/tr/statistical-themes'
          api='https://veriportali.tuik.gov.tr/api/tr/data/statistical-themes'
          cookie_jar="${RUNNER_TEMP}/tuik.cookies"
          body="${RUNNER_TEMP}/tuik-api.json"

          landing_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --cookie-jar "$cookie_jar" --connect-timeout 10 --max-time 20 \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8' \
            --header 'User-Agent: Mozilla/5.0 EAY-Jarvis-Schema-Probe/1.0' \
            "$landing")"
          test "$landing_status" = "200"

          api_status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            --connect-timeout 10 --max-time 20 \
            --header 'Accept: application/json, text/plain, */*' \
            --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8' \
            --header 'User-Agent: Mozilla/5.0 EAY-Jarvis-Schema-Probe/1.0' \
            --header "Referer: $landing" \
            --header 'Origin: https://veriportali.tuik.gov.tr' \
            --header 'X-Requested-With: XMLHttpRequest' \
            "$api")"
          test "$api_status" = "200"

          python - "$body" <<'PY'
          import json
          import pathlib
          import sys

          doc = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          print("TUIK_TOP_TYPE=" + type(doc).__name__)
          if not isinstance(doc, dict):
              raise SystemExit("TUIK_TOP_NOT_DICT")
          print("TUIK_TOP_KEYS=" + ",".join(sorted(map(str, doc.keys()))))
          payload = doc.get("data")
          print("TUIK_DATA_TYPE=" + type(payload).__name__)
          if not isinstance(payload, list):
              raise SystemExit("TUIK_DATA_NOT_LIST")
          print("TUIK_DATA_LEN=" + str(len(payload)))

          total_nodes = 0
          missing_url = []
          missing_url_nonleaf = []
          malformed_children = []

          def walk(nodes, *, depth=0, parent="root"):
              global total_nodes
              for index, node in enumerate(nodes):
                  total_nodes += 1
                  if not isinstance(node, dict):
                      raise SystemExit(f"TUIK_NODE_NOT_DICT depth={depth} parent={parent} index={index}")
                  node_id = str(node.get("id", "<missing>"))
                  name = str(node.get("name", "<missing>"))
                  children = node.get("children")
                  if not isinstance(children, list):
                      malformed_children.append((node_id, name, depth, type(children).__name__))
                      children = []
                  url = node.get("url")
                  has_url = isinstance(url, str) and bool(url.strip())
                  if not has_url:
                      sample = (node_id, name[:120], depth, len(children))
                      missing_url.append(sample)
                      if children:
                          missing_url_nonleaf.append(sample)
                  walk(children, depth=depth + 1, parent=node_id)

          walk(payload)
          print("TUIK_TOTAL_NODE_COUNT=" + str(total_nodes))
          print("TUIK_MISSING_URL_COUNT=" + str(len(missing_url)))
          print("TUIK_MISSING_URL_NONLEAF_COUNT=" + str(len(missing_url_nonleaf)))
          print("TUIK_MALFORMED_CHILDREN_COUNT=" + str(len(malformed_children)))
          for index, sample in enumerate(missing_url[:20]):
              node_id, name, depth, child_count = sample
              print(
                  f"TUIK_MISSING_URL_SAMPLE_{index}="
                  f"id={node_id}|name={name}|depth={depth}|children={child_count}"
              )
          for index, sample in enumerate(missing_url_nonleaf[:10]):
              node_id, name, depth, child_count = sample
              print(
                  f"TUIK_MISSING_URL_NONLEAF_SAMPLE_{index}="
                  f"id={node_id}|name={name}|depth={depth}|children={child_count}"
              )
          PY
