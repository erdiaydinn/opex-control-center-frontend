name: EAY Jarvis TUIK Schema Probe

on:
  pull_request:
    paths:
      - ".github/workflows/jarvis-tuik-schema-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: TUIK nested schema probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official TUIK theme catalog schema
        shell: bash
        run: |
          set -euo pipefail
          landing='https://veriportali.tuik.gov.tr/tr/statistical-themes'
          api='https://veriportali.tuik.gov.tr/api/tr/data/statistical-themes'
          cookie_jar="${RUNNER_TEMP}/tuik.cookies"
          body="${RUNNER_TEMP}/tuik-api.json"

          landing_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --cookie-jar "$cookie_jar" --connect-timeout 10 --max-time 20 \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8' \
            --header 'User-Agent: Mozilla/5.0 EAY-Jarvis-Schema-Probe/1.0' \
            "$landing")"
          test "$landing_status" = "200"

          api_status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            --connect-timeout 10 --max-time 20 \
            --header 'Accept: application/json, text/plain, */*' \
            --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8' \
            --header 'User-Agent: Mozilla/5.0 EAY-Jarvis-Schema-Probe/1.0' \
            --header "Referer: $landing" \
            --header 'Origin: https://veriportali.tuik.gov.tr' \
            --header 'X-Requested-With: XMLHttpRequest' \
            "$api")"
          test "$api_status" = "200"

          python - "$body" <<'PY'
          import collections
          import json
          import pathlib
          import sys
          from urllib.parse import urlparse

          doc = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          if not isinstance(doc, dict):
              raise SystemExit("TUIK_TOP_NOT_DICT")
          payload = doc.get("data")
          if not isinstance(payload, list):
              raise SystemExit("TUIK_DATA_NOT_LIST")

          total_nodes = 0
          max_depth = 0
          key_missing = collections.Counter()
          key_null = collections.Counter()
          key_blank = collections.Counter()
          key_types = collections.Counter()
          samples = collections.defaultdict(list)
          url_categories = collections.Counter()
          url_hosts = collections.Counter()

          def add_sample(bucket, node, depth):
              if len(samples[bucket]) >= 10:
                  return
              samples[bucket].append(
                  (
                      str(node.get("id", "<missing>"))[:160],
                      str(node.get("name", "<missing>"))[:160],
                      depth,
                      ",".join(sorted(map(str, node.keys()))[:50]),
                  )
              )

          def classify_url(value):
              normalized = value.strip()
              if normalized.startswith("//"):
                  return "protocol_relative"
              if normalized.startswith("/"):
                  return "root_relative"
              parsed = urlparse(normalized)
              if parsed.scheme:
                  return f"scheme:{parsed.scheme.casefold()}"
              if normalized.startswith("?"):
                  return "query_only"
              if normalized.startswith("#"):
                  return "fragment_only"
              return "relative_no_leading_slash"

          def walk(nodes, *, depth=0):
              global total_nodes, max_depth
              for node in nodes:
                  total_nodes += 1
                  max_depth = max(max_depth, depth)
                  if not isinstance(node, dict):
                      raise SystemExit(f"TUIK_NODE_NOT_DICT depth={depth}")

                  for key in ("id", "name", "children", "url"):
                      if key not in node:
                          key_missing[key] += 1
                          add_sample(f"missing:{key}", node, depth)
                          continue
                      value = node[key]
                      if value is None:
                          key_null[key] += 1
                          add_sample(f"null:{key}", node, depth)
                      else:
                          key_types[(key, type(value).__name__)] += 1
                          if isinstance(value, str) and not value.strip():
                              key_blank[key] += 1
                              add_sample(f"blank:{key}", node, depth)

                  children = node.get("children", [])
                  if children is None:
                      children = []
                  if not isinstance(children, list):
                      add_sample("invalid:children", node, depth)
                      children = []

                  url = node.get("url")
                  if isinstance(url, str) and url.strip():
                      normalized = url.strip()
                      url_categories[classify_url(normalized)] += 1
                      parsed = urlparse(normalized)
                      if parsed.hostname:
                          url_hosts[(parsed.scheme.casefold(), parsed.hostname.casefold().rstrip("."))] += 1

                  walk(children, depth=depth + 1)

          walk(payload)
          print("TUIK_ROOT_COUNT=" + str(len(payload)))
          print("TUIK_TOTAL_NODE_COUNT=" + str(total_nodes))
          print("TUIK_MAX_DEPTH=" + str(max_depth))
          for key in ("id", "name", "children", "url"):
              print(f"TUIK_KEY_MISSING={key}|count={key_missing[key]}")
              print(f"TUIK_KEY_NULL={key}|count={key_null[key]}")
              print(f"TUIK_KEY_BLANK={key}|count={key_blank[key]}")
          for (key, type_name), count in sorted(key_types.items()):
              print(f"TUIK_KEY_TYPE={key}|type={type_name}|count={count}")
          for category, count in sorted(url_categories.items()):
              print(f"TUIK_URL_CATEGORY={category}|count={count}")
          for (scheme, host), count in sorted(url_hosts.items()):
              print(f"TUIK_URL_HOST=scheme={scheme}|host={host}|count={count}")
          for bucket, entries in sorted(samples.items()):
              for index, (node_id, name, depth, keys) in enumerate(entries):
                  print(
                      f"TUIK_NODE_SAMPLE={bucket}|index={index}|depth={depth}|"
                      f"id={node_id}|name={name}|keys={keys}"
                  )
          PY
