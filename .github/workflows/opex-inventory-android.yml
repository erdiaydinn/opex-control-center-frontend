name: OPEX Inventory Android

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/opex-inventory-v24"]
    paths:
      - "android-inventory/**"
      - "scripts/security/gradle_dependency_report_to_cyclonedx.py"
      - ".github/workflows/opex-inventory-android.yml"
  pull_request:
    paths:
      - "android-inventory/**"
      - "scripts/security/gradle_dependency_report_to_cyclonedx.py"
      - ".github/workflows/opex-inventory-android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 resolved immutable commit
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 resolved immutable commit
        with:
          gradle-version: "8.9"
      - name: Build test APK
        run: gradle --no-daemon clean assembleDebug lintDebug -POPEX_API_BASE_URL="${{ vars.OPEX_API_BASE_URL }}"
      - name: Resolve release runtime dependency graph
        run: |
          mkdir -p app/build/reports/security
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath \
            > app/build/reports/security/releaseRuntimeClasspath.txt
          python ../scripts/security/gradle_dependency_report_to_cyclonedx.py \
            --input app/build/reports/security/releaseRuntimeClasspath.txt \
            --output app/build/reports/security/eay-inventory-android-prebuild.cdx.json
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OPEX-Inventory-V24.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EAY-Mobile-Preview.apk
      - name: Retain Android pre-build dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: EAY-Inventory-Android-Prebuild-SBOM
          path: |
            android-inventory/app/build/reports/security/releaseRuntimeClasspath.txt
            android-inventory/app/build/reports/security/eay-inventory-android-prebuild.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain legacy terminal debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OPEX-Inventory-V24-APK
          path: android-inventory/app/build/outputs/apk/debug/OPEX-Inventory-V24.apk
          if-no-files-found: error
          retention-days: 30
      - name: Retain EAY Mobile preview APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: EAY-Mobile-Preview-APK
          path: android-inventory/app/build/outputs/apk/debug/EAY-Mobile-Preview.apk
          if-no-files-found: error
          retention-days: 30
