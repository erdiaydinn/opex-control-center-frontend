name: OPEX Inventory Android

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/opex-inventory-v22"]
    paths:
      - "android-inventory/**"
      - ".github/workflows/opex-inventory-android.yml"
  pull_request:
    paths:
      - "android-inventory/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build test APK
        run: gradle --no-daemon clean assembleDebug lintDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OPEX-Inventory-V22.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OPEX-Inventory-V22-APK
          path: android-inventory/app/build/outputs/apk/debug/OPEX-Inventory-V22.apk
          if-no-files-found: error
          retention-days: 30
