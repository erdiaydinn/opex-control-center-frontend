name: P0 Temporary Identity Runtime Repair

on:
  push:
    branches:
      - platform-core/eay-v2-jarvis-orders-policy-transition-guard
    paths:
      - .github/workflows/p0-ci-diagnose-repair.yml

permissions:
  contents: write

jobs:
  repair-identity-runtime-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch and execute CI-only Compose file-secret permission bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/security/identity_gateway_runtime_gate.py")
          source = path.read_text(encoding="utf-8")

          old_head = '''def main() -> None:\n    core_id = ""\n    identity_id = ""\n\n    try:\n        static_gate()\n\n        compose(\n            "build",\n            "identity-gateway",\n            "core-api",\n        )\n\n        compose(\n            "up",\n'''
          new_head = '''def main() -> None:\n    core_id = ""\n    identity_id = ""\n    private_mode = (\n        PRIVATE_PATH.stat().st_mode\n        & 0o777\n    )\n\n    try:\n        static_gate()\n\n        compose(\n            "build",\n            "identity-gateway",\n            "core-api",\n        )\n\n        # Docker Compose file-backed secrets are bind mounts;\n        # uid/gid/mode remapping is not available for file sources.\n        # The generated key is an ephemeral, gitignored CI fixture.\n        # Relax only for the runtime gate, then restore in finally.\n        os.chmod(\n            PRIVATE_PATH,\n            0o644,\n        )\n        print(\n            "IDENTITY_CI_FILE_SECRET_PERMISSION_BRIDGE=ACTIVE"\n        )\n\n        compose(\n            "up",\n'''

          old_tail = '''        compose(\n            "down",\n            "--remove-orphans",\n            check=False,\n        )\n\n\nif __name__ == "__main__":\n'''
          new_tail = '''        compose(\n            "down",\n            "--remove-orphans",\n            check=False,\n        )\n\n        os.chmod(\n            PRIVATE_PATH,\n            private_mode,\n        )\n\n        restored_mode = (\n            PRIVATE_PATH.stat().st_mode\n            & 0o777\n        )\n        if restored_mode != private_mode:\n            raise SystemExit(\n                "IDENTITY_CI_PRIVATE_KEY_MODE_RESTORE_FAILED"\n            )\n\n        print(\n            "IDENTITY_CI_FILE_SECRET_PERMISSION_BRIDGE=RESTORED"\n        )\n\n\nif __name__ == "__main__":\n'''

          for old, new, label in (
              (old_head, new_head, "head"),
              (old_tail, new_tail, "tail"),
          ):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"IDENTITY_GATE_PATCH_{label.upper()}_COUNT={count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          PY

          python -m py_compile scripts/security/identity_gateway_runtime_gate.py
          python -m pip install -e "./services/core-api[dev]"
          python scripts/security/generate_identity_ci_material.py
          python scripts/security/identity_gateway_runtime_gate.py
          test "$(stat -c '%a' runtime/identity-gateway/signing-private-key.pem)" = "600"
          git diff --check
          git add -- scripts/security/identity_gateway_runtime_gate.py
          git diff --cached --check
          git config user.name "eay-platform-ci"
          git config user.email "160104243+erdiaydinn@users.noreply.github.com"
          git commit -m "ci(identity): bridge file-secret permissions in runtime gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
