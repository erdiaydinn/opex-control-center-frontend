name: Planogram foundation

on:
  pull_request:
    paths:
      - "apps/planai/**"
      - ".github/workflows/planogram-foundation.yml"
  push:
    branches:
      - main
      - "agent/planogram-*"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/planai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/planai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/planai/frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
