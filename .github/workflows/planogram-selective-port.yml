name: Planogram Physical Truth Selective Port

on:
  push:
    branches:
      - release/platform-convergence-planogram-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-planogram-v0.1
          fetch-depth: 0
      - name: Fetch canonical Planogram refs
        run: |
          git fetch origin agent/plonagram-foundation-clean-v1-20260729
          git fetch origin agent/planogram-physical-truth-layer-v1
      - name: Port minimum deterministic foundation
        run: |
          git checkout origin/agent/plonagram-foundation-clean-v1-20260729 -- \
            apps/planai/backend/engine.py \
            apps/planai/backend/overrides.py \
            apps/planai/backend/requirements.txt \
            apps/planai/backend/tests/test_engine_foundation_v4.py \
            apps/planai/backend/tests/test_engine_v3.py
      - name: Port physical-truth production gate
        run: |
          git checkout origin/agent/planogram-physical-truth-layer-v1 -- \
            apps/planai/backend/physical_engine.py \
            apps/planai/backend/physical_truth.py \
            apps/planai/backend/physical_truth_audit.py \
            apps/planai/backend/tests/test_physical_engine.py \
            apps/planai/backend/tests/test_physical_truth.py \
            apps/planai/backend/tests/test_physical_truth_audit.py
      - name: Verify source provenance and selective scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/agent/plonagram-foundation-clean-v1-20260729)" = "1609816c877d2b806ef145541288629da73f336e"
          test "$(git rev-parse origin/agent/planogram-physical-truth-layer-v1)" = "bf7d026ee09bb1d46aa8a93daa77771bbd3754bb"
          test ! -e apps/planai/backend/main.py
          test ! -e apps/planai/backend/auth_routes.py
          test ! -e apps/planai/backend/security.py
          test ! -e apps/planai/frontend
          test ! -e src/modules/planogram/PlanogramStudio.jsx
          allowed='^(apps/planai/backend/(engine.py|overrides.py|requirements.txt|physical_engine.py|physical_truth.py|physical_truth_audit.py|tests/test_engine_foundation_v4.py|tests/test_engine_v3.py|tests/test_physical_engine.py|tests/test_physical_truth.py|tests/test_physical_truth_audit.py)|\.github/workflows/planogram-selective-port.yml)$'
          unexpected=$(git status --short | sed 's/^...//' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected Planogram port paths:'
            echo "$unexpected"
            exit 1
          fi
          echo 'PLANOGRAM_SELECTIVE_SCOPE=PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/planai/backend/requirements.txt
      - name: Install Planogram backend dependencies
        working-directory: apps/planai/backend
        run: python -m pip install -r requirements.txt
      - name: Run deterministic foundation and physical-truth tests
        working-directory: apps/planai/backend
        run: |
          python -m unittest \
            tests.test_engine_foundation_v4 \
            tests.test_engine_v3 \
            tests.test_physical_truth \
            tests.test_physical_engine \
            tests.test_physical_truth_audit
      - name: Compile production truth surface
        working-directory: apps/planai/backend
        run: python -m compileall -q engine.py overrides.py physical_truth.py physical_engine.py physical_truth_audit.py
      - name: Verify fail-closed raw-master audit behavior
        working-directory: apps/planai/backend
        run: |
          cat > /tmp/planogram-master.csv <<'CSV'
          sku,product_name,width_cm,height_cm,depth_cm,image_url,storage_type
          SKU-1,Water 6 x 1.5 L,,,,,RAF
          CSV
          set +e
          python physical_truth_audit.py --master /tmp/planogram-master.csv --out /tmp/planogram-audit.json >/tmp/planogram-audit.stdout
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          report=json.load(open('/tmp/planogram-audit.json',encoding='utf-8'))
          assert report['production_ready'] is False
          assert report['products']['dataset_rows'] == 1
          assert report['products']['approved_dimension_coverage_pct'] == 0.0
          assert report['products']['required_fixture_counts'].get('PALLET') == 1
          assert report['blockers']
          print('PLANOGRAM_FAIL_CLOSED_AUDIT=PASS')
          PY
      - name: Remove one-shot workflow and commit selective port
        shell: bash
        run: |
          rm -f .github/workflows/planogram-selective-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(planogram): compose deterministic physical-truth gate'
          git push origin HEAD:release/platform-convergence-planogram-v0.1
