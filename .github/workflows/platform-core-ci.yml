name: Platform Core CI

on:
  push:
    branches:
      - main
      - feature/opex-command-center-v2
      - platform-core/**
  pull_request:
    branches:
      - main
      - feature/opex-command-center-v2
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build frontend
        run: npm run build

  core-api:
    name: Core API and tenant isolation
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5432/opex_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Create non-superuser runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5432/opex_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Lint
        run: ruff check services/core-api
      - name: Secure SQL data-access boundary
        run: pytest -q services/core-api/tests/test_sql_access_boundary.py

      - name: Apply database migrations as migrator
        working-directory: services/core-api
        run: alembic upgrade head

      - name: Enforce AI database role isolation
        run: pytest -q services/core-api/tests/test_ai_database_role_boundary.py

      - name: Test as RLS-bound runtime role
        run: pytest services/core-api/tests

  jarvis-tool-authorization:
    name: Jarvis tool security
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_MIGRATION_DATABASE_URL: postgresql+asyncpg://opex_migrator:opex_migrator@localhost:5433/opex_jarvis_test
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_runtime:opex_runtime@localhost:5433/opex_jarvis_test
      OPEX_REDIS_URL: redis://localhost:6380/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_jarvis_test
          POSTGRES_USER: opex_migrator
          POSTGRES_PASSWORD: opex_migrator
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opex_migrator -d opex_jarvis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Lint new Jarvis security slices
        run: >-
          ruff check
          services/core-api/app/ai_tool_routes.py
          services/core-api/app/core/ai_tool_authorization.py
          services/core-api/app/core/ai_tool_grants.py
          services/core-api/app/core/jarvis_service_identity.py
          services/core-api/app/core/jarvis_service_security.py
          services/core-api/tests/test_ai_tool_authorization.py
          services/core-api/tests/test_ai_tool_grants.py
          services/core-api/tests/test_ai_tool_routes.py
          services/core-api/tests/test_jarvis_service_identity.py
          services/core-api/tests/test_jarvis_service_security.py
          services/core-api/tests/test_jarvis_execution_contract.py
          services/core-api/alembic/versions/0009_ai_tool_permissions.py
      - name: Test Jarvis security boundaries
        run: >-
          pytest -q
          services/core-api/tests/test_ai_tool_authorization.py
          services/core-api/tests/test_ai_tool_grants.py
          services/core-api/tests/test_ai_tool_routes.py
          services/core-api/tests/test_jarvis_service_identity.py
          services/core-api/tests/test_jarvis_service_security.py
          services/core-api/tests/test_jarvis_execution_contract.py
      - name: Verify Jarvis routes are registered
        working-directory: services/core-api
        run: |
          python - <<'PY'
          from app.main import app

          def collect_paths(routes):
              paths = set()
              for route in routes:
                  path = getattr(route, "path", None)
                  if path is not None:
                      paths.add(path)
                  nested = getattr(route, "routes", None)
                  if nested is not None:
                      paths.update(collect_paths(nested))
              return paths

          paths = collect_paths(app.routes)
          assert "/v1/ai/tool-grants" in paths
          assert "/internal/ai/tool-executions/authorize" in paths
          PY
      - name: Create RLS-bound runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opex_migrator:opex_migrator@localhost:5433/opex_jarvis_test"
              )
              try:
                  exists = await connection.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opex_runtime')"
                  )
                  if not exists:
                      await connection.execute(
                          """
                          CREATE ROLE opex_runtime
                          LOGIN PASSWORD 'opex_runtime'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
                          """
                      )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Apply migrations through Jarvis permission revision
        working-directory: services/core-api
        run: alembic upgrade 0009_ai_tool_permissions
      - name: Verify migration head
        working-directory: services/core-api
        run: alembic current

  platform-config:
    name: Platform configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret CI environment
        run: cp .env.example .env
      - name: Validate module catalog
        run: python -m json.tool config/module_catalog.json > /dev/null
      - name: Validate Docker Compose
        run: docker compose -f docker-compose.platform.yml config --quiet
      - name: Build Core API container
        run: docker build -f services/core-api/Dockerfile services/core-api
      - name: Build frontend container
        run: docker build -f Dockerfile .

  identity-gateway-security:
    name: Identity Gateway adversarial boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Identity Gateway test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./services/identity-gateway[dev]"

      - name: Identity Gateway signer contract
        run: pytest -q services/identity-gateway/tests

      - name: Generate ephemeral CI signing material
        run: python scripts/security/generate_identity_ci_material.py

      - name: Production Identity Gateway secret boundary
        run: python scripts/security/production_identity_secret_gate.py

      - name: Identity Gateway Compose runtime adversarial gate
        run: python scripts/security/identity_gateway_runtime_gate.py
