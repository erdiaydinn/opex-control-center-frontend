name: Platform Core CI

on:
  push:
    branches:
      - main
      - feature/opex-command-center-v2
      - platform-core/**
  pull_request:
    branches:
      - main
      - feature/opex-command-center-v2
      - platform-core/**

permissions:
  contents: read

concurrency:
  group: platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build frontend
        run: npm run build

  core-api:
    name: Core API and tenant isolation
    runs-on: ubuntu-latest
    env:
      OPEX_ENVIRONMENT: test
      OPEX_AUTH_MODE: development
      OPEX_DATABASE_URL: postgresql+asyncpg://opex_test:opex_test@localhost:5432/opex_test
      OPEX_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opex_test
          POSTGRES_USER: opex_test
          POSTGRES_PASSWORD: opex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opex_test -d opex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Core API
        run: python -m pip install -e "./services/core-api[dev]"
      - name: Lint
        run: ruff check services/core-api
      - name: Apply database migrations
        working-directory: services/core-api
        run: alembic upgrade head
      - name: Test security and tenant isolation
        run: pytest services/core-api/tests

  platform-config:
    name: Platform configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret CI environment
        run: cp .env.example .env
      - name: Validate module catalog
        run: python -m json.tool config/module_catalog.json > /dev/null
      - name: Validate Docker Compose
        run: docker compose -f docker-compose.platform.yml config --quiet
      - name: Build Core API container
        run: docker build -f services/core-api/Dockerfile services/core-api
      - name: Build frontend container
        run: docker build -f Dockerfile .
