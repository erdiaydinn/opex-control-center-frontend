name: EAY Product Quality Contract

on:
  pull_request:
    branches:
      - release/platform-convergence-v0.1
    paths:
      - "config/module_catalog.json"
      - "config/product_quality_contract.json"
      - "config/ui_i18n_guard.json"
      - "docs/EAY_PRODUCT_QUALITY_STANDARD.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-supply-chain-lock-integrity.mjs"
      - "scripts/validate_product_quality_contract.py"
      - "scripts/test-platform-inclusion.mjs"
      - "scripts/test-no-new-hardcoded-ui-strings.mjs"
      - "src/**"
      - "ops/inventory/**"
      - ".github/workflows/product-quality-contract.yml"
  push:
    branches:
      - release/platform-product-quality-v0.1
      - release/platform-convergence-v0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eay-product-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-contract:
    name: Product quality governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/validate_product_quality_contract.py
      - name: Standard and field scorecard are version controlled
        run: |
          test -s docs/EAY_PRODUCT_QUALITY_STANDARD.md
          grep -q "Critical-task success" docs/EAY_PRODUCT_QUALITY_STANDARD.md
          grep -q "Inventory terminal" docs/EAY_PRODUCT_QUALITY_STANDARD.md
          grep -q "Inclusive Experience Standard" docs/EAY_PRODUCT_QUALITY_STANDARD.md
          grep -q "Jarvis Security Guardian is EAY platform authority" docs/EAY_PRODUCT_QUALITY_STANDARD.md
          grep -q "Expense Management" docs/EAY_PRODUCT_QUALITY_STANDARD.md

  web-shell-regression:
    name: Web shell access, inclusion and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Reject new hard-coded user-facing UI strings
        run: node scripts/test-no-new-hardcoded-ui-strings.mjs
      - name: Supply-chain lock integrity
        run: node scripts/test-supply-chain-lock-integrity.mjs
      - run: npm ci
      - name: Server-authoritative access contract
        run: npm run test:access
      - name: Platform inclusion and locale coverage
        run: node scripts/test-platform-inclusion.mjs
      - name: Accessibility focus trap contract
        run: node scripts/test-accessibility-focus-trap.mjs
      - name: Route accessibility contract
        run: node scripts/test-route-accessibility.mjs
      - name: Skip navigation contract
        run: node scripts/test-skip-navigation.mjs
      - name: Route error boundary contract
        run: node scripts/test-route-error-boundary.mjs
      - name: Intelligence product-state contract
        run: node scripts/test-intelligence-product-states.mjs
      - name: Repository Intelligence registry contract
        run: node scripts/test-repository-intelligence-registry.mjs
      - run: npm run build

  terminal-production-guard:
    name: Inventory terminal production guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sh ops/inventory/verify-android-production.sh
