name: Repository Intelligence Convergence

on:
  pull_request:
    branches:
      - release/platform-convergence-v0.1
    paths:
      - "services/eay-ai-core/app/*repository*"
      - "services/eay-ai-core/config/repository_*.json"
      - "services/eay-ai-core/docs/REPOSITORY_INTELLIGENCE.md"
      - "services/eay-ai-core/tests/test_*repository*.py"
      - "services/eay-ai-core/pyproject.toml"
      - ".github/workflows/repository-intelligence-convergence.yml"
  push:
    branches:
      - release/platform-repository-intelligence-v0.1
      - release/platform-convergence-v0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance-and-memory:
    name: Registry provenance and memory integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q app tests
      - name: Canonical Repository Intelligence acceptance
        run: >-
          pytest -q
          tests/test_repository_intelligence.py
          tests/test_repository_archive_provenance.py
          tests/test_repository_contract_extractor.py
          tests/test_repository_review_snapshot.py
          tests/test_repository_memory_store.py
          tests/test_repository_review_ingestion.py
          tests/test_repository_memory_checkpoint.py
          tests/test_historical_repository_registry.py
          tests/test_github_repository_evidence.py
      - name: Assert canonical archive policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.repository_intelligence import load_repository_registry

          registry = load_repository_registry(Path('config/repository_intelligence_registry.json'))
          provenance = json.loads(Path('config/repository_archive_provenance.json').read_text(encoding='utf-8'))
          assert provenance['records']
          for record in provenance['records']:
              assert record['match'] == 'EXACT_RECOMPUTED_GIT_TREE'
              entry = registry.by_id(record['registry_entry_id'])
              assert entry['identity_status'] == 'VERIFIED'
              assert entry['repository'] == record['canonical_repository']
              assert entry['license'] == record['license']
              assert entry['decision'] != 'ADOPT'
              if record['commercial_use'].startswith('REFERENCE_ONLY'):
                  assert entry['decision'] == 'REFERENCE'
          print('REPOSITORY_ARCHIVE_PROVENANCE=PASS')
          PY

  full-ai-core-regression:
    name: Full AI Core regression with Repository Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/eay-ai-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eay-ai-core/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Preserve modern Jarvis and training authority
        run: |
          python - <<'PY'
          from app.entrypoint import compose_app

          app = compose_app()
          paths = {getattr(route, 'path', '') for route in app.routes}
          assert '/v1/learning/export' in paths
          assert '/v1/model-promotions' in paths
          assert not any(path.startswith('/v1/repository-intelligence') for path in paths)
          print('REPOSITORY_INTELLIGENCE_RUNTIME_AUTHORITY=READ_ONLY_NON_ROUTED')
          PY
          ! grep -F 'repository_intelligence' app/entrypoint.py
          grep -F 'production_promotion_requires_governed_promotion_gate' app/model_registry.py
          test "$(grep -c '@app.post(\"/v1/model-promotions\"' app/main.py)" -eq 1

  source-boundary:
    name: Source and license boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No private material or adoption drift
        working-directory: services/eay-ai-core
        run: |
          test -s config/repository_intelligence_registry.json
          test -s config/repository_archive_provenance.json
          test -s docs/REPOSITORY_INTELLIGENCE.md
          ! grep -R -n -E 'BEGIN (RSA |EC |OPENSSH |PRIVATE )?PRIVATE KEY' app config docs tests
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('config/repository_intelligence_registry.json').read_text(encoding='utf-8'))
          entries = {item['id']: item for item in registry['entries']}
          assert entries['imported-cl4r1t4s']['decision'] == 'REFERENCE'
          assert entries['imported-cl4r1t4s']['license']['spdx'] == 'AGPL-3.0'
          assert entries['imported-computer-lab-automation']['decision'] == 'REFERENCE'
          assert entries['imported-computer-lab-automation']['license']['spdx'] == 'GPL-3.0'
          assert entries['discovered-apache-superset']['canonical_upstream'] == 'apache/superset'
          assert entries['discovered-patika-superset-tr']['canonical_upstream'] == 'apache/superset'
          print('REPOSITORY_LICENSE_BOUNDARY=PASS')
          PY
