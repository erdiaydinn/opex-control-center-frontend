name: Temporary Budget Migration Ruff Repair

on:
  push:
    branches: [agent/budget-migration-ruff-repair]
    paths:
      - ".eay/repair/budget-migration-ruff-trigger.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install exact Ruff version used by Core gate
        run: python -m pip install "ruff==0.16.3"
      - name: Apply focused safe fixes and formatter
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            services/core-api/alembic/versions/0037_budget_planning_authority.py
            services/core-api/alembic/versions/0038_budget_ai_recommendation_authority.py
            services/core-api/alembic/versions/0039_budget_finance_controls.py
            services/core-api/alembic/versions/0040_budget_planning_hardening.py
          )
          ruff check "${targets[@]}" --fix
          ruff format "${targets[@]}"
          ruff check services/core-api --output-format=github
          python -m compileall -q "${targets[@]}"
          git diff --check
      - name: Commit only focused migration repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eay-ci-repair"
          git config user.email "eay-ci-repair@users.noreply.github.com"
          git add \
            services/core-api/alembic/versions/0037_budget_planning_authority.py \
            services/core-api/alembic/versions/0038_budget_ai_recommendation_authority.py \
            services/core-api/alembic/versions/0039_budget_finance_controls.py \
            services/core-api/alembic/versions/0040_budget_planning_hardening.py
          if git diff --cached --quiet; then
            echo "No migration repair diff produced"
            exit 1
          fi
          git commit -m "fix(budget): satisfy full Core Ruff for migrations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
