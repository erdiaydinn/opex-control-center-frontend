name: Workforce Excel Duration Import Fix

on:
  push:
    branches:
      - release/platform-convergence-planogram-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/platform-convergence-planogram-v0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve Excel duration serials and parse date serials explicitly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/workforce/workforceImporters.js')
          source = path.read_text(encoding='utf-8')

          old_read = 'const workbook = XLSX.read(bytes, { type: "array", cellDates: true });'
          new_read = 'const workbook = XLSX.read(bytes, { type: "array", cellDates: false });'
          assert source.count(old_read) == 1, source.count(old_read)
          source = source.replace(old_read, new_read)

          old_date = '''function dateToIso(value) {\n  if (value instanceof Date && !Number.isNaN(value.getTime())) {\n'''
          new_date = '''function dateToIso(value) {\n  if (typeof value === "number" && Number.isFinite(value)) {\n    const parsed = XLSX.SSF.parse_date_code(value);\n    if (!parsed || !parsed.y || !parsed.m || !parsed.d) return "";\n    const month = String(parsed.m).padStart(2, "0");\n    const day = String(parsed.d).padStart(2, "0");\n    return `${parsed.y}-${month}-${day}`;\n  }\n  if (value instanceof Date && !Number.isNaN(value.getTime())) {\n'''
          assert source.count(old_date) == 1, source.count(old_date)
          source = source.replace(old_date, new_date)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Install frontend dependencies
        run: npm ci
      - name: Workforce import regression
        run: npm run test:workforce-imports
      - name: Full Workforce frontend contracts
        run: npm run test:workforce
      - name: Production frontend build
        run: npm run build
      - name: Remove one-shot workflow and commit importer fix
        shell: bash
        run: |
          rm -f .github/workflows/workforce-duration-import-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/workforce/workforceImporters.js .github/workflows/workforce-duration-import-fix.yml
          git diff --cached --check
          git commit -m 'fix(workforce): preserve Excel durations above 24 hours'
          git push origin HEAD:release/platform-convergence-planogram-v0.1
