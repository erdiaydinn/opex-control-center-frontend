name: opex-platform

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${OPEX_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      core-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - internal

  migrate:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal
      - egress

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${OPEX_POSTGRES_DB:-opex}"
      POSTGRES_USER: opex_migrator
      POSTGRES_PASSWORD: "${OPEX_POSTGRES_MIGRATOR_PASSWORD:?Set OPEX_POSTGRES_MIGRATOR_PASSWORD in .env}"
      OPEX_POSTGRES_RUNTIME_PASSWORD: "${OPEX_POSTGRES_RUNTIME_PASSWORD:?Set OPEX_POSTGRES_RUNTIME_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opex_migrator -d ${OPEX_POSTGRES_DB:-opex}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  postgres-backup:
    build:
      context: ./services/postgres-backup
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opex_migrator
      PGPASSWORD: "${OPEX_POSTGRES_MIGRATOR_PASSWORD}"
      OPEX_POSTGRES_DB: "${OPEX_POSTGRES_DB:-opex}"
      OPEX_BACKUP_INTERVAL_HOURS: "${OPEX_BACKUP_INTERVAL_HOURS:-24}"
      OPEX_BACKUP_RETENTION_DAYS: "${OPEX_BACKUP_RETENTION_DAYS:-14}"
      TZ: "${OPEX_BACKUP_TIMEZONE:-Europe/Istanbul}"
      BACKUP_DIR: /backups
    volumes:
      - ./runtime/postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
  platform-alerts:
    build:
      context: ./services/platform-alerts
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      OPEX_PLATFORM_HEALTH_URL: "http://core-api:8000/v1/platform/health"
      OPEX_PLATFORM_HEALTH_TOKEN: "dev.platform-alerts.11111111-1111-1111-1111-111111111111.super_admins"
      OPEX_ALERT_POLL_SECONDS: "${OPEX_ALERT_POLL_SECONDS:-300}"
      OPEX_ALERT_COOLDOWN_HOURS: "${OPEX_ALERT_COOLDOWN_HOURS:-6}"
      OPEX_ALERT_EMAIL_ENABLED: "${OPEX_ALERT_EMAIL_ENABLED:-false}"
      OPEX_SMTP_HOST: "${OPEX_SMTP_HOST:-}"
      OPEX_SMTP_PORT: "${OPEX_SMTP_PORT:-587}"
      OPEX_SMTP_USERNAME: "${OPEX_SMTP_USERNAME:-}"
      OPEX_SMTP_PASSWORD: "${OPEX_SMTP_PASSWORD:-}"
      OPEX_SMTP_FROM: "${OPEX_SMTP_FROM:-EAY OneOps Alerts}"
      OPEX_ALERT_RECIPIENTS: "${OPEX_ALERT_RECIPIENTS:-}"
      OPEX_SMTP_STARTTLS: "${OPEX_SMTP_STARTTLS:-true}"
      OPEX_ALERT_STATE_FILE: "/state/alert-state.json"
    volumes:
      - platform_alert_state:/state
    depends_on:
      core-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - egress

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: "1"
      INFO: "0"
      EVENTS: "0"
      POST: "0"
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped
    networks:
      - monitoring

  platform-agent:
    build:
      context: ./services/platform-agent
      dockerfile: Dockerfile
    environment:
      DOCKER_API_URL: "http://docker-socket-proxy:2375"
      BACKUP_STATUS_FILE: "/backups/backup-status.json"
    volumes:
      - ./runtime/postgres-backups:/backups:ro
    expose:
      - "8010"
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped
    networks:
      - monitoring
      - internal
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    networks:
      - internal
      - egress

networks:
  edge:
  egress:
  monitoring:
    internal: true
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  postgres_backups:
  platform_alert_state:
