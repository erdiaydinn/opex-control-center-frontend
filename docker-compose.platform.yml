name: opex-platform

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${OPEX_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      core-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - internal

  migrate:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal
      - egress

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${OPEX_POSTGRES_DB:-opex}"
      POSTGRES_USER: opex_migrator
      POSTGRES_PASSWORD: "${OPEX_POSTGRES_MIGRATOR_PASSWORD:?Set OPEX_POSTGRES_MIGRATOR_PASSWORD in .env}"
      OPEX_POSTGRES_RUNTIME_PASSWORD: "${OPEX_POSTGRES_RUNTIME_PASSWORD:?Set OPEX_POSTGRES_RUNTIME_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opex_migrator -d ${OPEX_POSTGRES_DB:-opex}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    networks:
      - internal
      - egress

networks:
  edge:
  egress:
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  ollama_data:
