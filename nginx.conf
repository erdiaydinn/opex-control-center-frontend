server {
    listen 80;
    server_name _;
    server_tokens off;

    # Workforce imports are parsed in the browser and sent to the API as JSON.
    # Application schemas and client-side batching still cap row counts; this is
    # only the gateway ceiling for a single validated request.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Document-serving security policy. Camera and geolocation remain same-origin
    # because Field Intelligence and Workforce legitimately require them. The API
    # applies tighter route-specific Permissions-Policy headers to API responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Rendered at container startup by the official nginx envsubst template
        # entrypoint. Never accepted from the browser.
        proxy_set_header X-DockOS-Gateway ${DOCKOS_GATEWAY_SECRET};
    }

    # Force the SPA shell to revalidate so users do not remain pinned to a stale
    # authorization/UI bundle after deployment. Fingerprinted assets retain normal
    # browser validation semantics.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
