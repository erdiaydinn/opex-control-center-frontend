server {
    listen 80;
    server_name _;

    # Workforce imports are parsed in the browser and sent to the API as JSON.
    # The JSON representation is larger than the source XLSX, so the nginx
    # default (1 MiB) rejects legitimate bulk imports with HTTP 413.
    # Application schemas and client-side batching still cap row counts; this
    # limit is only the gateway ceiling for a single validated batch.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DockOS-Gateway ${DOCKOS_GATEWAY_SECRET};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
