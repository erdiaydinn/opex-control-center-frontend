[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eay-ai-core"
version = "0.1.0"
description = "Local-first, regulatory-aware Food & Retail Operations Intelligence service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "numpy>=1.26,<3",
]
bigquery = [
  "google-cloud-bigquery>=3.42,<4",
]
voice-onnx = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.16.1,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "models*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
