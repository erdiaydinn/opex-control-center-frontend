[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eay-ai-core"
version = "0.1.0"
description = "Local-first, regulatory-aware Food & Retail Operations Intelligence service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "numpy>=1.26,<3",
]
bigquery = [
  "google-cloud-bigquery>=3.42,<4",
]
computer-use = [
  "playwright>=1.60,<2",
  "keyring>=25.7,<26",
]
spatial = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "mediapipe>=0.10,<1",
]
training = [
  "torch>=2.6,<3",
  "transformers>=4.57,<6",
  "datasets>=3,<5",
  "peft>=0.15,<1",
  "trl>=0.28,<1",
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
]
voice-onnx = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.16.1,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "models*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
